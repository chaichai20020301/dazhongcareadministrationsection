<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light;
    --page:      #eef0ea;   /* 版面底色 */
    --surface:   #ffffff;   /* 卡片、面板 */
    --surface-2: #f7f8f4;   /* 面板標題列、次要區塊 */
    --ink:       #18251a;
    --ink-2:     #43503f;
    --ink-3:     #6f7a6b;
    --muted:     #949b8e;
    --line:      rgba(31,42,28,.11);
    --line-2:    rgba(31,42,28,.08);
    --brand:     #3d7534;   /* logo 葉綠，主色 */
    --brand-dk:  #2f5c28;
    --leaf-bg:   rgba(122,193,67,.18);
    --teal:      #4c9c8b;   /* logo 水彩青，保管中 */
    --teal-bg:   rgba(76,156,139,.16);
    --warning:   #c8901f;   /* 提醒／今天到期 */
    --warning-bg:rgba(200,144,31,.18);
    --warning-ink:#7a4f11;
    --critical:  #9e3535;   /* 緊急／逾期 */
    --grey:      #b6bcae;   /* 已完成、已結案 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--page); color: var(--ink); font-size: 15px;
  }
  a { color: var(--brand); }
  a:hover { color: var(--brand-dk); }

  /* ---- 版面骨架：桌機左側邊欄、手機底部列 ---- */
  .app { display: flex; min-height: 100vh; }
  .side {
    width: 206px; flex: 0 0 206px; background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 18px 0;
    position: sticky; top: 0; height: 100vh;
  }
  .brandbox { padding: 0 16px 16px; }
  .brandbox img { width: 100%; height: auto; display: block; }
  .brandbox .sub { font-size: 11px; color: #8a8f83; margin-top: 8px; }
  .navlist { display: flex; flex-direction: column; padding: 0 8px; gap: 1px; }
  .navlist button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; border: none; border-left: 3px solid transparent;
    border-radius: 6px; padding: 10px 12px; cursor: pointer;
    font: 400 13.5px "Noto Sans TC", sans-serif; color: var(--ink-2);
  }
  .navlist button:hover { background: var(--surface-2); }
  .navlist button.on {
    background: rgba(61,117,52,.11); color: var(--brand-dk);
    font-weight: 600; border-left-color: var(--brand);
  }
  .navlist .n { margin-left: auto; font: 500 11px "IBM Plex Mono", monospace; color: var(--muted); }
  .sidefoot { margin-top: auto; padding: 0 16px; }
  .sidefoot .who {
    font-size: 11.5px; line-height: 1.5; color: #8a8f83;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-2);
  }
  .main { flex: 1 1 auto; min-width: 0; padding: 24px 26px 40px; }
  h1.page { margin: 0 0 16px; font: 600 20px/1.3 "Noto Sans TC", sans-serif; }
  h1.page .note { font: 400 13px "Noto Sans TC", sans-serif; color: var(--ink-3); margin-left: 10px; }

  .mobilebar, .fab { display: none; }

  @media (max-width: 760px) {
    .app { display: block; }
    .side {
      position: fixed; bottom: 0; left: 0; right: 0; top: auto;
      width: auto; flex: none; height: auto; padding: 6px 4px 8px;
      flex-direction: row; border-right: none; border-top: 1px solid var(--line);
      z-index: 60; box-shadow: 0 -2px 10px rgba(31,42,28,.06);
    }
    .brandbox, .sidefoot { display: none; }
    .navlist { flex-direction: row; flex: 1 1 auto; padding: 0; gap: 0; }
    .navlist button {
      flex: 1 1 0; min-width: 0; flex-direction: column; gap: 3px;
      justify-content: center; text-align: center; padding: 7px 2px;
      border-left: none; border-radius: 8px; font-size: 11.5px;
    }
    .navlist button.on { border-left: none; }
    .navlist .n { margin: 0; font-size: 10.5px; }
    .main { padding: 14px 14px 92px; }
    .mobilebar {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding: 10px 14px; position: sticky; top: 0; z-index: 50;
    }
    .mobilebar img { height: 22px; width: auto; display: block; }
    .mobilebar .who { margin-left: auto; font-size: 11.5px; color: #8a8f83; }
    .fab {
      display: inline-block;
      position: fixed; right: 14px; bottom: 76px; z-index: 61;
      background: var(--brand); color: #fff; border: none; border-radius: 26px;
      padding: 13px 20px; font: 500 13.5px "Noto Sans TC", sans-serif;
      box-shadow: 0 4px 14px rgba(31,42,28,.24); cursor: pointer;
    }
  }

  /* ---- 面板 ---- */
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .panel h3 {
    margin: 0 0 12px; font: 600 13.5px/1.3 "Noto Sans TC", sans-serif;
    color: var(--ink-2); letter-spacing: .04em;
  }
  .section-title {
    font: 600 13.5px/1.3 "Noto Sans TC", sans-serif; color: var(--ink-2);
    letter-spacing: .04em; margin: 20px 0 8px;
  }
  .section-title span { font-weight: 500; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .empty { color: var(--muted); padding: 16px; text-align: center; font-size: 14px; }

  /* ---- 儀表板：今日待辦置頂，右欄放概況 ---- */
  .dash { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .dash { grid-template-columns: 1fr; } }
  .panel.today { padding: 0; overflow: hidden; }
  .panel.today h3 {
    margin: 0; padding: 12px 16px; background: var(--surface-2);
    border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink);
    letter-spacing: 0; display: flex; align-items: center; gap: 9px;
  }
  .panel.today h3 .late { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--critical); }
  .todo {
    display: grid; grid-template-columns: 108px 1fr auto;
    align-items: center; gap: 14px; padding: 13px 16px;
    border-bottom: 1px solid var(--line-2); border-left: 3px solid var(--brand);
  }
  .todo:last-child { border-bottom: none; }
  .todo.p緊急 { border-left-color: var(--critical); }
  .todo.p提醒 { border-left-color: var(--warning); }
  .todo .when {
    font: 600 11.5px/1 "Noto Sans TC", sans-serif; text-align: center;
    padding: 5px 7px; border-radius: 3px; background: rgba(31,42,28,.06); color: var(--ink-2);
  }
  .todo .when.late { background: var(--critical); color: #fff; }
  .todo .when.now  { background: #e3c063; color: #4a3608; }
  .todo .what { min-width: 0; }
  .todo .what .txt { font-size: 14.5px; line-height: 1.55; }
  .todo .what .sub { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
  .todo button {
    background: var(--brand); color: #fff; border: none; border-radius: 5px;
    padding: 8px 14px; font: 500 13px "Noto Sans TC", sans-serif; cursor: pointer; white-space: nowrap;
  }
  @media (max-width: 520px) {
    .todo { grid-template-columns: 1fr; gap: 8px; }
    .todo button { width: 100%; padding: 12px; }
  }

  /* 概況：原本的統計磚，改成右欄一條條的量值，不搶今日待辦的視線 */
  .tiles { display: flex; flex-direction: column; }
  .tile {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 0; border-top: 1px solid var(--line-2);
  }
  .tile:first-child { border-top: none; }
  .tile .label { font-size: 13px; color: var(--ink-2); }
  .tile .sub { display: none; }
  .tile .value { font: 500 19px "IBM Plex Mono", monospace; color: var(--ink); }
  .tile .value.alert { color: var(--critical); }
  .tile .value.ok { color: var(--brand); }
  .tile.clickable { cursor: pointer; }
  .tile.clickable:hover .label { color: var(--brand); }
  @media (max-width: 900px) {
    .tiles { flex-direction: row; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .tile { flex: 1 1 0; min-width: 0; flex-direction: column-reverse; align-items: center;
      gap: 2px; padding: 9px 6px; border-top: none; border-right: 1px solid var(--line-2); text-align: center; }
    .tile:last-child { border-right: none; }
    .tile .label { font-size: 10.5px; color: var(--ink-3); }
    .panel.tilepanel { padding: 0; border: none; background: transparent; }
  }

  .next4 { display: grid; grid-template-columns: 1fr; }
  .next4 > .panel { padding: 9px 0; margin: 0; border: none; border-top: 1px solid var(--line-2); border-radius: 0; background: transparent; }
  .next4 > .panel:first-child { border-top: none; }
  .next4 h3 {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px;
    margin: 0 0 3px; font-size: 12.5px; color: var(--ink); letter-spacing: 0;
  }
  .next4 h3 .cnt { margin-left: auto; font: 500 11.5px "IBM Plex Mono", monospace; color: var(--ink-3); }
  .next4 .empty { padding: 2px 0; text-align: left; font-size: 12.5px; }

  /* ---- 表單元件 ---- */
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .row > * { flex: 1 1 140px; min-width: 0; }
  input, select, textarea {
    font-family: inherit; font-size: 14px; padding: 9px 11px;
    border: 1px solid rgba(31,42,28,.16); border-radius: 6px;
    background: var(--surface); color: var(--ink);
  }
  input::placeholder, textarea::placeholder { color: #9aa094; }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(61,117,52,.35); outline-offset: -1px; border-color: var(--brand); }
  textarea { width: 100%; resize: vertical; min-height: 66px; line-height: 1.6; }
  button { font-family: inherit; font-size: 14px; }
  #addBtn, #tplSave, #cusSave, #ruleSave, #eqSave, #newBtn, .primary {
    background: var(--brand); color: #fff; border: none; border-radius: 6px;
    font: 500 13.5px "Noto Sans TC", sans-serif; padding: 10px 20px; cursor: pointer;
  }
  #addBtn:disabled, #tplSave:disabled, #cusSave:disabled,
  #ruleSave:disabled, #eqSave:disabled, .primary:disabled { opacity: .5; }
  button.ghost {
    background: transparent; color: var(--ink-2); border: 1px solid rgba(31,42,28,.17);
    border-radius: 6px; padding: 8px 13px; font: 400 13px "Noto Sans TC", sans-serif; cursor: pointer;
  }
  button.ghost:hover { background: var(--surface-2); }
  button.ghost.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
    background: var(--brand); color: #fff; font: 500 12.5px "Noto Sans TC", sans-serif;
    padding: 7px 8px 7px 11px; border-radius: 6px;
  }
  .chip button { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
  .checkline {
    display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
    font: 400 13px "Noto Sans TC", sans-serif; color: var(--ink-2); cursor: pointer; padding: 0 4px;
  }
  .checkline input { width: 15px; height: 15px; margin: 0; padding: 0; accent-color: var(--brand); }
  #status { font-size: 13px; color: var(--muted); min-height: 16px; }
  .hidden { display: none !important; }

  /* ---- 子任務輸入區（新增交班時就把步驟拆好）---- */
  .subblock {
    margin-top: 12px; padding: 12px 13px; background: var(--surface-2);
    border: 1px solid var(--line-2); border-radius: 8px;
  }
  .subblock .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .subblock .head b { font: 600 12.5px "Noto Sans TC", sans-serif; color: var(--ink-2); letter-spacing: .04em; }
  .subblock .head .hint { font-size: 11.5px; color: #8a8f83; }
  .subblock .head .cnt { margin-left: auto; font: 500 11.5px "IBM Plex Mono", monospace; color: var(--ink-3); }
  .subrow {
    display: grid; grid-template-columns: 20px minmax(0,1fr) 34px;
    gap: 7px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line-2);
  }
  .subrow .idx { font: 500 12px/2.5 "IBM Plex Mono", monospace; color: var(--muted); text-align: right; }
  .subrow .fields { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .subrow .fields .line2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 158px; gap: 6px; }
  @media (max-width: 700px) { .subrow .fields .line2 { grid-template-columns: 1fr 1fr; } }
  .subrow input, .subrow select { width: 100%; }
  .subrow .fields .line2 input, .subrow .fields .line2 select { font-size: 13.5px; padding: 8px 10px; }
  .subrow .del {
    background: transparent; border: 1px solid rgba(31,42,28,.16); border-radius: 6px;
    width: 34px; height: 34px; font-size: 15px; line-height: 1; color: var(--ink-3); cursor: pointer;
  }
  #subAdd {
    margin-top: 9px; background: var(--surface); border: 1px dashed rgba(31,42,28,.28);
    border-radius: 6px; padding: 8px 14px; font: 500 12.5px "Noto Sans TC", sans-serif;
    color: var(--brand); cursor: pointer;
  }

  /* ---- 卡片：左側色條一律代表重要性 ---- */
  .item {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--brand); border-radius: 8px;
    padding: 13px 15px; margin-bottom: 8px;
  }
  .item.緊急 { border-left-color: var(--critical); }
  .item.提醒 { border-left-color: var(--warning); }
  .item.done { opacity: .62; border-left-color: var(--grey); }
  .item.done .content { text-decoration: line-through; }
  .item.editing { box-shadow: 0 0 0 2px rgba(200,144,31,.35); }
  .item.editing::before {
    content: "編輯中"; display: block; margin-bottom: 9px;
    font: 500 11.5px "Noto Sans TC", sans-serif; color: var(--warning-ink);
  }
  .item.editing .primary, .item.editing #e_save {
    background: var(--brand); color: #fff; border: none; border-radius: 6px;
    font: 500 13px "Noto Sans TC", sans-serif; padding: 8px 18px; cursor: pointer;
  }
  .content { white-space: pre-wrap; margin: 6px 0; font-size: 14.5px; line-height: 1.6; }
  .meta {
    font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap;
    gap: 12px; line-height: 1.5; margin-top: 4px;
  }
  .actions { margin-top: 9px; display: flex; gap: 7px; flex-wrap: wrap; }
  .actions button { padding: 6px 11px; font-size: 12.5px; }
  .tag {
    display: inline-block; font: 400 11.5px/1 "Noto Sans TC", sans-serif;
    padding: 4px 7px; border-radius: 3px; background: rgba(31,42,28,.06);
    color: var(--ink-2); margin: 0 5px 4px 0;
  }
  .tag.緊急 { color: var(--critical); border: 1px solid rgba(158,53,53,.3); background: transparent; font-weight: 500; padding: 3px 6px; }
  .tag.提醒 { background: var(--warning-bg); color: var(--warning-ink); font-weight: 500; }
  .tag.resident { background: var(--leaf-bg); color: var(--brand-dk); font-weight: 500; }
  .tag.person { background: rgba(31,42,28,.08); color: #3d4a44; font-weight: 500; }
  .tag.progress { background: var(--brand); color: #fff; font-weight: 500; }
  .tag.progress.all { background: var(--teal); }
  .tag.overdue { background: #e3c063; color: #4a3608; font-weight: 500; }
  .tag.late { background: var(--critical); color: #fff; font-weight: 500; }
  .tag.held { background: var(--teal-bg); color: #2c5b52; font-weight: 500; }
  .tag.voided { background: var(--critical); color: #fff; font-weight: 500; }
  .tag.repair { background: var(--warning-bg); color: var(--warning-ink); font-weight: 500; }
  .tag.reopened { background: #e3c063; color: #4a3608; font-weight: 500; }
  .tag.eq-todo { background: var(--teal-bg); color: #2c5b52; font-weight: 500; }

  /* 子任務縮排 */
  .kids { margin: -2px 0 8px 26px; padding-left: 12px; border-left: 2px solid rgba(31,42,28,.13); }
  .item.child { margin-bottom: 6px; padding: 10px 13px; }
  .item.child .content { font-size: 13.5px; }

  .subform { margin-top: 11px; padding-top: 11px; border-top: 1px dashed rgba(31,42,28,.16); }
  .subform #s_save, .subform #r_save, .subform #v_save, .subform #q_go {
    background: var(--brand); color: #fff; border: none; border-radius: 6px;
    font: 500 13px "Noto Sans TC", sans-serif; padding: 9px 16px; flex: 0 0 auto; cursor: pointer;
  }
  .subform .ghost { flex: 0 0 auto; }

  /* 保管物 */
  .item.held { border-left-color: var(--teal); }
  .item.past { opacity: .66; border-left-color: var(--grey); }
  .item.voided { border-left-color: var(--critical); }
  .item.voided .content { text-decoration: line-through; }

  /* 設備工單 */
  .item.eq-todo { border-left-color: var(--warning); }
  .item.eq-done, .item.eq-cancel { border-left-color: var(--grey); opacity: .62; }
  .item.eq-cancel .content { text-decoration: line-through; }

  /* 長期規則：依住民折疊 */
  .rgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .rhead { display: flex; align-items: center; gap: 10px; padding: 11px 15px; cursor: pointer; user-select: none; }
  .rgroup.open .rhead { background: var(--surface-2); }
  .rhead:hover { background: var(--surface-2); }
  .rhead .caret { color: var(--muted); font: 400 11px "IBM Plex Mono", monospace; flex: 0 0 auto; transition: transform .15s; display: inline-block; }
  .rgroup.open .rhead .caret { transform: rotate(90deg); }
  .rhead .rcount { font-size: 12.5px; color: var(--ink-3); margin-left: auto; }
  .rbody { padding: 0 15px 8px; }
  .rule { border-top: 1px solid var(--line-2); padding: 11px 0; }
  .rule .rtext { font-size: 14px; line-height: 1.6; margin: 6px 0 0; white-space: pre-wrap; }
  .rule.off { opacity: .55; }
  .rule.off .rtext { text-decoration: line-through; }
  .rule .ractions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .rule .ractions button { font-size: 12px; padding: 4px 10px; }

  /* ---- 處理中 ---- */
  #busy { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(238,240,234,.45); }
  #busy.hidden { display: none; }
  .busy-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 22px; display: flex; align-items: center; gap: 12px;
    font-size: 15px; color: var(--ink-2); box-shadow: 0 8px 30px rgba(31,42,28,.14);
  }
  .spin { width: 22px; height: 22px; flex: 0 0 auto; border: 3px solid rgba(31,42,28,.12); border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 進入前的門 ---- */
  .gate.hidden { display: none; }
  .gate {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(238,240,234,.75);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .gate-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 26px; width: 100%; max-width: 380px;
    box-shadow: 0 12px 40px rgba(31,42,28,.16); text-align: center;
  }
  .gate-card img { width: 150px; height: auto; display: block; margin: 0 auto 16px; }
  .gate-card h3 { font: 600 17px "Noto Sans TC", sans-serif; color: var(--ink); margin: 0 0 18px; }
  .gate-card input { width: 100%; margin-bottom: 10px; padding: 11px 12px; text-align: center; }
  .gate-card #whoSave {
    width: 100%; margin-top: 6px; padding: 12px; background: var(--brand); color: #fff;
    border: none; border-radius: 6px; font: 500 14px "Noto Sans TC", sans-serif; cursor: pointer;
  }
  .gate-card #whoSave:disabled { opacity: .5; }
  #gateMsg { font-size: 13px; color: var(--critical); min-height: 18px; margin-top: 10px; }
  .gate-hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  #askBox .gate-card { text-align: left; }
</style>

<script>
/* ================= API 橋接層 =================
 * 從 /exec 開啟時，google.script.run 原生存在，這段直接跳過。
 * 貼在協作平台（內嵌程式碼）時沒有原生通道，改用 fetch 匿名呼叫後端 API。
 */
(function () {
  if (window.google && window.google.script && window.google.script.run) return;

  var API_URL = 'https://script.google.com/macros/s/AKfycby_XulC71Nz1aPSSzlPxuSNfd0DOmAaJF2FJbphmRGyfFTkuhcUFvhyVgfG215SYIaZ/exec';

  var METHODS = ['getCurrentUser', 'verifyPass', 'getItems', 'getResidents',
    'addItem', 'addItemWithSubs', 'toggleDone', 'updateItem', 'deleteItem',
    'getTemplates', 'saveTemplate', 'toggleTemplate', 'deleteTemplate',
    'getCustody', 'addCustody', 'updateCustody', 'returnCustody', 'voidCustody',
    'getRules', 'addRule', 'updateRule', 'toggleRule', 'deleteRule',
    'getWorkOrders', 'addWorkOrder', 'updateWorkOrder', 'transitionWork'];

  function makeRunner() {
    var onOk = function () {};
    var onErr = function (e) { console.error(e); };
    var runner = {
      withSuccessHandler: function (fn) { onOk = fn; return runner; },
      withFailureHandler: function (fn) { onErr = fn; return runner; }
    };
    METHODS.forEach(function (name) {
      runner[name] = function () {
        var args = Array.prototype.slice.call(arguments);
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: name, args: args })
        })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.ok) onOk(res.data);
          else onErr({ message: res.error || '不明錯誤' });
        })
        .catch(function (e) {
          onErr({ message: '連線失敗，請檢查網路後重試（' + e.message + '）' });
        });
      };
    });
    return runner;
  }

  window.google = { script: {} };
  Object.defineProperty(window.google.script, 'run', { get: makeRunner });
})();

var ITEMS = [], ME = {}, RESIDENTS = [];
var EDITING_ID = null;
var TEMPLATES = [], EDITING_TPL = null;
var SUB_PARENT = null;
var CUSTODY = [], EDITING_CUS = null;
var RULES = [], EDITING_RULE = null;
var WORK = [], EDITING_EQ = null, SHOW_CLOSED_EQ = false;
var EQ_ACTION = { id: null, mode: null };
var RULE_OPEN = {};
var CUS_ACTION = { id: null, mode: null };
var MAX_DEPTH = 2;
var OVERDUE_DAYS = 3;
var QUICK_FILTER = '';
var SUB_SEQ = 0;   // 新增交班時的子任務列編號

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function setStatus(m) { document.getElementById('status').textContent = m || ''; }

function askConfirm(msg, onYes) {
  var box = document.getElementById('askBox');
  document.getElementById('askMsg').textContent = msg;
  box.classList.remove('hidden');
  var close = function () { box.classList.add('hidden'); };
  document.getElementById('askYes').onclick = function () { close(); onYes(); };
  document.getElementById('askNo').onclick = close;
}

var BUSY = 0;
function showBusy() {
  BUSY++;
  document.getElementById('busy').classList.remove('hidden');
}
function hideBusy() {
  BUSY = Math.max(0, BUSY - 1);
  if (BUSY === 0) document.getElementById('busy').classList.add('hidden');
}

var API_METHODS = ['getItems', 'getResidents', 'addItem', 'addItemWithSubs',
  'toggleDone', 'updateItem', 'deleteItem', 'getTemplates', 'saveTemplate',
  'toggleTemplate', 'deleteTemplate',
  'getCustody', 'addCustody', 'updateCustody', 'returnCustody', 'voidCustody',
  'getRules', 'addRule', 'updateRule', 'toggleRule', 'deleteRule',
  'getWorkOrders', 'addWorkOrder', 'updateWorkOrder', 'transitionWork'];

function api() {
  var base = google.script.run;
  var okFn = function () {}, failFn = function () {};
  var settled = false;
  var done = function () { if (!settled) { settled = true; hideBusy(); } };

  var runner = {
    withSuccessHandler: function (fn) { okFn = fn; return runner; },
    withFailureHandler: function (fn) { failFn = fn; return runner; }
  };
  API_METHODS.forEach(function (name) {
    runner[name] = function () {
      // 後端還沒有這支函式（例如新版前端配舊版後端）：
      // 原生 google.script.run 會直接丟 TypeError，遮罩就永遠收不起來。
      // 統一成跟橋接層一樣的錯誤訊息，呼叫端才有機會退回舊做法。
      if (typeof base[name] !== 'function') {
        failFn({ message: '未知的動作：' + name });
        return;
      }
      showBusy();
      var r = base
        .withSuccessHandler(function (d) { done(); okFn(d); })
        .withFailureHandler(function (e) { done(); failFn(e); });
      r[name].apply(r, arguments);
    };
  });
  return runner;
}

/* ---- 進入前的門 ---- */
var MY_NAME = '', MY_CODE = '';
var NAME_KEY = 'handover_name', CODE_KEY = 'handover_code';

function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 無痕模式 */ } }

function resolveIdentity() {
  MY_CODE = lsGet(CODE_KEY);
  MY_NAME = ME.email || lsGet(NAME_KEY);

  var needPass = ME.needPass && !MY_CODE;
  var needName = !ME.email && !MY_NAME;
  if (!needPass && !needName) { showWhoTag(); return true; }

  openGate();
  return false;
}

function openGate() {
  document.getElementById('whoBar').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.getElementById('passRow').classList.toggle('hidden', !ME.needPass);
  document.getElementById('nameRow').classList.toggle('hidden', !!ME.email);
  document.getElementById('gateTitle').textContent =
    ME.needPass && !ME.email ? '請輸入通行碼並填寫你的名字'
      : (ME.needPass ? '請輸入通行碼' : '請先填寫你的名字');
  document.getElementById('passCode').value = MY_CODE || '';
  document.getElementById('whoName').value = MY_NAME || '';
  setTimeout(function () {
    var f = ME.needPass && !MY_CODE ? 'passCode' : 'whoName';
    var e = document.getElementById(f);
    if (e) e.focus();
  }, 0);
}

function showWhoTag() {
  document.getElementById('whoText').textContent = MY_NAME || '—';
  document.getElementById('whoTextM').textContent = MY_NAME || '';
  var tag = document.getElementById('whoTag');
  // 公司帳號登入時名字不能自己改，隱藏「更改」
  tag.classList.toggle('hidden', !!ME.email);
  tag.onclick = openGate;
}

function saveWho() {
  var msg = document.getElementById('gateMsg');
  var name = document.getElementById('whoName').value.trim();
  var code = document.getElementById('passCode').value.trim();
  msg.textContent = '';

  if (!ME.email && !name) {
    msg.textContent = '請填寫你的名字';
    document.getElementById('whoName').focus();
    return;
  }
  if (ME.needPass && !code) {
    msg.textContent = '請輸入通行碼';
    document.getElementById('passCode').focus();
    return;
  }

  var btn = document.getElementById('whoSave');
  btn.disabled = true;
  msg.style.color = 'var(--muted)';
  msg.textContent = '驗證中…';

  var proceed = function () {
    btn.disabled = false;
    msg.textContent = '';
    MY_NAME = ME.email || name;
    MY_CODE = code;
    if (!ME.email) lsSet(NAME_KEY, name);
    lsSet(CODE_KEY, code);
    document.getElementById('whoBar').classList.add('hidden');
    document.body.style.overflow = '';
    showWhoTag();
    load();
    loadResidents();
    if (TEMPLATES.length === 0) TEMPLATES = [];
  };

  if (!ME.needPass) { proceed(); return; }

  google.script.run
    .withSuccessHandler(proceed)
    .withFailureHandler(function (e) {
      btn.disabled = false;
      msg.style.color = 'var(--critical)';
      msg.textContent = e.message.indexOf('通行碼') >= 0 ? '通行碼錯誤，請再試一次' : e.message;
      document.getElementById('passCode').select();
    })
    .verifyPass(code);
}

function handleAuthError(e) {
  if (String(e.message || '').indexOf('通行碼') < 0) return false;
  MY_CODE = '';
  lsSet(CODE_KEY, '');
  ITEMS = [];
  openGate();
  document.getElementById('gateMsg').style.color = 'var(--critical)';
  document.getElementById('gateMsg').textContent = '通行碼已變更，請重新輸入';
  return true;
}

var TABS = { dash: 'Dash', list: 'List',
  custody: 'Custody', rules: 'Rules', equip: 'Equip' };
var TPL_OPEN = false;

function showTab(t) {
  Object.keys(TABS).forEach(function (k) {
    var on = k === t;
    document.getElementById('view' + TABS[k]).classList.toggle('hidden', !on);
    document.getElementById('tab' + TABS[k]).classList.toggle('on', on);
  });
  if (t === 'custody' && !CUSTODY.length) loadCustody();
  if (t === 'rules' && !RULES.length) loadRules();
  if (t === 'equip' && !WORK.length) loadWork();
  window.scrollTo(0, 0);
}

/** 側邊欄的「＋ 新增交班」：跳到清單分頁並把游標放進內容欄 */
function jumpToNew() {

}

function init() {
  google.script.run.withSuccessHandler(function (u) {
    ME = u;
    fillSelect('category', u.categories);
    fillSelect('priority', u.priorities, '一般');
    var f = document.getElementById('filterCat');
    u.categories.forEach(function (c) {
      f.insertAdjacentHTML('beforeend', '<option>' + esc(c) + '</option>');
    });
    initTplForm();
    initCustodyForm();
    initRuleForm();
    initEqForm();
    if (resolveIdentity()) { load(); loadResidents(); }
  }).getCurrentUser();
}

function fillSelect(id, arr, def) {
  document.getElementById(id).innerHTML = (arr || []).map(function (v) {
    return '<option' + (v === def ? ' selected' : '') + '>' + esc(v) + '</option>';
  }).join('');
}

function load() {
  setStatus('載入中…');
  api()
    .withSuccessHandler(function (items) { ITEMS = items; setStatus(''); renderAll(); })
    .withFailureHandler(function (e) {
      if (handleAuthError(e)) return;
      setStatus('讀取失敗：' + e.message);
    })
    .getItems(MY_CODE);
}

function loadResidents() {
  api()
    .withSuccessHandler(function (list) {
      RESIDENTS = list || [];
      renderResidentOptions();
    })
    .withFailureHandler(function () { /* 名單只是建議 */ })
    .getResidents(MY_CODE);
}

function renderResidentOptions() {
  document.getElementById('residentList').innerHTML = RESIDENTS.map(function (r) {
    return '<option value="' + esc(r) + '">';
  }).join('');

  ['filterResident'].forEach(function (id) {
    var sel = document.getElementById(id);
    var cur = sel.value;
    sel.innerHTML = '<option value="">全部住民</option>' +
      RESIDENTS.map(function (r) {
        return '<option' + (r === cur ? ' selected' : '') + '>' + esc(r) + '</option>';
      }).join('');
    if (cur && sel.value !== cur) sel.value = '';
  });
}

function renderAll() { renderDash(); renderList(); renderNavCounts(); }

/** 側邊欄的數字：一眼看出哪個分頁有事情等著 */
function renderNavCounts() {
  var pending = ITEMS.filter(function (i) { return i.status !== '已完成'; }).length;
  document.getElementById('navListN').textContent = pending || '';
  var held = CUSTODY.filter(function (c) { return c.status === '保管中'; }).length;
  document.getElementById('navCusN').textContent = held || '';

/* ================= 新增交班的子任務列 ================= */

/** 加一列子任務。分類與重要性預設沿用主事項當下的選擇，可再自行改 */
function addSubRow() {
  SUB_SEQ++;
  var cats = (ME.categories || []).map(function (c) {
    return '<option' + (c === document.getElementById('category').value ? ' selected' : '') + '>' + esc(c) + '</option>';
  }).join('');
  var pris = (ME.priorities || []).map(function (p) {
    return '<option' + (p === document.getElementById('priority').value ? ' selected' : '') + '>' + esc(p) + '</option>';
  }).join('');

  var row = document.createElement('div');
  row.className = 'subrow';
  row.innerHTML =
    '<span class="idx"></span>' +
    '<div class="fields">' +
      '<input class="s_content" placeholder="步驟內容">' +
      '<div class="line2">' +
        '<input class="s_assignee" placeholder="指派給">' +
        '<select class="s_category" title="分類，預設同主事項">' + cats + '</select>' +
        '<select class="s_priority" title="重要性，預設同主事項">' + pris + '</select>' +
        '<input class="s_due" type="date" title="期限">' +
      '</div>' +
    '</div>' +
    '<button class="del" title="刪除這列" onclick="removeSubRow(this)">✕</button>';
  document.getElementById('subRows').appendChild(row);
  renumberSubRows();
  row.querySelector('.s_content').focus();
}

function removeSubRow(btn) {
  var row = btn.closest('.subrow');
  if (row) row.parentNode.removeChild(row);
  renumberSubRows();
}

function renumberSubRows() {
  var rows = document.querySelectorAll('#subRows .subrow');
  for (var i = 0; i < rows.length; i++) {
    rows[i].querySelector('.idx').textContent = (i + 1);
  }
  document.getElementById('subCnt').textContent =
    rows.length ? rows.length + ' 個步驟' : '尚未新增';
}

/** 讀出填了內容的子任務列；沒填內容的空列直接略過 */
function collectSubRows() {
  var out = [];
  var rows = document.querySelectorAll('#subRows .subrow');
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var c = r.querySelector('.s_content').value.trim();
    if (!c) continue;
    out.push({
      content: c,
      assignee: r.querySelector('.s_assignee').value.trim(),
      category: r.querySelector('.s_category').value,
      priority: r.querySelector('.s_priority').value,
      due: r.querySelector('.s_due').value
    });
  }
  return out;
}

function clearSubRows() {
  document.getElementById('subRows').innerHTML = '';
  renumberSubRows();
}

/**
 * 主事項存好後，依序把子任務補上去。
 * 後端不用改：每一筆都是原本的 addItem，只是多帶 parentId。
 * 一筆一筆送而不是同時送，是為了讓順序穩定、失敗時知道停在第幾筆。
 */
function addSubsSequentially(parentId, subs, i, resident, onAllDone) {
  if (i >= subs.length) { onAllDone(); return; }
  var s = subs[i];
  setStatus('新增子任務 ' + (i + 1) + '／' + subs.length + '…');
  api()
    .withSuccessHandler(function (items) {
      ITEMS = items;
      addSubsSequentially(parentId, subs, i + 1, resident, onAllDone);
    })
    .withFailureHandler(function (e) {
      if (handleAuthError(e)) return;
      renderAll();
      setStatus('主事項已建立，但第 ' + (i + 1) + ' 個子任務失敗：' + e.message +
        '（其餘可用卡片上的「＋ 子任務」補上）');
    })
    .addItem({
      from: MY_NAME,
      parentId: parentId,
      assignee: s.assignee,
      resident: resident,
      category: s.category,
      priority: s.priority,
      due: s.due,
      content: s.content
    }, MY_CODE);
}

/* ================= 重複工作 ================= */

function toggleTplSection() {
  TPL_OPEN = !TPL_OPEN;
  document.getElementById('tplSection').classList.toggle('hidden', !TPL_OPEN);
  document.getElementById('tplToggle').classList.toggle('on', TPL_OPEN);
  if (TPL_OPEN && !TEMPLATES.length) loadTemplates();
}

function initTplForm() {
  fillSelect('t_freq', ME.frequencies, '每月');
  fillSelect('t_weekday', ME.weekdays);
  fillSelect('t_category', ME.categories);
  fillSelect('t_priority', ME.priorities, '一般');

  var days = [];
  for (var d = 1; d <= 31; d++) days.push(String(d));
  document.getElementById('t_monthday').innerHTML = days.map(function (d) {
    return '<option value="' + d + '"' + (d === '25' ? ' selected' : '') + '>' + d + ' 號</option>';
  }).join('');

  var leads = [0, 1, 2, 3, 5, 7, 14];
  document.getElementById('t_lead').innerHTML = leads.map(function (n) {
    return '<option value="' + n + '">' + (n ? '提前 ' + n + ' 天產生' : '當天產生') + '</option>';
  }).join('');

  onFreqChange();
}

function onFreqChange() {
  var f = document.getElementById('t_freq').value;
  document.getElementById('t_weekday').classList.toggle('hidden', f !== '每週');
  document.getElementById('t_monthday').classList.toggle('hidden', f !== '每月');
}

function loadTemplates() {
  document.getElementById('tplList').innerHTML = '<div class="empty">載入中…</div>';
  api()
    .withSuccessHandler(function (t) { TEMPLATES = t; renderTemplates(); })
    .withFailureHandler(function (e) {
      document.getElementById('tplList').innerHTML =
        '<div class="empty">讀取失敗：' + esc(e.message) + '</div>';
    })
    .getTemplates(MY_CODE);
}

function freqText(t) {
  if (t.freq === '每日') return '每天';
  if (t.freq === '每週') return '每' + String(t.weekday).replace('週', '週');
  if (t.freq === '每月') return '每月 ' + t.monthDay + ' 號';
  return t.freq;
}

function renderTemplates() {
  var el = document.getElementById('tplList');
  document.getElementById('tplCount').textContent =
    TEMPLATES.length ? '(' + TEMPLATES.length + ')' : '';

  if (!TEMPLATES.length) {
    el.innerHTML = '<div class="empty">還沒有設定重複工作。' +
      '像每月 25 日計費、每週一盤點這種固定會發生的事，設在這裡就不用每次自己記得新增。</div>';
    return;
  }

  el.innerHTML = TEMPLATES.map(function (t) {
    return '<div class="item' + (t.enabled ? '' : ' done') + '">' +
      '<div>' +
        '<span class="tag" style="background:var(--brand);color:#fff;font-weight:500;">' +
          esc(freqText(t)) + '</span>' +
        '<span class="tag">' + esc(t.category) + '</span>' +
        (t.resident ? '<span class="tag resident">' + esc(t.resident) + '</span>' : '') +
        (t.priority === '緊急' ? '<span class="tag 緊急">緊急</span>' : '') +
        (t.priority === '提醒' ? '<span class="tag 提醒">提醒</span>' : '') +
        (t.assignee ? '<span class="tag">→ ' + esc(t.assignee) + '</span>' : '') +
        (t.enabled ? '' : '<span class="tag">已停用</span>') +
      '</div>' +
      '<div class="content">' + esc(t.content) + '</div>' +
      '<div class="meta">' +
        (t.enabled && t.nextDue ? '<span>下次：' + esc(t.nextDue) +
          (Number(t.lead) ? '（提前 ' + Number(t.lead) + ' 天產生）' : '') + '</span>' : '') +
        (t.lastRun ? '<span>上次產生：' + esc(t.lastRun) + '</span>' : '<span>尚未產生過</span>') +
      '</div>' +
      '<div class="actions">' +
        '<button class="ghost" onclick="editTpl(\'' + t.id + '\')">✎ 編輯</button>' +
        '<button class="ghost" onclick="toggleTpl(\'' + t.id + '\')">' +
          (t.enabled ? '暫停' : '啟用') + '</button>' +
        '<button class="ghost" onclick="delTpl(\'' + t.id + '\')">刪除</button>' +
      '</div></div>';
  }).join('');
}

function editTpl(id) {
  var t = TEMPLATES.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  EDITING_TPL = id;
  document.getElementById('t_freq').value = t.freq;
  onFreqChange();
  if (t.weekday) document.getElementById('t_weekday').value = t.weekday;
  if (t.monthDay) document.getElementById('t_monthday').value = String(t.monthDay);
  document.getElementById('t_lead').value = String(t.lead || 0);
  document.getElementById('t_assignee').value = t.assignee || '';
  document.getElementById('t_resident').value = t.resident || '';
  document.getElementById('t_category').value = t.category;
  document.getElementById('t_priority').value = t.priority;
  document.getElementById('t_content').value = t.content;
  document.getElementById('t_note').value = t.note || '';
  document.getElementById('tplFormTitle').textContent = '編輯重複工作';
  document.getElementById('tplCancel').classList.remove('hidden');
  window.scrollTo(0, 0);
}

function resetTplForm() {
  EDITING_TPL = null;
  document.getElementById('t_assignee').value = '';
  document.getElementById('t_resident').value = '';
  document.getElementById('t_content').value = '';
  document.getElementById('t_note').value = '';
  document.getElementById('t_freq').value = '每月';
  document.getElementById('t_monthday').value = '25';
  document.getElementById('t_lead').value = '0';
  document.getElementById('t_category').value = ME.categories[0];
  document.getElementById('t_priority').value = '一般';
  onFreqChange();
  document.getElementById('tplFormTitle').textContent = '新增重複工作';
  document.getElementById('tplCancel').classList.add('hidden');
  document.getElementById('tplStatus').textContent = '';
}

function saveTpl() {
  var content = document.getElementById('t_content').value.trim();
  var st = document.getElementById('tplStatus');
  if (!content) { st.textContent = '請填寫工作內容'; return; }

  document.getElementById('tplSave').disabled = true;
  st.textContent = '儲存中…';
  api()
    .withSuccessHandler(function (t) {
      TEMPLATES = t;
      document.getElementById('tplSave').disabled = false;
      resetTplForm();
      renderTemplates();
      loadResidents();
    })
    .withFailureHandler(function (e) {
      document.getElementById('tplSave').disabled = false;
      st.textContent = '儲存失敗：' + e.message;
    })
    .saveTemplate({
      id: EDITING_TPL,
      freq: document.getElementById('t_freq').value,
      weekday: document.getElementById('t_weekday').value,
      monthDay: document.getElementById('t_monthday').value,
      lead: document.getElementById('t_lead').value,
      assignee: document.getElementById('t_assignee').value.trim(),
      resident: document.getElementById('t_resident').value.trim(),
      category: document.getElementById('t_category').value,
      priority: document.getElementById('t_priority').value,
      note: document.getElementById('t_note').value.trim(),
      content: content
    }, MY_CODE);
}

function tplDone(t) { TEMPLATES = t; renderTemplates(); }
function tplFail(e) {
  if (handleAuthError(e)) return;
  document.getElementById('tplStatus').textContent = '操作失敗：' + e.message;
}

function toggleTpl(id) {
  api().withSuccessHandler(tplDone).withFailureHandler(tplFail).toggleTemplate(id, MY_CODE);
}

function delTpl(id) {
  askConfirm('確定刪除這個重複工作設定？\n（已經產生出來的交班事項不會被刪除）', function () {
    api().withSuccessHandler(tplDone).withFailureHandler(tplFail).deleteTemplate(id, MY_CODE);
  });
}

/* ================= 保管物 ================= */

function loadCustody() {
  document.getElementById('cusList').innerHTML = '<div class="empty">載入中…</div>';
  api()
    .withSuccessHandler(function (c) { CUSTODY = c; renderCustody(); renderNavCounts(); })
    .withFailureHandler(function (e) {
      if (handleAuthError(e)) return;
      document.getElementById('cusList').innerHTML =
        '<div class="empty">讀取失敗：' + esc(e.message) + '</div>';
    })
    .getCustody(MY_CODE);
}

var CUSTODY_CATS_FALLBACK = ['證件', '貴重物品', '現金', '衣物', '輔具', '其他'];

function initCustodyForm() {
  if (!ME.custodyCategories || !ME.custodyCategories.length) {
    ME.custodyCategories = CUSTODY_CATS_FALLBACK;
  }
  fillSelect('c_category', ME.custodyCategories);
}

function renderCustody() {
  var kw = document.getElementById('cusSearch').value.trim().toLowerCase();
  var who = document.getElementById('cusFilterPerson').value;
  var onlyHeld = document.getElementById('cusOnlyHeld').checked;

  renderCustodyNameOptions();

  var list = CUSTODY.filter(function (c) {
    if (onlyHeld && c.status !== '保管中') return false;
    if (who && c.person !== who) return false;
    if (!kw) return true;
    return (c.person + c.name + c.place + c.category + c.note + c.returnedTo)
      .toLowerCase().indexOf(kw) >= 0;
  });

  var held = CUSTODY.filter(function (c) { return c.status === '保管中'; }).length;
  document.getElementById('cusCount').textContent =
    '(' + list.length + (onlyHeld ? '' : ' ／ 保管中 ' + held) + ')';

  var el = document.getElementById('cusList');
  if (!list.length) {
    el.innerHTML = '<div class="empty">' +
      (CUSTODY.length
        ? '沒有符合條件的登記'
        : '還沒有保管物登記。住民入住時代收的證件貴重物品，或是代員工保管的東西，' +
          '登記在這裡，來領的時候查得到、也留得下歸還紀錄。') + '</div>';
    return;
  }
  el.innerHTML = list.map(custodyCard).join('');
}

function renderCustodyNameOptions() {
  var m = {};
  CUSTODY.forEach(function (c) {
    if (c.person) m[c.person] = (m[c.person] || 0) + 1;
  });
  var names = Object.keys(m).sort(function (a, b) {
    return m[b] - m[a] || a.localeCompare(b, 'zh-Hant');
  });
  document.getElementById('custodyNameList').innerHTML = names.map(function (n) {
    return '<option value="' + esc(n) + '">';
  }).join('');

  var sel = document.getElementById('cusFilterPerson');
  var cur = sel.value;
  sel.innerHTML = '<option value="">全部姓名</option>' +
    names.map(function (n) {
      return '<option' + (n === cur ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
  if (cur && sel.value !== cur) sel.value = '';
}

function custodyCard(c) {
  var held = c.status === '保管中';
  var voided = c.status === '已作廢';
  var cls = held ? 'held' : (voided ? 'past voided' : 'past');

  var tail = '';
  if (c.status === '已歸還') {
    tail = '<div class="meta"><span>✔ ' + esc(c.returnedAt) +
      ' 歸還給 ' + esc(c.returnedTo) + '</span>' +
      (c.returnedBy ? '<span>經手：' + esc(c.returnedBy) + '</span>' : '') + '</div>';
  } else if (voided) {
    tail = '<div class="meta"><span>✕ ' + esc(c.voidedAt) + ' 由 ' + esc(c.voidedBy) +
      ' 作廢</span><span>原因：' + esc(c.voidReason) + '</span></div>';
  }

  return '' +
    '<div class="item ' + cls + '">' +
      '<div>' +
        (c.person ? '<span class="tag person">' + esc(c.person) + '</span>' : '') +
        '<span class="tag">' + esc(c.category) + '</span>' +
        (held ? '<span class="tag held">保管中</span>' : '') +
        (voided ? '<span class="tag voided">已作廢</span>' : '') +
        (c.status === '已歸還' ? '<span class="tag">已歸還</span>' : '') +
      '</div>' +
      '<div class="content">' + esc(c.name) +
        (c.qty ? '　<span style="color:var(--muted);">' + esc(c.qty) + '</span>' : '') +
      '</div>' +
      (c.place ? '<div class="meta"><span>📍 ' + esc(c.place) + '</span></div>' : '') +
      (c.note ? '<div class="meta">備註：' + esc(c.note) + '</div>' : '') +
      '<div class="meta"><span>' + esc(c.by) + '</span><span>' + esc(c.createdAt) + '</span></div>' +
      tail +
      (held
        ? '<div class="actions">' +
            '<button class="ghost" onclick="startReturn(\'' + c.id + '\')">↩ 歸還</button>' +
            '<button class="ghost" onclick="editCustody(\'' + c.id + '\')">✎ 編輯</button>' +
            '<button class="ghost" onclick="startVoid(\'' + c.id + '\')">作廢</button>' +
          '</div>'
        : '') +
      (CUS_ACTION.id === c.id && CUS_ACTION.mode === 'return' ? returnForm(c.id) : '') +
      (CUS_ACTION.id === c.id && CUS_ACTION.mode === 'void' ? voidForm(c.id) : '') +
    '</div>';
}

function returnForm(id) {
  return '<div class="subform">' +
    '<div class="row">' +
      '<input id="r_to" placeholder="歸還給誰，例如：長女李美華">' +
      '<input id="r_by" placeholder="經手人" value="' + esc(MY_NAME) + '">' +
    '</div>' +
    '<div class="row">' +
      '<button id="r_save" onclick="doReturn(\'' + id + '\')">確認歸還</button>' +
      '<button class="ghost" onclick="cancelCusAction()">取消</button>' +
      '<span style="color:var(--muted);font-size:12px;align-self:center;">' +
        '歸還後這筆就不能再修改</span>' +
    '</div></div>';
}

function voidForm(id) {
  return '<div class="subform">' +
    '<div class="row">' +
      '<input id="v_reason" placeholder="作廢原因（必填），例如：重複登記" style="flex:1 1 100%;">' +
    '</div>' +
    '<div class="row">' +
      '<button id="v_save" onclick="doVoid(\'' + id + '\')">確認作廢</button>' +
      '<button class="ghost" onclick="cancelCusAction()">取消</button>' +
      '<span style="color:var(--muted);font-size:12px;align-self:center;">' +
        '保管紀錄不能刪除，只能作廢並留下原因</span>' +
    '</div></div>';
}

function startReturn(id) {
  CUS_ACTION = { id: id, mode: 'return' };
  renderCustody();
  focusEl('r_to');
}
function startVoid(id) {
  CUS_ACTION = { id: id, mode: 'void' };
  renderCustody();
  focusEl('v_reason');
}
function cancelCusAction() {
  CUS_ACTION = { id: null, mode: null };
  renderCustody();
}

function cusDone(c) {
  CUSTODY = c;
  CUS_ACTION = { id: null, mode: null };
  renderCustody();
  renderNavCounts();
}
function cusFail(e) {
  if (handleAuthError(e)) return;
  document.getElementById('cusStatus').textContent = '操作失敗：' + e.message;
}

function doReturn(id) {
  var to = document.getElementById('r_to').value.trim();
  if (!to) { focusEl('r_to'); return; }
  document.getElementById('r_save').disabled = true;
  api().withSuccessHandler(cusDone).withFailureHandler(function (e) {
    var b = document.getElementById('r_save');
    if (b) b.disabled = false;
    cusFail(e);
  }).returnCustody(id, { to: to, by: document.getElementById('r_by').value.trim() }, MY_CODE);
}

function doVoid(id) {
  var reason = document.getElementById('v_reason').value.trim();
  if (!reason) { focusEl('v_reason'); return; }
  askConfirm('確定把這筆保管登記作廢？\n作廢後不能還原，紀錄會保留在表上。', function () {
    api().withSuccessHandler(cusDone).withFailureHandler(cusFail)
      .voidCustody(id, reason, MY_CODE);
  });
}

function editCustody(id) {
  var c = CUSTODY.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  if (c.status !== '保管中') {
    document.getElementById('cusStatus').textContent = '這筆已經歸還或作廢，不能再修改';
    return;
  }
  EDITING_CUS = id;
  CUS_ACTION = { id: null, mode: null };
  document.getElementById('c_person').value = c.person;
  document.getElementById('c_category').value = c.category;
  document.getElementById('c_name').value = c.name;
  document.getElementById('c_qty').value = c.qty;
  document.getElementById('c_place').value = c.place;
  document.getElementById('c_note').value = c.note;
  document.getElementById('cusFormTitle').textContent = '編輯保管物登記';
  document.getElementById('cusSave').textContent = '儲存';
  document.getElementById('cusCancel').classList.remove('hidden');
  renderCustody();
  window.scrollTo(0, 0);
}

function resetCustodyForm() {
  EDITING_CUS = null;
  ['c_person', 'c_name', 'c_qty', 'c_place', 'c_note'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('c_category').value = ME.custodyCategories[0];
  document.getElementById('cusFormTitle').textContent = '新增保管物登記';
  document.getElementById('cusSave').textContent = '登記';
  document.getElementById('cusCancel').classList.add('hidden');
  document.getElementById('cusStatus').textContent = '';
}

function saveCustody() {
  var st = document.getElementById('cusStatus');
  var person = document.getElementById('c_person').value.trim();
  var name = document.getElementById('c_name').value.trim();
  if (!person) { st.textContent = '請填寫姓名'; focusEl('c_person'); return; }
  if (!name) { st.textContent = '請填寫品名'; focusEl('c_name'); return; }

  var data = {
    person: person,
    category: document.getElementById('c_category').value,
    name: name,
    qty: document.getElementById('c_qty').value.trim(),
    place: document.getElementById('c_place').value.trim(),
    note: document.getElementById('c_note').value.trim(),
    by: MY_NAME
  };

  document.getElementById('cusSave').disabled = true;
  st.textContent = '儲存中…';
  var ok = function (c) {
    document.getElementById('cusSave').disabled = false;
    CUSTODY = c;
    resetCustodyForm();
    renderCustody();
    renderNavCounts();
  };
  var no = function (e) {
    document.getElementById('cusSave').disabled = false;
    cusFail(e);
  };
  var r = api().withSuccessHandler(ok).withFailureHandler(no);
  if (EDITING_CUS) r.updateCustody(EDITING_CUS, data, MY_CODE);
  else r.addCustody(data, MY_CODE);
}

/* ================= 長期規則 ================= */

var RULE_CATS_FALLBACK = ['飲食', '用藥', '家屬', '沐浴', '活動', '安全', '其他'];

function initRuleForm() {
  if (!ME.ruleCategories || !ME.ruleCategories.length) {
    ME.ruleCategories = RULE_CATS_FALLBACK;
  }
  fillSelect('l_category', ME.ruleCategories);
}

function loadRules() {
  document.getElementById('ruleList').innerHTML = '<div class="empty">載入中…</div>';
  api()
    .withSuccessHandler(function (r) { RULES = r; renderRules(); })
    .withFailureHandler(function (e) {
      if (handleAuthError(e)) return;
      document.getElementById('ruleList').innerHTML =
        '<div class="empty">讀取失敗：' + esc(e.message) + '</div>';
    })
    .getRules(MY_CODE);
}

function groupRules(list) {
  var m = {};
  list.forEach(function (r) {
    var k = r.resident || '（未指定）';
    if (!m[k]) m[k] = [];
    m[k].push(r);
  });
  return Object.keys(m).sort(function (a, b) {
    return a.localeCompare(b, 'zh-Hant');
  }).map(function (k) { return { resident: k, rules: m[k] }; });
}

function renderRules() {
  var kw = document.getElementById('ruleSearch').value.trim().toLowerCase();
  var onlyOn = document.getElementById('ruleOnlyOn').checked;

  var list = RULES.filter(function (r) {
    if (onlyOn && r.status !== '生效中') return false;
    if (!kw) return true;
    return (r.resident + r.category + r.content + r.note).toLowerCase().indexOf(kw) >= 0;
  });

  var groups = groupRules(list);
  var onCount = RULES.filter(function (r) { return r.status === '生效中'; }).length;
  document.getElementById('ruleCount').textContent =
    '(' + groups.length + ' 位住民 ／ ' + list.length + ' 條' +
    (onlyOn ? '' : '，生效中 ' + onCount) + ')';

  var el = document.getElementById('ruleList');
  if (!groups.length) {
    el.innerHTML = '<div class="empty">' +
      (RULES.length
        ? '沒有符合條件的規則'
        : '還沒有長期規則。像「糖尿病餐不可給甜點」「洗澡需兩人協助」' +
          '這種不會結束、但交接時一定要知道的事，記在這裡。') + '</div>';
    return;
  }

  el.innerHTML = groups.map(function (g) {
    var open = kw ? true : !!RULE_OPEN[g.resident];
    var onN = g.rules.filter(function (r) { return r.status === '生效中'; }).length;
    return '<div class="rgroup' + (open ? ' open' : '') + '">' +
      '<div class="rhead" onclick="toggleRuleGroup(' + JSON.stringify(g.resident).replace(/"/g, '&quot;') + ')">' +
        '<span class="caret">▶</span>' +
        '<span class="tag resident">' + esc(g.resident) + '</span>' +
        '<span class="rcount">' + g.rules.length + ' 條' +
          (onN !== g.rules.length ? '（生效 ' + onN + '）' : '') + '</span>' +
      '</div>' +
      (open ? '<div class="rbody">' + g.rules.map(ruleRow).join('') + '</div>' : '') +
    '</div>';
  }).join('');
}

function ruleRow(r) {
  var off = r.status !== '生效中';
  return '<div class="rule' + (off ? ' off' : '') + '">' +
    '<div>' +
      '<span class="tag">' + esc(r.category) + '</span>' +
      (off ? '<span class="tag">已停用</span>' : '') +
    '</div>' +
    '<div class="rtext">' + esc(r.content) + '</div>' +
    (r.note ? '<div class="meta">備註：' + esc(r.note) + '</div>' : '') +
    '<div class="meta"><span>' + esc(r.by) + '</span><span>' + esc(r.createdAt) + '</span>' +
      (r.updatedAt ? '<span>更新：' + esc(r.updatedBy) + ' ' + esc(r.updatedAt) + '</span>' : '') +
    '</div>' +

      '<button class="ghost" onclick="editRule(\'' + r.id + '\')">✎ 編輯</button>' +
      '<button class="ghost" onclick="toggleRuleStatus(\'' + r.id + '\')">' +

function toggleRuleGroup(resident) {

function expandAllRules(open) {

    groupRules(RULES).forEach(function (g) { RULE_OPEN[g.resident] = true; });

  }

function ruleDone(r) {

  loadResidents();
}
function ruleFail(e) {

function toggleRuleStatus(id) {

function delRule(id) {

    document.getElementById(id).value = '';
  });
  document.getElementById('l_category').value = ME.ruleCategories[0];
  document.getElementById('ruleFormTitle').textContent = '新增長期規則';

  document.getElementById('ruleCancel').classList.add('hidden');

  document.getElementById('l_hint').textContent = '';
}

function similarResidents(name) {
  var n = name.trim();
  if (!n || RESIDENTS.indexOf(n) >= 0) return [];
  return RESIDENTS.filter(function (r) {
    if (r === n) return false;
    return r.indexOf(n) === 0 || n.indexOf(r) === 0 ||
      (n.length >= 2 && r.length >= 2 && r.slice(0, 2) === n.slice(0, 2));
  }).slice(0, 3);
}

function checkResidentHint() {
  var el = document.getElementById('l_hint');
  var v = document.getElementById('l_resident').value;
  var near = similarResidents(v);
  el.textContent = near.length
    ? '名單裡有相似的：' + near.join('、') + '　確定是不同人再繼續'
    : '';
}

function saveRule() {
  var st = document.getElementById('ruleStatus');
  var resident = document.getElementById('l_resident').value.trim();
  var content = document.getElementById('l_content').value.trim();
  if (!resident) { st.textContent = '請填寫住民'; focusEl('l_resident'); return; }
  if (!content) { st.textContent = '請填寫規則內容'; focusEl('l_content'); return; }

  var data = {
    resident: resident,
    category: document.getElementById('l_category').value,
    content: content,
    note: document.getElementById('l_note').value.trim(),
    by: MY_NAME
  };

  document.getElementById('ruleSave').disabled = true;
  st.textContent = '儲存中…';
  var ok = function (r) {
    document.getElementById('ruleSave').disabled = false;
    RULES = r;
    RULE_OPEN[resident] = true;
    resetRuleForm();
    renderRules();
    loadResidents();
  };
  var no = function (e) {
    document.getElementById('ruleSave').disabled = false;
    ruleFail(e);
  };
  var runner = api().withSuccessHandler(ok).withFailureHandler(no);
  if (EDITING_RULE) runner.updateRule(EDITING_RULE, data, MY_CODE);
  else runner.addRule(data, MY_CODE);
}

/* ================= 設備工單 ================= */

var EQ_TYPES_FALLBACK = ['清潔', '維修'];

function initEqForm() {
  if (!ME.equipTypes || !ME.equipTypes.length) ME.equipTypes = EQ_TYPES_FALLBACK;
  fillSelect('q_type', ME.equipTypes);
  onEqTypeChange();
}

function onEqTypeChange() {
  var isRepair = document.getElementById('q_type').value === '維修';
  document.getElementById('q_vendorRow').classList.toggle('hidden', !isRepair);
}

function loadWork() {
  document.getElementById('eqTodoList').innerHTML = '<div class="empty">載入中…</div>';
  api()
    .withSuccessHandler(function (w) { WORK = w; renderWork(); renderNavCounts(); })
    .withFailureHandler(function (e) {
      if (handleAuthError(e)) return;
      document.getElementById('eqTodoList').innerHTML =
        '<div class="empty">讀取失敗：' + esc(e.message) + '</div>';
    })
    .getWorkOrders(MY_CODE);
}

function renderWork() {
  var kw = document.getElementById('eqSearch').value.trim().toLowerCase();
  var type = document.getElementById('eqFilterType').value;
  var onlyOpen = document.getElementById('eqOnlyOpen').checked;

  var match = function (w) {
    if (type && w.type !== type) return false;
    if (!kw) return true;
    return (w.equipment + w.place + w.reason + w.assignee + w.resident +
      w.vendor + w.note).toLowerCase().indexOf(kw) >= 0;
  };

  renderEquipOptions();

  var list = WORK.filter(match);
  var todo = list.filter(function (w) { return w.status === '待處理'; });
  var closed = list.filter(function (w) {
    return w.status === '已結案' || w.status === '已取消';
  }).slice(0, 30);

  todo.sort(function (a, b) { return b.ageDays - a.ageDays; });

  document.getElementById('eqTodoCount').textContent = '(' + todo.length + ')';
  document.getElementById('eqClosedCount').textContent = '(' + closed.length + ')';

  document.getElementById('eqTodoList').innerHTML = todo.length
    ? todo.map(workCard).join('')
    : '<div class="empty">' + (WORK.length ? '沒有待處理的工單' :
        '還沒有設備工單。像「住民退住，輪椅要清潔」「洗衣機脫水異音要叫廠商」' +
        '這種交代出去、之後要回頭確認的事，開一張單追蹤。') + '</div>';

  var cl = document.getElementById('eqClosedList');
  cl.classList.toggle('hidden', !SHOW_CLOSED_EQ || onlyOpen);
  document.getElementById('eqClosedTitle').firstChild.textContent =
    (SHOW_CLOSED_EQ && !onlyOpen ? '▼ ' : '▶ ') + '已結案／已取消 ';
  if (SHOW_CLOSED_EQ && !onlyOpen) {
    cl.innerHTML = closed.length
      ? closed.map(workCard).join('')
      : '<div class="empty">尚無已結案的工單</div>';
  }
}

function toggleClosedWork() {
  if (document.getElementById('eqOnlyOpen').checked) {
    document.getElementById('eqOnlyOpen').checked = false;
  }
  SHOW_CLOSED_EQ = !SHOW_CLOSED_EQ;
  renderWork();
}

function workCard(w) {
  var cls = { '待處理': 'eq-todo',
    '已結案': 'eq-done', '已取消': 'eq-cancel' }[w.status] || 'eq-todo';
  var isRepair = w.type === '維修';

  var trail = '';
  if (w.doneAt) {
    trail += '<div class="meta"><span>✔ 完成 ' + esc(w.doneAt) +
      (w.doneBy ? ' by ' + esc(w.doneBy) : '') + '</span></div>';
  }
  if (w.cancelledAt) {
    trail += '<div class="meta"><span>✕ ' + esc(w.cancelledAt) + ' 由 ' +
      esc(w.cancelledBy) + ' 取消：' + esc(w.cancelReason) + '</span></div>';
  }

  return '' +
    '<div class="item ' + cls + '">' +
      '<div>' +
        '<span class="tag ' + (isRepair ? 'repair' : 'eq-todo') + '">' + esc(w.type) + '</span>' +
        (w.status === '待處理' ? '<span class="tag">待處理</span>' : '') +
        (w.status === '已取消' ? '<span class="tag">已取消</span>' : '') +
        (w.status === '已結案' ? '<span class="tag">已結案</span>' : '') +
        (w.reopens ? '<span class="tag reopened">重開 ' + w.reopens + ' 次</span>' : '') +
        (w.resident ? '<span class="tag resident">' + esc(w.resident) + '</span>' : '') +
      '</div>' +
      '<div class="content"><strong>' + esc(w.equipment) + '</strong>' +
        (w.place ? '　<span style="color:var(--muted);font-size:13px;">' +
          esc(w.place) + '</span>' : '') +
        '<br>' + esc(w.reason) + '</div>' +
      (isRepair && (w.vendor || w.eta || w.cost)
        ? '<div class="meta">' +
            (w.vendor ? '<span>🔧 ' + esc(w.vendor) +
              (w.vendorTel ? ' ' + esc(w.vendorTel) : '') + '</span>' : '') +
            (w.eta ? '<span>預計到場 ' + esc(w.eta) + '</span>' : '') +
            (w.cost ? '<span>費用 ' + esc(w.cost) + '</span>' : '') +
          '</div>'
        : '') +
      (w.note ? '<div class="meta">備註：' + esc(w.note) + '</div>' : '') +
      '<div class="meta">' +
        (w.assignee ? '<span>交辦給 ' + esc(w.assignee) + '</span>' : '<span>未交辦</span>') +
        '<span>開單 ' + esc(w.createdAt) + '</span>' +
        (w.status !== '已結案' && w.status !== '已取消' && w.ageDays
          ? '<span>已 ' + w.ageDays + ' 天</span>' : '') +
      '</div>' +
      trail +
      workButtons(w) +
      (EQ_ACTION.id === w.id ? eqActionForm(w) : '') +
    '</div>';
}

function workButtons(w) {
  var b = [];
  if (w.status === '待處理') {
    b.push('<button class="primary" style="padding:6px 13px;font-size:12.5px;" onclick="closeWork(\'' + w.id + '\')">✔ 完成</button>');
    b.push('<button class="ghost" onclick="editWork(\'' + w.id + '\')">✎ 編輯</button>');
    b.push('<button class="ghost" onclick="startEqAction(\'' + w.id + '\',\'cancel\')">取消工單</button>');
  } else {
    b.push('<button class="ghost" onclick="reopenWork(\'' + w.id + '\')">↩ 重新開啟</button>');
  }
  return '<div class="actions">' + b.join('') + '</div>';
}

function eqActionForm(w) {
  return '<div class="subform">' +
    '<div class="row"><input id="q_reason_in" ' +
      'placeholder="取消原因（必填），例如：設備已報廢" style="flex:1 1 100%;"></div>' +
    '<div class="row">' +
      '<button id="q_go" onclick="doEqAction(\'' + w.id + '\')">確認取消</button>' +
      '<button class="ghost" onclick="cancelEqAction()">返回</button>' +
    '</div></div>';

}
function cancelEqAction() {
  EQ_ACTION = { id: null, mode: null };
  renderWork();
}

function eqDone(w) {

function eqFail(e) {

function doEqAction(id) {

function closeWork(id) {

function reopenWork(id) {

function renderEquipOptions() {
  var eq = {}, pl = {};
  WORK.forEach(function (w) {
    if (w.equipment) eq[w.equipment] = (eq[w.equipment] || 0) + 1;
    if (w.place) pl[w.place] = (pl[w.place] || 0) + 1;
  });

    return Object.keys(m).sort(function (a, b) {
      return m[b] - m[a] || a.localeCompare(b, 'zh-Hant');

function saveWork() {

  var reason = document.getElementById('q_reason').value.trim();
  if (!equipment) { st.textContent = '請填寫設備'; focusEl('q_equipment'); return; }
  if (!reason) { st.textContent = '請填寫事由'; focusEl('q_reason'); return; }

  var data = {
    type: document.getElementById('q_type').value,
    equipment: equipment,
    place: document.getElementById('q_place').value.trim(),
    reason: reason,
    resident: document.getElementById('q_resident').value.trim(),
    assignee: document.getElementById('q_assignee').value.trim(),
    note: document.getElementById('q_note').value.trim(),
    vendor: document.getElementById('q_vendor').value.trim(),
    vendorTel: document.getElementById('q_vendorTel').value.trim(),
    eta: document.getElementById('q_eta').value,
    cost: document.getElementById('q_cost').value.trim()
  };

  document.getElementById('eqSave').disabled = true;
  st.textContent = '儲存中…';
  var ok = function (w) {
    document.getElementById('eqSave').disabled = false;
    WORK = w;
    resetEqForm();
    renderWork();
    renderNavCounts();
    loadResidents();
  };
  var no = function (e) {
    document.getElementById('eqSave').disabled = false;
    eqFail(e);
