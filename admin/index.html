/* ================= 儀表板 ================= */

/** 儀表板的重新整理：交班事項一定要，另外三張表只重讀已經載過的 */
function refreshDash() {
  var btn = document.getElementById('dashRefresh');
  btn.disabled = true;
  btn.textContent = '更新中…';
  var restore = function () {
    btn.disabled = false;
    btn.textContent = '重新整理';
  };
  api()
    .withSuccessHandler(function (items) {
      ITEMS = items;
      setStatus('');
      renderAll();
      if (CUSTODY.length) loadCustody();
      if (WORK.length) loadWork();
      restore();
    })
    .withFailureHandler(function (e) {
      restore();
      if (handleAuthError(e)) return;
      setStatus('讀取失敗：' + e.message);
    })
    .getItems(MY_CODE);
}

function renderDash() {
  var pending = ITEMS.filter(function (i) { return i.status !== '已完成'; });
  var urgent = pending.filter(function (i) { return i.priority === '緊急'; });
  var overdue = pending.filter(function (i) { return i.ageDays >= OVERDUE_DAYS; });

  var days7 = lastDays(7);
  var done7 = ITEMS.filter(function (i) {
    return i.status === '已完成' && days7.indexOf(i.doneDate) >= 0;
  }).length;

  document.getElementById('dashHead').innerHTML = '儀表板' +
    '<span class="note">' + esc(ME.today || '') + '</span>';

  document.getElementById('tiles').innerHTML = [
    tile('待處理', pending.length, pending.length ? '共 ' + ITEMS.length + ' 筆紀錄' : '全部結清', '', ''),
    tile('緊急未處理', urgent.length, '需優先處理', urgent.length ? 'alert' : 'ok', 'urgent'),
    tile('逾 ' + OVERDUE_DAYS + ' 天未結', overdue.length, '擱置提醒', overdue.length ? 'alert' : 'ok', 'stale'),
    tile('近 7 天完成', done7, '團隊消化量', 'ok', 'done7')
  ].join('');

  renderToday(pending);
  renderNext3(pending);
  renderResidentPending(pending);
}

function renderToday(pending) {
  var due = pending.filter(function (it) { return it.due && it.due <= ME.today; });
  due.sort(function (a, b) { return a.due.localeCompare(b.due); });

  var late = due.filter(function (it) { return it.due < ME.today; });
  var head = document.getElementById('todayHead');
  var el = document.getElementById('todayList');

  head.innerHTML = '今日待辦' +
    (due.length ? '<span style="font:500 12px \'IBM Plex Mono\',monospace;color:var(--muted);">' + due.length + '</span>' : '') +
    (late.length ? '<span class="late">其中 ' + late.length + ' 筆已過期</span>' : '');

  if (!due.length) {
    el.innerHTML = '<div class="empty">今天沒有到期的事項</div>';
    return;
  }

  el.innerHTML = due.map(function (it) {
    var over = daysBetween(it.due, ME.today);
    var when = over > 0
      ? { cls: 'late', txt: '逾期 ' + over + ' 天' }
      : { cls: 'now', txt: '今天到期' };
    return '<div class="todo p' + esc(it.priority) + '">' +
      '<div class="when ' + when.cls + '">' + when.txt + '</div>' +
      '<div class="what">' +
        '<div class="txt">' +
          (it.priority === '緊急' ? '<span class="tag 緊急">緊急</span>' : '') +
          (it.priority === '提醒' ? '<span class="tag 提醒">提醒</span>' : '') +
          (it.resident ? '<span class="tag resident">' + esc(it.resident) + '</span>' : '') +
          esc(it.content.split('\n')[0]) + '</div>' +
        '<div class="sub">' + esc(it.category) +
          ' · ' + (it.assignee ? '負責人：' + esc(it.assignee) : '未指派') + '</div>' +
      '</div>' +
      '<button onclick="toggle(\'' + it.id + '\')">✔ 完成</button>' +
      '</div>';
  }).join('');
}

function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function tile(label, value, sub, cls, filter) {
  var clickable = filter !== undefined;
  return '<div class="tile' + (clickable ? ' clickable' : '') + '"' +
    (clickable ? ' onclick="goList(\'' + filter + '\')" title="點此查看"' : '') + '>' +
    '<div class="label">' + esc(label) + '</div>' +
    '<div class="value ' + cls + '">' + value + '</div>' +
    '<div class="sub">' + esc(sub) + '</div></div>';
}

function goList(filter) {
  QUICK_FILTER = filter || '';
  showTab('list');
  renderList();
  window.scrollTo(0, 0);
}

function clearQuickFilter() {
  QUICK_FILTER = '';
  renderList();
}

function shiftDate(ymd, n) {
  var p = String(ymd).split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]) + n);
  return d.getFullYear() + '-' +
    ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function lastDays(n) {
  var out = [];
  for (var i = n - 1; i >= 0; i--) out.push(shiftDate(ME.today, -i));
  return out;
}

function weekdayLabel(ymd) {
  var p = String(ymd).split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return ['週日', '週一', '週二', '週三', '週四', '週五', '週六'][d.getDay()];
}

function renderResidentPending(pending) {
  var withRes = pending.filter(function (it) { return (it.resident || '').trim(); });
  var panel = document.getElementById('byResidentPanel');
  panel.classList.toggle('hidden', !withRes.length);
  if (!withRes.length) return;

  var m = {};
  withRes.forEach(function (it) {
    if (!m[it.resident]) m[it.resident] = [];
    m[it.resident].push(it);
  });
  var names = Object.keys(m).sort(function (a, b) {
    return m[b].length - m[a].length || a.localeCompare(b, 'zh-Hant');
  });

  // 只列住民與筆數，點一下跳到清單看細節——右欄很窄，攤開全部內容會擠爆
  document.getElementById('residentPending').innerHTML =
    '<div style="display:flex;flex-wrap:wrap;gap:6px;">' +
    names.map(function (n) {
      return '<span class="tag resident" style="cursor:pointer;margin:0;padding:5px 9px;font-size:12.5px;" ' +
        'onclick="goResident(' + JSON.stringify(n).replace(/"/g, '&quot;') + ')">' +
        esc(n) + ' ' + m[n].length + '</span>';
    }).join('') + '</div>';
}

/** 從儀表板點住民 → 跳到清單並套上該住民的篩選 */
function goResident(name) {
  QUICK_FILTER = '';
  showTab('list');
  var sel = document.getElementById('filterResident');
  sel.value = name;
  if (sel.value !== name) {
    // 名單裡沒有這位（剛新增還沒重讀）→ 用搜尋框代替
    document.getElementById('search').value = name;
  }
  renderList();
}

function renderNext3(pending) {
  var el = document.getElementById('next3');
  var days = [1, 2, 3, 4].map(function (n) {
    var key = shiftDate(ME.today, n);
    return { key: key, label: ['明天', '後天', '大後天'][n - 1] || weekdayLabel(key) };
  });

  el.innerHTML = '<div class="next4">' + days.map(function (d) {
    var list = pending.filter(function (it) { return it.due === d.key; })
      .sort(function (a, b) {
        return (b.priority === '緊急') - (a.priority === '緊急');
      });
    var shown = list.slice(0, 3);
    return '<div class="panel">' +
      '<h3><span>' + d.label + '</span>' +
        '<span style="font-weight:400;font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;color:var(--muted);">' +
          d.key.slice(5).replace('-', '/') + '</span>' +
        (list.length ? '<span class="cnt">' + list.length + '</span>' : '') +
      '</h3>' +
      (shown.length
        ? shown.map(function (it) {
            return '<div style="font-size:13px;line-height:1.55;color:var(--ink-2);">' +
              (it.priority === '緊急' ? '<span class="tag 緊急">緊急</span>' : '') +
              esc(it.content.split('\n')[0]) +
              '<span style="color:var(--muted);"> · ' + esc(it.category) +
              (it.assignee ? ' · ' + esc(it.assignee) : '') + '</span></div>';
          }).join('') +
          (list.length > shown.length
            ? '<div style="font-size:12px;color:var(--muted);">還有 ' +
              (list.length - shown.length) + ' 筆</div>' : '')
        : '<div class="empty">無</div>') +
    '</div>';
  }).join('') + '</div>';
}

/* ================= 清單 ================= */

function childrenOf(id) {
  return ITEMS.filter(function (i) { return i.parentId === id; }).slice().reverse();
}

function renderList() {
  var kw = document.getElementById('search').value.trim().toLowerCase();
  var cat = document.getElementById('filterCat').value;
  var res = document.getElementById('filterResident').value;

  renderQuickChip();
  var days7 = lastDays(7);

  var quick = function (it) {
    if (QUICK_FILTER === 'urgent') {
      return it.status !== '已完成' && it.priority === '緊急';
    }
    if (QUICK_FILTER === 'stale') {
      return it.status !== '已完成' && it.ageDays >= OVERDUE_DAYS;
    }
    if (QUICK_FILTER === 'done7') {
      return it.status === '已完成' && days7.indexOf(it.doneDate) >= 0;
    }
    return true;
  };

  var match = function (it) {
    if (!quick(it)) return false;
    if (cat && it.category !== cat) return false;
    if (res && (it.resident || '') !== res) return false;
    if (!kw) return true;
    return (it.content + it.from + it.assignee + it.note + (it.resident || ''))
      .toLowerCase().indexOf(kw) >= 0;
  };

  var list = ITEMS.filter(match);
  var shown = {};
  list.forEach(function (it) { shown[it.id] = true; });

  var top = list.filter(function (it) { return !it.parentId || !shown[it.parentId]; });

  var pending = top.filter(function (i) { return i.status !== '已完成'; });
  var done = top.filter(function (i) { return i.status === '已完成'; }).slice(0, 30);

  var block = function (it, depth) {
    var kids = depth >= MAX_DEPTH ? [] : childrenOf(it.id).filter(match);
    return card(it, depth) + (kids.length
      ? '<div class="kids">' + kids.map(function (k) {
          return block(k, depth + 1);
        }).join('') + '</div>'
      : '');
  };

  var hidePending = QUICK_FILTER === 'done7';
  document.getElementById('pendingSection').classList.toggle('hidden', hidePending);
  document.getElementById('pendingCount').textContent = '(' + pending.length + ')';
  document.getElementById('pending').innerHTML =
    pending.length ? pending.map(function (i) { return block(i, 0); }).join('') : '<div class="empty">目前沒有待處理事項</div>';
  document.getElementById('done').innerHTML =
    done.length ? done.map(function (i) { return block(i, 0); }).join('') : '<div class="empty">尚無已完成事項</div>';
}

function renderQuickChip() {
  var label = { urgent: '只看緊急', stale: '只看擱置 ' + OVERDUE_DAYS + ' 天以上',
    done7: '只看近 7 天完成' }[QUICK_FILTER];
  var chip = document.getElementById('quickChip');
  chip.classList.toggle('hidden', !label);
  if (label) {
    chip.innerHTML = esc(label) +
      '<button onclick="clearQuickFilter()" title="清除篩選">✕</button>';
  }
}

function card(it, depth) {
  depth = depth || 0;
  if (it.id === EDITING_ID) return editCard(it, depth);
  var isDone = it.status === '已完成';
  var overdue = !isDone && it.ageDays >= OVERDUE_DAYS;

  var kids = depth >= MAX_DEPTH ? [] : childrenOf(it.id);
  var kidsDone = kids.filter(function (k) { return k.status === '已完成'; }).length;
  return '' +
    '<div class="item ' + esc(it.priority) + (isDone ? ' done' : '') +
      (depth ? ' child' : '') + '">' +
      '<div>' +
        (it.priority === '緊急' ? '<span class="tag 緊急">緊急</span>' : '') +
        (it.priority === '提醒' ? '<span class="tag 提醒">提醒</span>' : '') +
        '<span class="tag">' + esc(it.category) + '</span>' +
        (it.resident ? '<span class="tag resident">' + esc(it.resident) + '</span>' : '') +
        (kids.length ? '<span class="tag progress' + (kidsDone === kids.length ? ' all' : '') +
          '">子任務 ' + kidsDone + '/' + kids.length + '</span>' : '') +
        (it.assignee ? '<span class="tag">→ ' + esc(it.assignee) + '</span>' : '') +
        (overdue ? '<span class="tag overdue">擱置 ' + it.ageDays + ' 天</span>' : '') +
        (it.due ? '<span class="tag ' + (!isDone && it.due < ME.today ? 'late' : '') + '">📅 ' +
          esc(it.due.slice(5).replace('-', '/')) +
          (!isDone && it.due < ME.today ? ' 已過期' : '') + '</span>' : '') +
      '</div>' +
      '<div class="content">' + esc(it.content) + '</div>' +
      (it.note ? '<div class="meta">備註：' + esc(it.note) + '</div>' : '') +
      '<div class="meta"><span>' + esc(it.from) + '</span><span>' + esc(it.createdAt) + '</span>' +
        (isDone ? '<span>✔ ' + esc(it.doneBy) + ' ' + esc(it.doneAt) + '</span>' : '') + '</div>' +
      '<div class="actions">' +
        '<button class="ghost" onclick="toggle(\'' + it.id + '\')">' +
          (isDone ? '↩ 退回待處理' : '✔ 標記完成') + '</button>' +
        '<button class="ghost" onclick="startEdit(\'' + it.id + '\')">✎ 編輯</button>' +
        (depth >= MAX_DEPTH ? '' :
          '<button class="ghost" onclick="startSub(\'' + it.id + '\')">＋ 子任務</button>') +
        '<button class="ghost" onclick="del(\'' + it.id + '\')">刪除</button>' +
      '</div>' +
      (SUB_PARENT === it.id ? subForm(it.id) : '') +
    '</div>';
}

function subForm(parentId) {
  return '<div class="subform">' +
    '<div class="row">' +
      '<input id="s_content" placeholder="子任務內容" style="flex:1 1 100%;">' +
    '</div>' +
    '<div class="row">' +
      '<input id="s_assignee" placeholder="指派給（選填）">' +
      '<input id="s_due" type="date" title="期限（選填）">' +
      '<button id="s_save" onclick="saveSub(\'' + parentId + '\')">新增</button>' +
      '<button class="ghost" onclick="cancelSub()">取消</button>' +
    '</div></div>';
}

function startSub(id) { SUB_PARENT = id; renderList(); focusEl('s_content'); }
function cancelSub() { SUB_PARENT = null; renderList(); }

function focusEl(id) {
  setTimeout(function () {
    var e = document.getElementById(id);
    if (e) e.focus();
  }, 0);
}

function saveSub(parentId) {
  var content = document.getElementById('s_content').value.trim();
  if (!content) { setStatus('請填寫子任務內容'); return; }
  var parent = ITEMS.filter(function (i) { return i.id === parentId; })[0];

  document.getElementById('s_save').disabled = true;
  setStatus('新增中…');
  api()
    .withSuccessHandler(function (items) {
      SUB_PARENT = null; refreshWith(items); loadResidents();
    })
    .withFailureHandler(function (e) {
      var b = document.getElementById('s_save');
      if (b) b.disabled = false;
      fail(e);
    })
    .addItem({
      from: MY_NAME,
      parentId: parentId,
      assignee: document.getElementById('s_assignee').value.trim(),
      due: document.getElementById('s_due').value,
      category: parent ? parent.category : '其他',
      resident: parent ? (parent.resident || '') : '',
      priority: parent ? parent.priority : '一般',
      content: content
    }, MY_CODE);
}

/* ---- 編輯 ---- */

function startEdit(id) { EDITING_ID = id; renderList(); }
function cancelEdit() { EDITING_ID = null; renderList(); }

function editCard(it, depth) {
  var opts = function (arr, cur) {
    return arr.map(function (v) {
      return '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>';
    }).join('');
  };
  return '' +
    '<div class="item editing' + (depth ? ' child' : '') + '">' +
      '<div class="row">' +
        '<input id="e_assignee" placeholder="指派給（選填）" value="' + esc(it.assignee) + '">' +
        '<input id="e_resident" list="residentList" placeholder="住民（選填）" value="' +
          esc(it.resident || '') + '">' +
        '<select id="e_category">' + opts(ME.categories, it.category) + '</select>' +
        '<select id="e_priority">' + opts(ME.priorities, it.priority) + '</select>' +
        '<input id="e_due" type="date" value="' + esc(it.due) + '" title="期限">' +
      '</div>' +
      '<textarea id="e_content">' + esc(it.content) + '</textarea>' +
      '<input id="e_note" placeholder="備註（選填）" value="' + esc(it.note) + '" ' +
        'style="width:100%;margin-top:8px;">' +
      '<div class="actions" style="margin-top:10px;">' +
        '<button id="e_save" onclick="saveEdit(\'' + it.id + '\')">儲存</button>' +
        '<button class="ghost" onclick="cancelEdit()">取消</button>' +
        '<span style="color:var(--muted);font-size:12px;align-self:center;">' +
          '改期限會同步更新日曆行程</span>' +
      '</div>' +
    '</div>';
}

function saveEdit(id) {
  var content = document.getElementById('e_content').value.trim();
  if (!content) { setStatus('內容不可空白'); return; }
  document.getElementById('e_save').disabled = true;
  setStatus('儲存中…');
  api()
    .withSuccessHandler(function (items) {
      EDITING_ID = null; refreshWith(items); loadResidents();
    })
    .withFailureHandler(function (e) {
      var b = document.getElementById('e_save');
      if (b) b.disabled = false;
      fail(e);
    })
    .updateItem(id, {
      assignee: document.getElementById('e_assignee').value.trim(),
      resident: document.getElementById('e_resident').value.trim(),
      category: document.getElementById('e_category').value,
      priority: document.getElementById('e_priority').value,
      due: document.getElementById('e_due').value,
      note: document.getElementById('e_note').value.trim(),
      content: content
    }, MY_CODE);
}

function refreshWith(items) { ITEMS = items; setStatus(''); renderAll(); }
function fail(e) {
  if (handleAuthError(e)) return;
  setStatus('操作失敗：' + e.message);
}

/**
 * 新增交班。有填子任務時走後端的 addItemWithSubs，一次往返全部建好。
 * 後端還沒加這支函式的話（會回「未知的動作」），自動退回原本的做法：
 * 先建主事項，再依序用 addItem + parentId 補子任務。
 */
document.getElementById('addBtn').onclick = function () {
  var content = document.getElementById('content').value.trim();
  if (!content) { setStatus('請填寫交班內容'); focusEl('content'); return; }

  var subs = collectSubRows();
  var resident = document.getElementById('resident').value.trim();
  var beforeIds = {};
  ITEMS.forEach(function (i) { beforeIds[i.id] = true; });

  var btn = document.getElementById('addBtn');
  btn.disabled = true;
  setStatus('儲存中…');

  var payload = {
    from: MY_NAME,
    assignee: document.getElementById('assignee').value.trim(),
    resident: resident,
    category: document.getElementById('category').value,
    priority: document.getElementById('priority').value,
    due: document.getElementById('due').value,
    content: content
  };

  var finish = function () {
    document.getElementById('content').value = '';
    document.getElementById('assignee').value = '';
    document.getElementById('resident').value = '';
    document.getElementById('due').value = '';
    clearSubRows();
    btn.disabled = false;
    setStatus('');
    renderAll();
    loadResidents();
  };
  var ok = function (items) { ITEMS = items; finish(); };
  var no = function (e) { btn.disabled = false; fail(e); };

  if (!subs.length) {
    api().withSuccessHandler(ok).withFailureHandler(no).addItem(payload, MY_CODE);
    return;
  }

  // 舊後端的退路：一筆一筆補，功能一樣，只是慢一點
  var fallback = function () {
    setStatus('儲存主事項…');
    api()
      .withSuccessHandler(function (items) {
        ITEMS = items;
        var fresh = items.filter(function (i) { return !beforeIds[i.id] && !i.parentId; })[0];
        if (!fresh) {
          btn.disabled = false;
          renderAll();
          setStatus('主事項已建立，但找不到它的編號，子任務請用卡片上的「＋ 子任務」補上');
          return;
        }
        addSubsSequentially(fresh.id, subs, 0, resident, finish);
      })
      .withFailureHandler(no)
      .addItem(payload, MY_CODE);
  };

  api()
    .withSuccessHandler(ok)
    .withFailureHandler(function (e) {
      if (String(e.message || '').indexOf('未知的動作') >= 0) { fallback(); return; }
      no(e);
    })
    .addItemWithSubs(payload, subs, MY_CODE);
};

function toggle(id) {
  var it = ITEMS.filter(function (i) { return i.id === id; })[0];
  var go = function () {
    setStatus('更新中…');
    api().withSuccessHandler(refreshWith).withFailureHandler(fail).toggleDone(id, MY_NAME, MY_CODE);
  };
  if (it && it.status !== '已完成') {
    var open = childrenOf(id).filter(function (k) { return k.status !== '已完成'; });
    if (open.length) {
      askConfirm('底下還有 ' + open.length + ' 個子任務沒完成，確定要把這筆標記完成嗎？', go);
      return;
    }
  }
  go();
}

function descendantsOf(id) {
  var out = childrenOf(id);
  out.forEach(function (k) { out = out.concat(childrenOf(k.id)); });
  return out;
}

function del(id) {
  var kids = descendantsOf(id);
  var msg = kids.length
    ? '這筆事項底下有 ' + kids.length + ' 個子任務（含更下一層），會一起被刪除。確定嗎？'
    : '確定刪除這筆交班事項？';
  askConfirm(msg, function () {
    setStatus('刪除中…');
    api().withSuccessHandler(refreshWith).withFailureHandler(fail).deleteItem(id, MY_CODE);
  });
}

['passCode', 'whoName'].forEach(function (id) {
  document.getElementById(id).addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); saveWho(); }
  });
});

var resizeTimer;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { if (ITEMS.length) renderDash(); }, 200);
});

document.getElementById('search').oninput = renderList;
document.getElementById('filterCat').onchange = renderList;
document.getElementById('filterResident').onchange = renderList;

document.getElementById('cusSearch').oninput = renderCustody;
document.getElementById('cusFilterPerson').onchange = renderCustody;
document.getElementById('cusOnlyHeld').onchange = renderCustody;

document.getElementById('ruleSearch').oninput = renderRules;
document.getElementById('ruleOnlyOn').onchange = renderRules;
document.getElementById('l_resident').addEventListener('blur', checkResidentHint);

document.getElementById('eqSearch').oninput = renderWork;
document.getElementById('eqFilterType').onchange = renderWork;
document.getElementById('eqOnlyOpen').onchange = renderWork;

renumberSubRows();
init();
</script>
