<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>參訪預約管理 · 線東大眾護理之家</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6ec;--card:#fcfdf8;--ink:#26302a;--sub:#657060;--line:#e1e8d6;--g:#4a8a2e;--g2:#8cc151;--g3:#e8f2da;--teal:#3ba58c;--warm:#d98c3f;--red:#b4412f;
 --s-wait:#d98c3f;--s-ok:#2f7fb0;--s-vis:#158a8a;--s-in:#4f8c3a;--s-can:#8d887c;--s-void:#5a564d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
h1,h2,h3{font-family:'Noto Serif TC','Noto Sans TC',serif}
.top{position:sticky;top:0;z-index:30;background:#fffffb;color:var(--ink);box-shadow:0 2px 12px rgba(74,138,46,.14);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--g2),var(--teal)) 1}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:17px;letter-spacing:.06em;flex:1;min-width:160px;display:flex;align-items:center;gap:12px;color:var(--g)}
.top h1 img{height:38px;width:auto}
.top h1 span{display:block;line-height:1.25;border-left:2px solid var(--line);padding-left:12px}
.top h1 small{display:block;font:400 10.5px 'Noto Sans TC';color:var(--sub);letter-spacing:.2em}
.back{flex:none;display:inline-flex;align-items:center;gap:4px;padding:7px 14px;background:linear-gradient(120deg,#6aae3c,#2f8f78);color:#fff;border-radius:999px;font:700 13px/1 'Noto Sans TC',system-ui,sans-serif;text-decoration:none;box-shadow:0 3px 10px rgba(74,138,46,.28);letter-spacing:.04em}
.back:hover{filter:brightness(1.08)}
.who{display:flex;align-items:center;gap:6px;background:var(--g3);padding:5px 12px;border-radius:99px;font-size:13px;color:var(--g)}
.who input{background:transparent;border:none;border-bottom:1px dashed var(--g);color:var(--ink);width:84px;font-size:13px;padding:1px 2px}
.who input::placeholder{color:#9aa793}
.who input:focus{outline:none;border-bottom-style:solid}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding:0 12px}
.tab{background:none;border:none;color:var(--sub);padding:10px 18px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;letter-spacing:.06em}
.tab.on{color:var(--g);border-color:var(--g)}
.btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;transition:.18s;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:scale(.97)}
.btn-w{background:linear-gradient(135deg,#7dbb3f,#3f8a35 70%,#2f9a7e);color:#fff}.btn-g{background:var(--g);color:#fff}.btn-g:hover{background:#3d7625}
.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn-o:hover{border-color:var(--g)}
.btn-r{background:#fff;border:1.5px solid #e4b9b1;color:var(--red)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
main{max-width:1180px;margin:0 auto;padding:16px}
.banner{background:#fff3df;border:1px solid #f0cf9d;color:#7a5522;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}

/* summary */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.2s;text-align:left}
.kpi:hover{border-color:var(--g);transform:translateY(-2px)}
.kpi.on{border-color:var(--g);background:var(--g3)}
.kpi b{display:block;font:900 26px 'Noto Serif TC';color:var(--g);line-height:1.2}
.kpi span{font-size:13px;color:var(--sub)}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px}
select.f,input.f{padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px var(--g3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ch{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-size:13.5px;cursor:pointer;transition:.15s}
.ch.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.ch em{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}

/* list */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#efe9dd;font-size:12.5px;color:var(--sub);text-align:left;padding:10px 12px;white-space:nowrap;letter-spacing:.08em;cursor:pointer;user-select:none}
td{padding:11px 12px;border-top:1px solid var(--line);font-size:14.5px;vertical-align:middle}
tr.row{cursor:pointer;transition:background .15s;animation:rise .35s both}
tr.row:hover{background:#f3efe6}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pill{display:inline-block;padding:2px 11px;border-radius:99px;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
.cards{display:none}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;animation:rise .35s both}
.rc:active{background:#f3efe6}
.rc .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rc .m{color:var(--sub);font-size:13.5px;margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:46px 10px}
.tag{font-size:12px;background:#ece6d9;color:#6b6558;border-radius:6px;padding:1px 8px;white-space:nowrap}
.warn{color:var(--red);font-weight:700}

/* drawer */
#mask{position:fixed;inset:0;background:rgba(30,28,22,.45);z-index:60;opacity:0;pointer-events:none;transition:.25s}
#mask.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:70;transform:translateX(105%);transition:transform .35s cubic-bezier(.3,.8,.2,1);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.2)}
#dr.on{transform:none}
.dh{background:var(--card);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
.dh .r1{display:flex;align-items:center;gap:10px}
.dh h2{font-size:19px;flex:1}
.dh h2 small{font:400 12px 'Noto Sans TC';color:var(--sub);margin-left:6px}
.x{border:none;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.stbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sb{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:4px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;color:var(--sub)}
.sb.on{color:#fff;border-color:transparent}
.sb:not(.on):hover{border-color:var(--g)}
.db{flex:1;overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.df{background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.df .st{flex:1;font-size:12.5px;color:var(--sub)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.sec>h3{font-size:15px;color:var(--g);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px}
.grid .w{grid-column:1/-1}
.fl label{display:block;font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:3px}
.fl input,.fl select,.fl textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.fl textarea{min-height:90px;resize:vertical}
.fl.chg input,.fl.chg select,.fl.chg textarea{border-color:var(--warm);background:#fff9ef}
.fl.bad input,.fl.bad select{border-color:var(--red);background:#fff6f4}
.fl em{color:var(--red);font-style:normal}
.cks{display:flex;flex-wrap:wrap;gap:6px}
.ck{position:relative}
.ck input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.ck span{display:inline-block;padding:5px 12px;border:1.5px solid var(--line);border-radius:99px;background:#fff;font-size:13.5px;transition:.15s}
.ck input:checked+span{background:var(--g3);border-color:var(--g);color:#2f6b27;font-weight:700}
.ck i{font-style:normal;color:var(--warm);font-size:11.5px}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--g3);border-radius:12px;padding:10px 14px;margin-top:12px;flex-wrap:wrap}
.tot b{font:900 22px 'Noto Serif TC';color:var(--g)}
.tot input{width:130px;font-weight:700;text-align:right}
.note-in{display:grid;grid-template-columns:110px 1fr;gap:8px;margin-bottom:8px}
.nt{position:relative;padding-left:20px;margin-top:12px}
.nt::before{content:"";position:absolute;left:5px;top:6px;bottom:0;width:2px;background:var(--line)}
.ni{position:relative;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;animation:rise .3s both}
.ni::before{content:"";position:absolute;left:-19px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px var(--g3)}
.ni .m{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ni p{white-space:pre-wrap;font-size:14.5px;margin-top:2px}
.hs{font-size:12.5px;color:var(--sub);max-height:260px;overflow:auto}
.hs div{padding:6px 0;border-bottom:1px dashed var(--line)}
.hs b{color:var(--ink)}
.hs del{color:#a09a8e}.hs ins{text-decoration:none;color:var(--g);font-weight:700}
details.fold>summary{cursor:pointer;font-weight:700;color:var(--g);font-size:15px;letter-spacing:.08em;list-style:none;display:flex;justify-content:space-between}
details.fold>summary::after{content:"＋"}
details.fold[open]>summary::after{content:"－"}
details.fold .in2{margin-top:10px}

/* stats */
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{font-size:15px;margin-bottom:12px;color:var(--g)}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
.bar label{width:64px;flex:none;color:var(--sub)}
.bar div{flex:1;background:#ece6d9;border-radius:99px;height:14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar b{width:34px;text-align:right}
.trend{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--sub);gap:3px}
.trend i{width:100%;max-width:44px;background:linear-gradient(var(--g2),var(--teal));border-radius:8px 8px 3px 3px;min-height:3px;transition:height .8s}
.trend b{color:var(--ink);font-size:12.5px}

#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(30px);background:#2b2a26;color:#fff;padding:10px 22px;border-radius:99px;z-index:300;opacity:0;transition:.3s;font-size:14px;max-width:92vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.spin{width:15px;height:15px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spn .8s linear infinite;display:inline-block}
.spin.d{border-color:#d9d2c3;border-top-color:var(--g)}
@keyframes spn{to{transform:rotate(360deg)}}
.load{text-align:center;padding:50px;color:var(--sub)}

@media (max-width:760px){
  .top h1 span{display:none}
  .sum{grid-template-columns:repeat(2,1fr)}
  table{display:none}.cards{display:block}
  .grid{grid-template-columns:1fr}
  .sg{grid-template-columns:1fr}
  .top h1{font-size:16px}
  .note-in{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <a class="back" href="../index.html">&larr; 入口網站</a>
    <h1><img src="logo.png" alt="線東大眾護理之家"><span>參訪預約管理<small>VISIT RESERVATION ADMIN</small></span></h1>
    <div class="who">承辦人 <input id="who" placeholder="輸入姓名"></div>
    <button class="btn btn-w btn-sm" onclick="openRow(null)">＋ 新增紀錄</button>
  </div>
  <div class="tabs"><button class="tab on" data-t="list" onclick="tab('list')">預約清單</button><button class="tab" data-t="stats" onclick="tab('stats')">統計</button></div>
</div>

<main>
  <div class="banner" id="demoBanner" style="display:none"><span>⚠️ 目前是<b>預覽模式</b>（尚未連線 Google 試算表），資料只存在這個瀏覽器；家屬版同一台瀏覽器送出的預約也會出現在這裡。</span><button class="btn btn-o btn-sm" onclick="seedDemo()">載入示範資料</button><button class="btn btn-o btn-sm" onclick="clearDemo()">清空</button></div>

  <div id="v-list">
    <div class="sum" id="kpis"></div>
    <div class="tool">
      <div class="search"><input id="q" placeholder="搜尋姓名、電話、醫院、編號…" oninput="draw()"></div>
      <select class="f" id="fch" onchange="draw()"><option value="">所有來源</option></select>
      <button class="btn btn-o btn-sm" onclick="exportCsv()">⬇ 匯出 CSV</button>
      <button class="btn btn-o btn-sm" onclick="reload()">↻ 重新整理</button>
    </div>
    <div class="chips" id="schips"></div>
    <div class="tbl" id="tbl"></div>
    <div class="cards" id="cards"></div>
  </div>

  <div id="v-stats" style="display:none"></div>
</main>

<div id="mask" onclick="closeDr()"></div>
<aside id="dr" aria-hidden="true">
  <div class="dh">
    <div class="r1"><h2 id="dTitle"></h2><button class="x" onclick="closeDr()" aria-label="關閉">✕</button></div>
    <div class="stbar" id="stbar"></div>
  </div>
  <div class="db" id="dBody"></div>
  <div class="df"><span class="st" id="dSt"></span><button class="btn btn-o" onclick="closeDr()">關閉</button><button class="btn btn-g" id="saveBtn" onclick="save()">儲存</button></div>
</aside>
<div id="toast"></div>

<script>
/* ==================== 設定區 ==================== */
// 後台 Apps Script 網址（部署後貼上；留空 = 預覽模式）
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPqXAUY2AE59y3f7bun1JAvplPBK40fgSrGxdnFlN-oiDObjBra7RWberdCQz8Eerl/exec";
/* ===================================================== */

const STATUSES=["待聯絡","已確認","已參訪","已入住","取消","作廢"];
const SC={"待聯絡":"--s-wait","已確認":"--s-ok","已參訪":"--s-vis","已入住":"--s-in","取消":"--s-can","作廢":"--s-void"};
const CHANNELS=["家屬線上","電話詢問","實地參訪","網路詢問"];
const NOTE_TYPES=["電話","實地","LINE","其他"];
const OPEN_ST=["待聯絡","已確認","已參訪"];
// key,中文標籤（修改歷程使用）
const LABEL={status:"狀態",channel:"詢問方式",wantDate:"希望參訪日",wantSlot:"希望時段",visitDate:"實際參訪日",visitorName:"參訪人姓名",relation:"與長者關係",mobile:"手機",phone:"住家電話",email:"Email",address:"地址",elderName:"長者姓名",gender:"性別",age:"年齡",hospital:"看診醫院",conditions:"身體狀況",condNote:"其他狀況",roomType:"預入住房型",estimate:"系統試算",total:"計價費用合計",bedNo:"預入住床號",reason:"入住原因與病史",identity:"入住身份",mobility:"移動能力",feeding:"進食方式",oxygen:"氧氣",dnr:"DNR",communication:"溝通",medication:"用藥",safety:"安全看視",expectedStay:"預計入住時間",transport:"入住交通",pickupAddr:"接送地址",pickupMode:"接送方式",infoSource:"資料來源",infoSourceNote:"來源備註",handler:"承辦人"};
let PRICE={rooms:[{name:"單人房",price:40000},{name:"2 人房",price:38000},{name:"3 人房",price:35000},{name:"4 人房",price:32000},{name:"5 人房",price:29000}],
  addons:[{key:"尿布",price:3000},{key:"鼻胃管",price:2000},{key:"導尿管",price:2000},{key:"氣切",price:2400},{key:"人工造廔口",price:3000},{key:"傷口",price:0},{key:"其他",price:0}],
  daily:1850,note:"短期照護 $1850／日。新入住前 30 天當月未住滿 30 天者，以日計費。"};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"NT$ "+Number(n||0).toLocaleString();
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const lsGet=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const fmtT=t=>{if(!t)return"";const d=new Date(t);return isNaN(d)?t:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600)}
function pill(s){return `<span class="pill" style="background:var(${SC[s]||"--s-can"})">${esc(s)}</span>`}

/* ---------- 承辦人：自動帶入口網登入的名字 ---------- */
$("#who").value=lsGet("tour_who")||lsGet("handover_name")||"";
$("#who").addEventListener("change",e=>lsSet("tour_who",e.target.value.trim()));
const me=()=>$("#who").value.trim();
function needWho(){if(me())return true;toast("請先在右上角輸入承辦人姓名");$("#who").focus();return false}

/* ---------- API ---------- */
const MK="tour_mock_v1";
const mLoad=()=>{try{const d=JSON.parse(lsGet(MK)||"null");return d&&d.rows?d:{rows:[],notes:[],hist:[]}}catch(e){return{rows:[],notes:[],hist:[]}}};
const mSave=d=>lsSet(MK,JSON.stringify(d));
async function api(action,data){
  if(!SCRIPT_URL){
    await new Promise(r=>setTimeout(r,250));
    const db=mLoad(),now=new Date().toISOString();
    if(action==="list"){const follow={};db.notes.forEach(n=>{if(n.followDate&&(!follow[n.pid]||n.followDate>follow[n.pid]))follow[n.pid]=n.followDate});return{ok:true,rows:db.rows,follow,config:PRICE}}
    if(action==="get"){return{ok:true,row:db.rows.find(r=>r.id===data.id),notes:db.notes.filter(n=>n.pid===data.id).sort((a,b)=>a.time<b.time?1:-1),hist:db.hist.filter(h=>h.pid===data.id).sort((a,b)=>a.time<b.time?1:-1)}}
    if(action==="save"){
      const f=data.fields,by=data.by;let row;
      if(!f.id){const d=new Date(),p=n=>String(n).padStart(2,"0");let k=db.rows.length+1,id;do{id="T"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(k++)}while(db.rows.some(r=>r.id===id));
        row=Object.assign({},f,{id,createdAt:now,updatedAt:now,updatedBy:by});db.rows.push(row);db.hist.push({time:now,pid:id,by,field:"（新增）",oldV:"",newV:"建立預約"});}
      else{row=db.rows.find(r=>r.id===f.id);if(!row)return{ok:false,error:"找不到這筆資料"};
        if(data.baseUpdatedAt&&row.updatedAt!==data.baseUpdatedAt)return{ok:false,conflict:true,error:"這筆資料剛剛被其他人修改過，請重新載入"};
        Object.keys(LABEL).forEach(k=>{const o=String(row[k]==null?"":row[k]),n=String(f[k]==null?"":f[k]);if(k in f&&o!==n){db.hist.push({time:now,pid:row.id,by,field:LABEL[k],oldV:o,newV:n});row[k]=f[k]}});
        row.updatedAt=now;row.updatedBy=by;}
      mSave(db);return{ok:true,row};
    }
    if(action==="note"){db.notes.push({time:now,pid:data.pid,by:data.by,type:data.type,content:data.content,followDate:data.followDate||""});
      const r=db.rows.find(x=>x.id===data.pid);if(r){r.updatedAt=now;r.updatedBy=data.by}mSave(db);return{ok:true}}
    return{ok:false,error:"unknown"};
  }
  const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,data})});
  return res.json();
}

function weekRange(){const d=new Date(),day=(d.getDay()+6)%7,s=new Date(d);s.setDate(d.getDate()-day);const e=new Date(s);e.setDate(s.getDate()+6);const f=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");return[f(s),f(e)]}
const vDate=r=>r.visitDate||r.wantDate||"";
function quickOK(r){
  if(!fQuick)return true;const t=today(),[ws,we]=weekRange();
  if(fQuick==="today")return vDate(r)===t&&OPEN_ST.includes(r.status);
  if(fQuick==="week")return vDate(r)>=ws&&vDate(r)<=we&&OPEN_ST.includes(r.status);
  if(fQuick==="wait")return r.status==="待聯絡";
  if(fQuick==="follow")return FOLLOW[r.id]&&FOLLOW[r.id]<=t&&OPEN_ST.includes(r.status);
  return true;
}
function filtered(){
  const q=$("#q").value.trim().toLowerCase(),ch=$("#fch").value;
  let a=ROWS.filter(r=>{
    if(fStatus==="進行中"&&!OPEN_ST.includes(r.status))return false;
    if(fStatus==="取消／作廢"&&!["取消","作廢"].includes(r.status))return false;
    if(!["全部","進行中","取消／作廢"].includes(fStatus)&&r.status!==fStatus)return false;
    if(ch&&r.channel!==ch)return false;if(!quickOK(r))return false;
    if(q){const s=[r.id,r.visitorName,r.elderName,r.mobile,r.phone,r.hospital,r.email,r.handler].join(" ").toLowerCase();if(!s.includes(q))return false}
    return true;
  });
  const k=sortK;a.sort((x,y)=>{const A=k==="date"?vDate(x):(x[k]||""),B=k==="date"?vDate(y):(y[k]||"");return A<B?-sortD:A>B?sortD:0});
  return a;
}
function draw(){
  const t=today(),[ws,we]=weekRange(),op=ROWS.filter(r=>OPEN_ST.includes(r.status));

  const cnt=s=>s==="全部"?ROWS.length:s==="進行中"?op.length:s==="取消／作廢"?ROWS.filter(r=>["取消","作廢"].includes(r.status)).length:ROWS.filter(r=>r.status===s).length;

}

    toast("已儲存 ✓");const id=r.row.id;CUR=null;ORIG=null;await reload();
    $("#dr").classList.remove("on");$("#mask").classList.remove("on");document.body.style.overflow="";
    if(!fields.id)setTimeout(()=>openRow(id),250);
  }catch(e){toast("連線失敗，請稍後再試")}
  b.innerHTML="儲存";mark();
}
async function addNote(){
  if(!needWho())return;const c=$("#nText").value.trim();if(!c)return toast("請輸入紀錄內容");
  const b=$("#noteBtn");b.disabled=true;
  try{
    const r=await api("note",{pid:CUR.id,by:me(),type:$("#nType").value,content:c,followDate:$("#nFollow").value});
    if(!r.ok)throw 0;toast("已新增訪談紀錄");
    const g=await api("get",{id:CUR.id});
    if(g.ok){const keep=Object.assign({},CUR);ORIG=Object.assign({},g.row);CUR=keep;ORIG.updatedAt=g.row.updatedAt;CUR.updatedAt=g.row.updatedAt;
      $("#notes").innerHTML=g.notes.map(noteHtml).join("");$("#nText").value="";$("#nFollow").value="";FOLLOW[CUR.id]=(g.notes.filter(n=>n.followDate).map(n=>n.followDate).sort().pop())||FOLLOW[CUR.id];draw();mark()}
  }catch(e){toast("新增失敗")}
  b.disabled=false;
}

/* ---------- 統計 ---------- */
function tab(t){
  $$(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("#v-list").style.display=t==="list"?"":"none";$("#v-stats").style.display=t==="stats"?"":"none";
  if(t==="stats")drawStats();
}
function bars(obj,colorFn){
  const e=Object.entries(obj).filter(x=>x[1]>0),mx=Math.max(1,...e.map(x=>x[1]));
  return e.length?e.map(([k,v])=>`<div class="bar"><label>${esc(k)}</label><div><i data-w="${v/mx*100}" style="background:${colorFn(k)}"></i></div><b>${v}</b></div>`).join(""):'<div style="color:var(--sub);font-size:13.5px">尚無資料</div>';
}
function drawStats(){
  const ym=d=>String(d).slice(0,7),now=new Date(),cm=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const monthRows=ROWS.filter(r=>ym(r.createdAt)===cm);
  const visited=ROWS.filter(r=>["已參訪","已入住"].includes(r.status)).length,moved=ROWS.filter(r=>r.status==="已入住").length,valid=ROWS.filter(r=>!["作廢"].includes(r.status)).length;
  const byS={};STATUSES.forEach(s=>byS[s]=ROWS.filter(r=>r.status===s).length);
  const byC={};ROWS.forEach(r=>{const k=r.channel||"未填";byC[k]=(byC[k]||0)+1});
  const byI={};ROWS.forEach(r=>{const k=r.infoSource||"未填";byI[k]=(byI[k]||0)+1});
  const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
  const tr=months.map(m=>[m,ROWS.filter(r=>ym(r.createdAt)===m).length]),tmx=Math.max(1,...tr.map(x=>x[1]));
  const pc=(a,b)=>b?Math.round(a/b*100)+"%":"—";
  $("#v-stats").innerHTML=`
  <div class="sum" style="margin-bottom:12px"><div class="kpi" style="cursor:default"><b>${monthRows.length}</b><span>本月新增預約</span></div><div class="kpi" style="cursor:default"><b>${byS["待聯絡"]}</b><span>目前待聯絡</span></div><div class="kpi" style="cursor:default"><b>${pc(visited,valid)}</b><span>預約 → 參訪</span></div><div class="kpi" style="cursor:default"><b>${pc(moved,visited)}</b><span>參訪 → 入住</span></div></div>
  <div class="sg">
    <div class="panel"><h3>各狀態數量</h3>${bars(byS,k=>`var(${SC[k]})`)}</div>
    <div class="panel"><h3>近 6 個月新增預約</h3><div class="trend">${tr.map(([m,v])=>`<div><b>${v}</b><i data-h="${v/tmx*100}" style="height:0"></i>${m.slice(5)}月</div>`).join("")}</div></div>
    <div class="panel"><h3>詢問方式</h3>${bars(byC,()=>"var(--g)")}</div>
    <div class="panel"><h3>資料來源</h3>${bars(byI,()=>"var(--warm)")}</div>
  </div>
  <p style="color:var(--sub);font-size:12.5px;margin-top:12px">轉換率以目前資料計算：預約→參訪＝（已參訪＋已入住）÷（全部扣除作廢）；參訪→入住＝已入住 ÷（已參訪＋已入住）。</p>`;
  requestAnimationFrame(()=>setTimeout(()=>{$$("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");$$("[data-h]").forEach(e=>e.style.height=e.dataset.h+"%")},30));
}
