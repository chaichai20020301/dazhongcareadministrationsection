<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>探視預約（機台）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--g1:#14583a;--g2:#0f4d33;--leaf:#4f8c3a;--ink:#17261d;--muted:#4b5c52;--paper:#fcf9ef;--card:#fff;--line:#d3dcc7;--soft:#e8f3dc;--soft2:#d9ebcb;--red:#b4402f;--amber:#a8763c;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC",serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:clamp(13px,calc(.58vw + .74vh),24px)}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);touch-action:manipulation;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  .lf{position:fixed;z-index:0;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%}
  .lf.tl{left:0;top:10.6%;width:6.6%;aspect-ratio:110/150;background-image:url(../img/lf-tl.png)}
  .lf.tr{right:0;top:10.6%;width:9.4%;aspect-ratio:157/150;background-image:url(../img/lf-tr.png)}
  .lf.bl{left:0;bottom:0;width:14.4%;aspect-ratio:240/193;background-image:url(../img/lf-bl.png)}
  .lf.br{right:0;bottom:0;width:14.4%;aspect-ratio:240/193;background-image:url(../img/lf-br.png)}
  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:.9rem 2.6rem .8rem}

  /* 頂部：回首頁 / 標誌 / 步驟 / 櫃檯協助 */
  .hd{flex:none;display:flex;align-items:center;gap:1.6rem;min-height:4.8rem}
  .hback{display:inline-flex;align-items:center;gap:.5rem;border:.14rem solid var(--g1);background:rgba(255,255,255,.7);color:var(--ink);border-radius:999px;padding:.55rem 1.5rem;font:900 1.35rem var(--sans)}
  .hback:active{background:var(--soft)}
  .hlogo{height:3.7rem;width:auto;display:block}
  .stp{flex:1;display:flex;justify-content:center;align-items:flex-start;gap:0}
  .si{display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:7.6rem;font:700 1.05rem var(--sans);color:#6b786f}
  .si .c{width:2.9rem;height:2.9rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#b7bcb5;color:#fff;font:900 1.5rem var(--sans)}
  .si.on .c,.si.done .c{background:var(--g1)}
  .si.on,.si.done{color:var(--ink)}
  .si .c svg{width:1.5rem;height:1.5rem}
  .ln{display:block;width:5.4rem;height:.14rem;background:#9aa39b;margin-top:1.4rem}
  .hhelp{display:flex;align-items:center;gap:.8rem;padding-left:1.4rem;border-left:.12rem solid #b9c0b3;font:700 1.12rem/1.3 var(--sans);color:var(--ink)}
  .hhelp svg{width:3.4rem;height:3.4rem;color:var(--g2);flex:none}
  .ttl{flex:none;margin:.5rem 0 .4rem .6rem}
  h1{margin:0;font:900 3.2rem/1.15 var(--sans);letter-spacing:.03em;color:var(--ink)}
  .sub{margin:.2rem 0 0;font:500 1.3rem/1.4 var(--sans);color:var(--muted)}
  .body{flex:1;min-height:0;overflow:auto;padding:.4rem .2rem .6rem}
  .body::-webkit-scrollbar{width:0}
  .body>.two{min-height:100%}
  .nav{flex:none;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.4rem .6rem 0}
  .nav .cnt{font:700 1.5rem var(--sans);color:var(--ink)}
  .nav .cnt b{font:900 3rem/1 var(--sans);color:var(--g1);margin:0 .25rem}
  .nav .hint{flex:1;text-align:center;font:500 1.2rem var(--sans);color:var(--muted)}
  .btn{border:0;border-radius:999px;padding:.75rem 3.2rem;font:900 1.7rem var(--sans)}
  .btn.main{background:var(--g1);color:#fff;box-shadow:0 .35rem .9rem rgba(15,77,51,.28)}
  .btn.sec{background:rgba(255,255,255,.85);color:var(--ink);border:.15rem solid var(--g1)}
  .btn:disabled{opacity:.4;box-shadow:none}
  .btn:active:not(:disabled){transform:scale(.97)}
  .banner{background:#fff4d6;border:2px solid #e8c56b;border-radius:.9rem;padding:.5rem 1rem;margin-bottom:.6rem;font:700 1.05rem var(--sans);color:#7a5a00}

  .panel{background:rgba(255,255,255,.94);border:.12rem solid var(--line);border-radius:1.3rem;padding:.8rem 1.4rem;box-shadow:0 .3rem 1rem rgba(60,90,60,.1)}
  .two{display:grid;grid-template-columns:1.15fr 1fr;gap:1.4rem;align-items:stretch}
  .ph{display:flex;align-items:center;gap:.9rem;margin-bottom:.45rem;font:900 1.8rem var(--sans)}
  .pi{width:2.8rem;height:2.8rem;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--g2)}
  .pi svg{width:1.7rem;height:1.7rem}

  /* step 1 */
  .mbar{display:flex;align-items:center;justify-content:center;gap:2.4rem;margin-bottom:.6rem}
  .mbar .t{font:900 2.4rem var(--sans);min-width:15rem;text-align:center}
  .mbar button{width:3.6rem;height:3.6rem;border:.12rem solid #c4cbbd;border-radius:50%;background:#fff;font:900 1.8rem/1 var(--sans);color:var(--ink)}
  .mbar button:disabled{opacity:.3}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#dfe3d4;border:1px solid #dfe3d4;border-radius:.8rem;overflow:hidden}
  .cal .wd{text-align:center;font:700 1.25rem var(--sans);color:var(--ink);padding:.7rem 0;background:#e9ece0}
  .cal .d{height:3.65rem;border:0;background:#fff;font:700 1.75rem var(--sans);color:var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;border-radius:0}
  .cal .d small{font:700 1rem var(--sans);color:var(--muted);margin-top:.1rem}
  .cal .d.off{background:#fff;color:#a9aea6}
  .cal .d.off.closed{background:#e3e5df;color:var(--ink)}
  .cal .d.sel{background:var(--g1);color:#fff;border-radius:.5rem}
  .cal .d.sel small{color:#dff2e4}
  .cal .d.has::after{content:"";position:absolute;right:.5rem;top:.45rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--leaf)}
  .cal .d.sel.has::after{content:"✓";width:auto;height:auto;background:none;position:static;font:900 1.2rem/1 var(--sans);color:#fff}
  .cal .blank{height:3.65rem;background:#fff}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  .slot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;border:.12rem solid var(--line);background:#fff;border-radius:1rem;padding:.4rem 1.1rem;min-height:4.4rem;text-align:left;width:100%;box-shadow:0 .15rem .5rem rgba(60,90,60,.08)}
  .slot .tm{font:900 2.2rem var(--sans);color:var(--ink)}
  .slot .st{font:500 1.1rem var(--sans);color:var(--muted);text-align:right}
  .slot.warn .st{color:var(--amber);font-weight:700}
  .slot.off{background:#f0f1ec;box-shadow:none}
  .slot.off .tm,.slot.off .st{color:#a9aea6}
  .slot.sel{background:var(--soft);border-color:#8fc27a}
  .slot .ck{width:2.7rem;height:2.7rem;border-radius:50%;background:var(--g1);color:#fff;display:flex;align-items:center;justify-content:center}
  .slot .ck svg{width:1.5rem;height:1.5rem}
  .notice{padding:1.6rem 1rem;text-align:center;font:700 1.3rem/1.5 var(--sans);color:var(--muted)}
  .basket{margin-top:.9rem;padding-top:.7rem;border-top:.12rem solid #e0e4d6;font:700 1.15rem var(--sans);color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
  .tag{display:inline-flex;align-items:center;gap:.6rem;background:var(--soft);border-radius:999px;padding:.35rem .6rem .35rem 1.1rem;font:500 1.2rem var(--sans);color:var(--ink)}
  .tag button{border:0;background:none;font:900 1.3rem/1 var(--sans);color:var(--ink);padding:0 .3rem}

  /* step 2 */
  .field{margin-bottom:.55rem}
  .field label{display:block;margin-bottom:.35rem;font:900 1.3rem var(--sans)}
  .field label .req{color:var(--red);margin-left:.3rem} .field label .opt{color:var(--muted);font-weight:500;font-size:1.05rem;margin-left:.4rem}
  input[type=text],input[type=tel],textarea{width:100%;border:.12rem solid #c6cfbc;border-radius:.8rem;background:#fff;padding:.55rem 1rem;font:500 1.45rem var(--sans);color:var(--ink)}
  input::placeholder,textarea::placeholder{color:#9aa39b}
  input:focus,textarea:focus{outline:none;border:.18rem solid var(--g1);box-shadow:none}
  textarea{min-height:3.8rem;resize:none}
  .sugg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
  .sg{border:.12rem solid var(--line);background:#fff;border-radius:.9rem;padding:.6rem 1rem;font:900 1.5rem var(--sans);text-align:left;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:.5rem;min-height:3.5rem}
  .sg small{font:500 1rem var(--sans);color:var(--muted)}
  .sg:active{background:var(--soft)}
  .smsg{margin-top:.5rem;font:700 1.1rem var(--sans);color:var(--muted);min-height:1.4em}
  .picked{display:flex;align-items:stretch;gap:.8rem}
  .picked .v{flex:1;display:flex;align-items:center;background:var(--soft);border:.12rem solid #c6d9b8;border-radius:.8rem;padding:.6rem 1rem;font:900 1.7rem var(--sans);color:var(--ink)}
  .picked .v small{font:500 1rem var(--sans);color:var(--muted);margin-left:.7rem}
  .picked button,.phoneLock button{border:.14rem solid var(--g1);background:#fff;color:var(--ink);border-radius:.8rem;padding:.5rem 1.3rem;font:700 1.15rem var(--sans)}
  .famrow{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.4rem}
  .fam{border:.12rem solid var(--g1);background:#fff;border-radius:.9rem;padding:.4rem 1rem;font:900 1.35rem/1.25 var(--sans);text-align:left;color:var(--ink);position:relative;min-height:3.6rem}
  .fam small{display:block;font:500 1.05rem var(--sans);color:var(--muted)}
  .fam.on{background:var(--g1);color:#fff}
  .fam.on small{color:#dbece1}
  .fam.on::after{content:"✓";position:absolute;right:.8rem;top:.8rem;width:2.2rem;height:2.2rem;border-radius:50%;background:#fff;color:var(--g1);font:900 1.3rem/2.2rem var(--sans);text-align:center}
  .fam.new{display:flex;align-items:center;gap:.6rem;font-size:1.3rem}
  .rels{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
  .chip{border:.12rem solid var(--g1);background:#fff;border-radius:.6rem;padding:.4rem .3rem;font:700 1.25rem var(--sans);color:var(--ink)}
  .chip.on{background:var(--g1);color:#fff}
  .err{color:var(--red);font:700 1.05rem var(--sans);margin-top:.2rem;min-height:0}
  .alert{background:#fbeeec;border:2px solid #e6c9c4;border-radius:1rem;padding:.7rem 1rem;margin-top:.6rem;font:700 1.15rem/1.45 var(--sans);color:#7a2b22}
  .phoneLock{display:flex;align-items:stretch;gap:.8rem}
  .phoneLock .v{flex:1;border:.12rem solid #c6d9b8;border-radius:.8rem;padding:.7rem 1rem;font:700 1.5rem var(--sans);color:var(--ink);background:var(--soft)}
  .note{font:500 .95rem var(--sans);color:var(--muted);margin-top:.25rem}

  /* step 3 / done */
  .sum{background:rgba(255,255,255,.95);border:.12rem solid var(--line);border-radius:1.3rem;padding:.6rem 1.4rem 1rem;box-shadow:0 .3rem 1rem rgba(60,90,60,.1)}
  .sum .sh{display:flex;align-items:center;gap:.9rem;padding:.4rem 0 .6rem;font:900 2.2rem var(--sans)}
  .sum .sh svg{width:2.6rem;height:2.6rem;color:var(--g2)}
  .sum .r{display:flex;align-items:center;gap:1.4rem;padding:.5rem 0;border-top:.1rem solid #dfe3d4}
  .sum .r .k{flex:none;width:18rem;background:#eef0e8;border-radius:.7rem;padding:.8rem 1.1rem;font:900 1.5rem var(--sans);color:var(--ink)}
  .sum .r .v{flex:1;font:900 2.2rem var(--sans);display:flex;align-items:center;flex-wrap:wrap;gap:.9rem}
  .sum .r .v .pill{background:var(--soft);border-radius:.8rem;padding:.4rem 1.2rem;font:700 1.55rem var(--sans)}
  .sum .r .v small{font:500 1.2rem var(--sans);color:var(--muted)}
  .center{text-align:center}
  .done{display:flex;flex-direction:column;align-items:center;padding-top:.2rem}
  .done .wr{width:min(38rem,62vw);height:auto;display:block}
  .done h1{font-size:4rem;margin-top:-.4rem}
  .done .sub{font-size:1.6rem}
  .done .sum{width:min(78rem,90%);margin:1.2rem auto .4rem;padding:.3rem 1.2rem}
  .done .sum .r:first-child{border-top:0}
  .done .sum .r .k{width:12rem;background:none;padding-left:.4rem}
  .done .sum .r .v{font-size:1.9rem}
  .done .cd{margin:.5rem 0 .6rem;font:500 1.2rem var(--sans);color:var(--muted)}
  .done .btns{display:flex;gap:1.4rem}
  @media (max-aspect-ratio:1/1){
    .two{grid-template-columns:1fr !important}
    .hd{flex-wrap:wrap;gap:.8rem}.hhelp{display:none}.stp{order:3;flex-basis:100%}.ln{width:3rem}.si{min-width:5.4rem}
    h1{font-size:2.6rem}.sum .r{flex-direction:column;align-items:stretch;gap:.5rem}.sum .r .k{width:auto}
    .rels{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<div class="lf tl"></div><div class="lf tr"></div><div class="lf bl"></div><div class="lf br"></div>
<div id="app"></div>

<script>
/* ===== 設定 ===== */
var API = "https://script.google.com/macros/s/AKfycbxstYtZTFyuC0ChLh1KtJSRj4sH7w0xUHPaecI9xTvbeVDiqo73xOau7FNwyw0aTKag/exec";
var MOCK = /[?&]mock=1/.test(location.search);        // ?mock=1：用假資料預覽，不連後端、不送出
var SLOTS = ["08:30","09:30","10:30","14:00","15:00","16:00"];
var WEEKDAY_LIMIT = 6, WEEKEND_LIMIT = 8, MAX_SLOTS = 5, MIN_QUERY = 2;
var RELS = ["配偶","長子","次子","長女","次女","媳婦","女婿","孫子","孫女","兄弟姊妹","外籍看護"];
var WD = ["日","一","二","三","四","五","六"];
var PERSIST_KEY = "nh_final_rel_v2";                  // 與現行探視頁共用，避免兩邊重複計算名額

var D = { records:[], suspensions:[], blocked:[], loaded:false, loadErr:false };
var S = { step:1, month:firstOfMonth(new Date()), selDate:"", basket:[], q:"", sugg:[], suggState:"idle", resident:null, manual:false,
          fams:[], famState:"idle", fam:{id:"",name:"",rel:"",phone:"",masked:"",locked:false}, note:"", err:{}, sending:false, done:false, sendErr:"" };
var $app = document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function pad(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function firstOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function normDate(s){ if(!s) return ""; var d=new Date(s); if(!isNaN(d.getTime())) return ymd(d); var p=String(s).replace(/\//g,"-").trim().split("-"); return p.length===3? p[0]+"-"+pad(p[1])+"-"+pad(p[2]) : String(s); }
function normTime(s){ if(!s) return ""; s=String(s).trim().replace(/：/g,":"); if(s==="全天") return "全天"; if(s.indexOf(" ")>=0) s=s.split(" ")[1]; var p=s.split(":"); return p.length>=2? p[0].replace(/^0/,"")+":"+p[1] : s; }
function normName(s){ return String(s||"").replace(/[（(][^）)]*[）)]/g,"").replace(/\s+/g,"").trim(); }
function fmtDate(ds){ var d=new Date(ds+"T00:00:00"); return (d.getMonth()+1)+"月"+d.getDate()+"日（週"+WD[d.getDay()]+"）"; }
function todayStr(){ return ymd(new Date()); }

/* ===== 名額規則（與現行探視頁一致）===== */
function persisted(){ try{ var l=JSON.parse(localStorage.getItem(PERSIST_KEY)||"[]"); var n=Date.now(); return l.filter(function(i){return n-i.timestamp<600000;}); }catch(e){ return []; } }
function savePersisted(date,time){ try{ var l=persisted(); l.push({date:date,time:time,timestamp:Date.now()}); localStorage.setItem(PERSIST_KEY,JSON.stringify(l)); }catch(e){} }
function dayInfo(ds){
  var dow=new Date(ds+"T00:00:00").getDay();
  if(dow===0) return {closed:true,label:"休",reason:"每週日不開放探視"};
  var fd=D.suspensions.filter(function(s){return normDate(s.date)===ds && s.time==="全天";})[0];
  if(fd){ var l=parseInt(fd.limit); if(!(l>0)) return {closed:true,label:"暫停",reason:fd.reason||"本日暫停開放"}; }
  return {closed:false};
}
function slotInfo(ds,t){
  var nT=normTime(t), dow=new Date(ds+"T00:00:00").getDay();
  var fd=D.suspensions.filter(function(s){return normDate(s.date)===ds && s.time==="全天";})[0];
  var fdl=null; if(fd){ var l0=parseInt(fd.limit); if(l0>0) fdl=l0; }
  var sb=D.suspensions.filter(function(s){return normDate(s.date)===ds && normTime(s.time)===nT;})[0];
  var custom=null; if(sb && parseInt(sb.limit)>0) custom=parseInt(sb.limit); else if(fdl!==null) custom=fdl;
  var base=(dow===6||dow===0)?WEEKEND_LIMIT:WEEKDAY_LIMIT, limit=custom!==null?custom:base;
  var used=D.records.filter(function(r){return normDate(r.date||r["預約日期"])===ds && normTime(r.time||r["預約時段"])===nT;}).length
         + persisted().filter(function(p){return normDate(p.date)===ds && normTime(p.time)===nT;}).length;
  if(sb && !(parseInt(sb.limit)>0)) return {off:true,label:sb.reason||"暫停開放",left:0};
  var left=Math.max(0,limit-used);
  if(used>=limit) return {off:true,label:"已額滿",left:0};
  return {off:false,left:left,warn:left<=2,label:left<=2?"僅餘 "+left+" 組":"尚餘 "+left+" 組"};
}
function inBasket(ds,t){ return S.basket.some(function(b){return b.date===ds&&b.time===t;}); }

/* ===== 資料來源 ===== */
var MOCK_RES=[{id:"m1",name:"王小明",floor:""},{id:"m2",name:"王小美",floor:""},{id:"m3",name:"王大同",floor:"3F"},{id:"m4",name:"王大同",floor:"5F"},{id:"m5",name:"陳月西",floor:""},{id:"m6",name:"黃國進",floor:""}];
var MOCK_FAM={m1:[{fid:"f1",name:"王大華",relation:"長子",phoneMasked:"0912-***-678"},{fid:"f2",name:"李美玲",relation:"媳婦",phoneMasked:"0933-***-210"}],m6:[{fid:"f3",name:"黃志強",relation:"次子",phoneMasked:"0955-***-402"}]};
function getJSON(url){ return fetch(url,{cache:"no-store"}).then(function(r){return r.json();}); }
function loadData(){
  if(MOCK){
    var recs=[], d=new Date(); for(var i=0;i<10;i++){ var x=new Date(d); x.setDate(d.getDate()+i); recs.push({date:ymd(x),time:"09:30"}); recs.push({date:ymd(x),time:"09:30"}); }
    for(var k=0;k<6;k++) recs.push({date:ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+2)),time:"14:00"});
    D.records=recs; D.suspensions=[{date:ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+4)),time:"全天",limit:0,reason:"機構活動"}];
    D.blocked=[{name:"黃國進(Guo Jin)",start:ymd(d),end:ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+6))}]; D.loaded=true; render(); return Promise.resolve();
  }
  return getJSON(API+"?t="+Date.now()).then(function(j){ D.records=j.records||[]; D.suspensions=j.suspensions||[]; D.blocked=j.blockedNames||[]; D.loaded=true; D.loadErr=false; })
    .catch(function(){ D.loadErr=true; }).then(function(){ if(S.step===1 && !S.done) render(); });
}
var suggSeq=0, suggTimer=null;
function doSuggest(){
  var q=S.q, key=normName(q);
  clearTimeout(suggTimer);
  if(key.length<MIN_QUERY){ S.sugg=[]; S.suggState="idle"; paintSugg(); return; }
  S.suggState="loading"; paintSugg();
  var my=++suggSeq;
  suggTimer=setTimeout(function(){
    var p = MOCK ? Promise.resolve({ok:true,items:MOCK_RES.filter(function(r){return r.name.indexOf(key)>=0;}).slice(0,6)})
                 : getJSON(API+"?action=suggest&q="+encodeURIComponent(q)+"&t="+Date.now());
    p.then(function(j){ if(my!==suggSeq) return;
      if(j && j.ok && j.items){ S.sugg=j.items; S.suggState=j.items.length?"ok":"empty"; }

  }, 250);

function home(){ try{ parent.postMessage({kiosk:"home"}, location.origin); }catch(e){} }
function reset(){ S={ step:1, month:firstOfMonth(new Date()), selDate:"", basket:[], q:"", sugg:[], suggState:"idle", resident:null, manual:false, fams:[], famState:"idle", fam:{id:"",name:"",rel:"",phone:"",masked:"",locked:false}, note:"", err:{}, sending:false, done:false, sendErr:"" }; loadData(); render(); }

/* ===== 互動 ===== */
function keepInputs(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:null;};
  if(g("fname")!==null) S.fam.name=g("fname").trim(); if(g("fphone")!==null) S.fam.phone=g("fphone").trim(); if(g("note")!==null) S.note=g("note");
  if(g("q")!==null) S.q=g("q");
}
function bind(){
  var on=function(id,fn){ var e=document.getElementById(id); if(e) e.onclick=fn; };
  document.querySelectorAll("[data-day]").forEach(function(b){ b.onclick=function(){ if(b.dataset.off) return; S.selDate=b.dataset.day; render(); }; });
  document.querySelectorAll("[data-slot]").forEach(function(b){ b.onclick=function(){ if(b.dataset.off) return; var t=b.dataset.slot, ds=S.selDate;
    if(inBasket(ds,t)) S.basket=S.basket.filter(function(x){return !(x.date===ds&&x.time===t);});
    else if(S.basket.length>=MAX_SLOTS){ alert1("最多可一次預約 "+MAX_SLOTS+" 個時段"); return; } else S.basket.push({date:ds,time:t});
    render(); }; });
  document.querySelectorAll("[data-rm]").forEach(function(b){ b.onclick=function(){ var p=b.dataset.rm.split("|"); S.basket=S.basket.filter(function(x){return !(x.date===p[0]&&x.time===p[1]);}); render(); }; });
  on("pm",function(){ S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1); render(); });
  on("nm",function(){ S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1); render(); });
  on("to2",function(){ S.step=2; render(); loadData(); if(S.resident&&S.famState==="idle") loadFamilies(S.resident.id); });
  on("back1",function(){ keepInputs(); S.step=1; render(); });
  on("chg",function(){ keepInputs(); S.resident=null; S.fams=[]; S.famState="idle"; S.fam={id:"",name:"",rel:"",phone:"",masked:"",locked:false}; S.q=""; S.sugg=[]; S.suggState="idle"; render(); });
  on("chgPhone",function(){ keepInputs(); S.fam.locked=false; S.fam.phone=""; S.fam.masked=""; render(); });
  document.querySelectorAll("[data-rel]").forEach(function(b){ b.onclick=function(){ keepInputs(); S.fam.rel=b.dataset.rel; S.err.rel=""; render(); }; });
  var q=document.getElementById("q"); if(q){ q.oninput=function(){ S.q=q.value; doSuggest(); }; if(!S.resident) setTimeout(function(){ try{q.focus();}catch(e){} },60); }
  on("to3",function(){ keepInputs(); S.err={};
    if(!S.resident) S.err.res="請輸入長輩姓名並點選下方的建議";
    if(!S.fam.name) S.err.name="請填寫您的姓名"; if(!S.fam.rel) S.err.rel="請選擇與長輩的關係";
    if(!S.fam.locked && S.fam.phone.replace(/\D/g,"").length<8) S.err.phone="請填寫正確的聯絡電話";
    if(S.err.res||S.err.name||S.err.rel||S.err.phone){ render(); return; }
    if(isoBlocks().length){ render(); return; }
    S.step=3; S.sendErr=""; render(); });
  on("back2",function(){ S.step=2; render(); if(S.resident&&S.famState==="idle") loadFamilies(S.resident.id); });
  on("send",send);
}
function alert1(msg){ var b=document.createElement("div"); b.textContent=msg; b.style.cssText="position:fixed;left:50%;bottom:7rem;transform:translateX(-50%);background:#1c2b23;color:#fff;padding:.9rem 2rem;border-radius:999px;font:700 1.3rem var(--sans);z-index:9"; document.body.appendChild(b); setTimeout(function(){b.remove();},2200); }

/* ===== 送出 ===== */
async function send(){
  if(S.sending) return; S.sending=true; S.sendErr=""; render();
  var byTime={}; S.basket.forEach(function(s){ (byTime[s.time]=byTime[s.time]||[]).push(s.date); });
  var phone=S.fam.locked? "" : S.fam.phone;
  try{
    if(MOCK){ await new Promise(function(r){setTimeout(r,700);}); }
    else{
      for(var t in byTime){
        var data={ residentName:S.resident.name, residentId:S.resident.id, familyName:S.fam.name, familyId:S.fam.id||"", relationship:S.fam.rel, phone:phone, note:S.note.trim(), time:t, dates:byTime[t] };
        var ctl=new AbortController(), to=setTimeout(function(){ctl.abort();},45000);
        var res=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data),signal:ctl.signal});
        clearTimeout(to);
        var j=null; try{ j=await res.json(); }catch(e){}
        if(j && j.ok===false) throw new Error(j.error||"server");
      }
      S.basket.forEach(function(s){ savePersisted(s.date,s.time); });
    }
    S.done=true; S.sending=false; render();
  }catch(e){
    S.sending=false;
    var m=String(e&&e.message||"");
    S.sendErr = m==="full" ? "有時段剛好被預約額滿了，請回上一步重新選擇時段。"
              : m==="isolation" ? "這位長輩目前暫停探視，請洽櫃檯人員協助。"
              : "預約沒有成功，資料還在，請再按一次「確認預約」；若仍失敗請洽櫃檯人員協助。";
    render();
  }
}

loadData(); setInterval(function(){ if(!S.done && S.step===1) loadData(); }, 60000);
render();
</script>
</body>
</html>
