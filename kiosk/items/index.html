<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>物品登記（家屬）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--green:#2f9e6b;--green-d:#1c6b48;--gold:#c8923a;--ink:#1c2b23;--muted:#5d6d63;--paper:#f2efe6;--card:#fffdf8;--line:#e0d8c8;--red:#b4402f;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC",serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);touch-action:manipulation}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1500px;margin:0 auto;padding:22px 40px 40px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 36px}
  @media (max-width:1000px){.g2{grid-template-columns:1fr}}
  .steps{display:flex;gap:10px;margin-bottom:20px}
  .steps div{flex:1;text-align:center;padding:14px 6px;border-radius:14px;background:#e8e2d3;color:var(--muted);font:700 20px var(--sans)}
  .steps div.on{background:linear-gradient(120deg,var(--green),var(--green-d));color:#fff}
  .steps div.done{background:#cfe6d7;color:var(--green-d)}
  h1{margin:0 0 6px;font:900 38px/1.2 var(--serif)}
  .sub{margin:0 0 22px;font:500 22px/1.5 var(--sans);color:var(--muted)}
  .field{margin-bottom:22px}
  .field label{display:block;margin-bottom:8px;font:700 24px var(--sans)}
  .field label .req{color:var(--red)}
  .field label .opt{color:var(--muted);font-weight:500;font-size:20px;margin-left:8px}
  input[type=text],input[type=tel],textarea{width:100%;border:2px solid var(--line);border-radius:16px;background:#fff;padding:18px 20px;font:500 28px var(--sans);color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 5px rgba(47,158,107,.18)}
  textarea{min-height:130px;resize:none}
  .chips{display:flex;flex-wrap:wrap;gap:12px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:14px 30px;font:700 24px var(--sans);color:var(--ink)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .err{margin-top:8px;color:var(--red);font:700 22px var(--sans);min-height:1.2em}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .tile{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 12px 12px 18px}
  .tile.on{border-color:var(--green);background:#eef8f2}
  .tile .nm{font:700 24px var(--sans)}
  .stp{display:flex;align-items:center;gap:6px}
  .stp button{width:58px;height:58px;border:0;border-radius:50%;background:#e8e2d3;color:var(--ink);font:900 32px/1 var(--sans)}
  .stp button.add{background:var(--green);color:#fff}
  .stp button:active{transform:scale(.92)}
  .stp .q{min-width:34px;text-align:center;font:900 28px var(--sans)}
  .other{display:flex;gap:12px;align-items:center;margin-top:6px}
  .other input[type=text]{flex:1}
  .other .qty{width:150px;display:flex;align-items:center;justify-content:center}
  .btn{border:0;border-radius:999px;padding:20px 46px;font:900 28px var(--sans)}
  .btn.main{background:linear-gradient(120deg,var(--green),var(--green-d));color:#fff;box-shadow:0 6px 16px rgba(28,107,72,.3)}
  .btn.sec{background:#fff;color:var(--green-d);border:2px solid var(--green)}
  .btn:disabled{opacity:.5}
  .btn:active{transform:scale(.97)}
  .nav{display:flex;justify-content:space-between;gap:16px;margin-top:20px;position:sticky;bottom:0;padding:16px 0 14px;background:linear-gradient(to top,var(--paper) 78%,rgba(242,239,230,0));z-index:3}
  .sum{background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 22px;margin-bottom:22px}
  .sum .r{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line);font:500 24px/1.4 var(--sans)}
  .sum .r:last-child{border-bottom:0}
  .sum .r span:first-child{color:var(--muted);flex:none}
  .sum .r span:last-child{font-weight:700;text-align:right}
  .picked{margin:20px 0 0;font:700 22px var(--sans);color:var(--green-d)}
  .done{text-align:center;padding:50px 20px}
  .done .ok{width:150px;height:150px;margin:0 auto 24px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font-size:92px;line-height:150px}
  .done h1{font-size:48px}
  .done p{font:500 28px/1.6 var(--sans);color:var(--muted);margin:14px 0}
  .banner{background:#fff4d6;border:2px solid #e8c56b;border-radius:16px;padding:14px 18px;margin-bottom:20px;font:700 22px var(--sans);color:#7a5a00}
  @media (max-width:700px){.wrap{padding:14px}h1{font-size:30px}.tile{padding:10px}.steps div{font-size:16px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===== 設定 ===== */
var API_URL = "https://script.google.com/macros/s/AKfycbwN0nILIfWhTlZAgOUnuVt9TuvaLAJG3RRPMA7XDQWS5-c2Up8rghz7mU89_Ez6GsjT/exec";   // 物品系統後端；需已新增 familyDropoff 動作
var DRY = /[?&]dry=1/.test(location.search);   // ?dry=1 只看畫面，不送出
var COMMON = ["長袖上衣","短袖上衣","長褲","短褲","外套","內衣","內褲","襪子","帽子","毛巾","拖鞋","鞋子","杯子","牙刷","牙膏","臉盆","衛生紙","濕紙巾","尿布","看護墊"];
var RELS = ["子女","配偶","孫輩","兄弟姊妹","其他親屬","朋友"];

var S = { step:1, resident:"", family:"", rel:"", phone:"", items:{}, other:[], oName:"", oQty:1, note:"", err:{}, sending:false, done:false, sendErr:"" };
var $app = document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function list(){
  var out=[];
  COMMON.forEach(function(n){ if(S.items[n]>0) out.push({name:n,qty:S.items[n]}); });
  S.other.forEach(function(o){ out.push({name:o.name,qty:o.qty}); });
  return out;
}
function stepsHtml(){
  var t=["① 基本資料","② 帶來的物品","③ 確認送出"];
  return '<div class="steps">'+t.map(function(x,i){ var n=i+1; return '<div class="'+(S.step===n?'on':(S.step>n?'done':''))+'">'+x+'</div>'; }).join("")+'</div>';
}

function render(){
  if(S.done) return renderDone();
  var h = stepsHtml();
  if(DRY) h += '<div class="banner">預覽模式：不會真的送出資料</div>';
  if(S.step===1) h += step1(); else if(S.step===2) h += step2(); else h += step3();
  $app.innerHTML = h;
  bind();
}

function step1(){
  return '<h1>請先填寫基本資料</h1><p class="sub">讓櫃檯人員知道這些物品是給哪一位長輩</p><div class="g2">'
  + '<div class="field"><label>長輩的姓名 <span class="req">＊</span></label><input type="text" id="resident" value="'+esc(S.resident)+'" placeholder="例如：王小明" autocomplete="off"><div class="err">'+esc(S.err.resident||"")+'</div></div>'
  + '<div class="field"><label>您的姓名 <span class="req">＊</span></label><input type="text" id="family" value="'+esc(S.family)+'" placeholder="例如：王大華" autocomplete="off"><div class="err">'+esc(S.err.family||"")+'</div></div>'
  + '<div class="field"><label>您與長輩的關係 <span class="req">＊</span></label><div class="chips">'
  + RELS.map(function(r){ return '<button type="button" class="chip'+(S.rel===r?' on':'')+'" data-rel="'+r+'">'+r+'</button>'; }).join("")
  + '</div><div class="err">'+esc(S.err.rel||"")+'</div></div>'
  + '<div class="field"><label>聯絡電話<span class="opt">（選填）</span></label><input type="tel" id="phone" value="'+esc(S.phone)+'" placeholder="例如：0912345678" autocomplete="off"></div></div>'
  + '<div class="nav"><span></span><button class="btn main" id="next1">下一步 →</button></div>';
}

function step2(){
  var tiles = COMMON.map(function(n){
    var q=S.items[n]||0;
    return '<div class="tile'+(q>0?' on':'')+'"><span class="nm">'+n+'</span><span class="stp">'
      + (q>0?'<button type="button" data-dec="'+n+'">−</button><span class="q">'+q+'</span>':'')
      + '<button type="button" class="add" data-inc="'+n+'">＋</button></span></div>';
  }).join("");
  var others = S.other.map(function(o,i){
    return '<div class="tile on"><span class="nm">'+esc(o.name)+'</span><span class="stp"><span class="q">× '+o.qty+'</span><button type="button" data-rm="'+i+'">✕</button></span></div>';
  }).join("");
  var n=list().reduce(function(a,x){return a+x.qty;},0);
  return '<h1>這次帶來哪些物品？</h1><p class="sub">點「＋」增加數量；沒有在清單裡的請填在下方「其他物品」</p>'
  + '<div class="tiles">'+tiles+others+'</div>'
  + '<div class="field" style="margin-top:26px"><label>其他物品<span class="opt">（清單裡沒有的）</span></label>'
  + '<div class="other"><input type="text" id="oName" value="'+esc(S.oName)+'" placeholder="例如：輪椅坐墊" autocomplete="off">'
  + '<span class="stp qty"><button type="button" id="oDec">−</button><span class="q">'+S.oQty+'</span><button type="button" class="add" id="oInc">＋</button></span>'
  + '<button type="button" class="btn sec" id="oAdd" style="padding:16px 30px">加入</button></div><div class="err">'+esc(S.err.other||"")+'</div></div>'
  + '<div class="picked">目前共選了 '+n+' 件</div><div class="err">'+esc(S.err.items||"")+'</div>'
  + '<div class="nav"><button class="btn sec" id="prev">← 上一步</button><button class="btn main" id="next2">下一步 →</button></div>';
}

function step3(){
  var items=list();
  return '<h1>請確認後送出</h1><p class="sub">送出後請把物品交給櫃檯人員點收</p>'
  + '<div class="sum"><div class="r"><span>長輩</span><span>'+esc(S.resident)+'</span></div>'
  + '<div class="r"><span>登記人</span><span>'+esc(S.family)+'（'+esc(S.rel)+'）'+(S.phone?'　'+esc(S.phone):'')+'</span></div>'
  + '<div class="r"><span>物品</span><span>'+items.map(function(x){return esc(x.name)+' × '+x.qty;}).join("、")+'</span></div></div>'
  + '<div class="field"><label>備註<span class="opt">（選填，例如：需要標示姓名、易碎品）</span></label><textarea id="note" maxlength="200">'+esc(S.note)+'</textarea></div>'
  + (S.sendErr?'<div class="err" style="font-size:24px;margin-bottom:12px">'+esc(S.sendErr)+'</div>':'')
  + '<div class="nav"><button class="btn sec" id="prev"'+(S.sending?' disabled':'')+'>← 上一步</button><button class="btn main" id="send"'+(S.sending?' disabled':'')+'>'+(S.sending?'送出中…':'確認送出')+'</button></div>';
}

function renderDone(){
  $app.innerHTML = '<div class="done"><div class="ok">✓</div><h1>登記完成，謝謝您！</h1>'
  + '<p>請把物品交給櫃檯人員點收</p><p><b id="dc">15</b> 秒後自動回到首頁</p>'
  + '<div style="margin-top:20px"><button class="btn main" id="goHome">回首頁</button> <button class="btn sec" id="again">再登記一位長輩</button></div></div>';
  var n=15, t=setInterval(function(){ n--; var e=document.getElementById("dc"); if(e) e.textContent=n; if(n<=0){ clearInterval(t); home(); } },1000);
  document.getElementById("goHome").onclick=function(){ clearInterval(t); home(); };
  document.getElementById("again").onclick=function(){ clearInterval(t); reset(); };
}
function home(){ try{ parent.postMessage({kiosk:"home"}, location.origin); }catch(e){} }
function reset(){ S={ step:1, resident:"", family:"", rel:"", phone:"", items:{}, other:[], oName:"", oQty:1, note:"", err:{}, sending:false, done:false, sendErr:"" }; render(); window.scrollTo(0,0); }

function keep(){ var g=function(id){var e=document.getElementById(id);return e?e.value:null;};
  if(g("resident")!==null) S.resident=g("resident").trim(); if(g("family")!==null) S.family=g("family").trim();
  if(g("phone")!==null) S.phone=g("phone").trim(); if(g("oName")!==null) S.oName=g("oName"); if(g("note")!==null) S.note=g("note"); }

function bind(){
  var q=function(sel,fn){ [].forEach.call(document.querySelectorAll(sel),fn); };
  q("[data-rel]",function(b){ b.onclick=function(){ keep(); S.rel=b.dataset.rel; S.err.rel=""; render(); }; });
  q("[data-inc]",function(b){ b.onclick=function(){ keep(); var n=b.dataset.inc; S.items[n]=Math.min(99,(S.items[n]||0)+1); S.err.items=""; render(); }; });
  q("[data-dec]",function(b){ b.onclick=function(){ keep(); var n=b.dataset.dec; S.items[n]=Math.max(0,(S.items[n]||0)-1); render(); }; });
  q("[data-rm]",function(b){ b.onclick=function(){ keep(); S.other.splice(+b.dataset.rm,1); render(); }; });
  var on=function(id,fn){ var e=document.getElementById(id); if(e) e.onclick=fn; };
  on("next1",function(){ keep(); S.err={};
    if(!S.resident) S.err.resident="請填寫長輩的姓名"; if(!S.family) S.err.family="請填寫您的姓名"; if(!S.rel) S.err.rel="請選擇您與長輩的關係";
    if(S.err.resident||S.err.family||S.err.rel){ render(); return; } S.step=2; render(); window.scrollTo(0,0); });
  on("prev",function(){ keep(); S.sendErr=""; S.step--; render(); window.scrollTo(0,0); });
  on("oDec",function(){ keep(); S.oQty=Math.max(1,S.oQty-1); render(); });
  on("oInc",function(){ keep(); S.oQty=Math.min(99,S.oQty+1); render(); });
  on("oAdd",function(){ keep(); var n=(S.oName||"").trim(); if(!n){ S.err.other="請先填寫物品名稱"; render(); return; }
    S.other.push({name:n.slice(0,40),qty:S.oQty}); S.oName=""; S.oQty=1; S.err.other=""; S.err.items=""; render(); });
  on("next2",function(){ keep(); if(!list().length){ S.err.items="請至少選擇一項物品"; render(); return; } S.err.items=""; S.step=3; render(); window.scrollTo(0,0); });
  on("send",send);
}

async function send(){
  keep(); if(S.sending) return;
  S.sending=true; S.sendErr=""; render();
  var data={ residentName:S.resident, familyName:S.family, relation:S.rel, phone:S.phone, items:list(), note:S.note.trim() };
  try{
    if(DRY){ await new Promise(function(r){setTimeout(r,600);}); }
    else{
      var ctl=new AbortController(), to=setTimeout(function(){ctl.abort();},45000);
      var res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"familyDropoff",data:data}),signal:ctl.signal});
      clearTimeout(to);
      var j=await res.json();
      if(!j||!j.ok) throw new Error((j&&j.error)||"server");
    }
    S.done=true; S.sending=false; render();
  }catch(e){
    S.sending=false;
    S.sendErr="登記沒有成功，資料還在，請再按一次「確認送出」；若仍失敗請洽櫃檯人員協助。";
    render();
  }
}
render();
</script>
</body>
</html>
