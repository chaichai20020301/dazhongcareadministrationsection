<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>物品登記（家屬）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--g1:#14583a;--g2:#0f4d33;--leaf:#4f8c3a;--ink:#17261d;--muted:#4b5c52;--paper:#fcf9ef;--card:#fff;--line:#d3dcc7;--soft:#e8f3dc;--soft2:#d9ebcb;--red:#b4402f;--amber:#a8763c;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC",serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:clamp(13px,calc(.55vw + .7vh),22px)}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);touch-action:manipulation;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  .lf{position:fixed;z-index:0;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%}
  .lf.tl{left:0;top:10.6%;width:6.6%;aspect-ratio:110/150;background-image:url(../img/lf-tl.png)}
  .lf.tr{right:0;top:10.6%;width:9.4%;aspect-ratio:157/150;background-image:url(../img/lf-tr.png)}
  .lf.bl{left:0;bottom:0;width:14.4%;aspect-ratio:240/251;background-image:url(../img/lf-bl.png)}
  .lf.br{right:0;bottom:0;width:14.5%;aspect-ratio:242/251;background-image:url(../img/lf-br.png)}
  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:.9rem 2.6rem .8rem}

  /* 頂部：回首頁 / 標誌 / 步驟 / 櫃檯協助 */
  .hd{flex:none;display:flex;align-items:center;gap:1.6rem;min-height:4.8rem}
  .hback{display:inline-flex;align-items:center;gap:.5rem;border:.14rem solid var(--g1);background:rgba(255,255,255,.7);color:var(--ink);border-radius:999px;padding:.55rem 1.5rem;font:900 1.35rem var(--sans)}
  .hback:active{background:var(--soft)}
  .hlogo{height:3.7rem;width:auto;display:block}
  .hsteps{flex:1;display:flex;justify-content:center;align-items:flex-start;gap:0}
  .si{display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:7.6rem;font:700 1.05rem var(--sans);color:#6b786f}
  .si .c{width:2.9rem;height:2.9rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#b7bcb5;color:#fff;font:900 1.5rem var(--sans)}
  .si.on .c,.si.done .c{background:var(--g1)}
  .si.on,.si.done{color:var(--ink)}
  .si .c svg{width:1.5rem;height:1.5rem}
  .ln{display:block;width:5.4rem;height:.14rem;background:#9aa39b;margin-top:1.4rem}
  .hhelp{display:flex;align-items:center;gap:.8rem;padding-left:1.4rem;border-left:.12rem solid #b9c0b3;font:700 1.12rem/1.3 var(--sans);color:var(--ink)}
  .hhelp svg{width:3.4rem;height:3.4rem;color:var(--g2);flex:none}
  .ttl{flex:none;margin:.9rem 0 .5rem .6rem}
  h1{margin:0;font:900 3.2rem/1.15 var(--sans);letter-spacing:.03em;color:var(--ink)}
  .sub{margin:.2rem 0 0;font:500 1.3rem/1.4 var(--sans);color:var(--muted)}
  .body{flex:1;min-height:0;overflow:auto;padding:.4rem .2rem .6rem}
  .body::-webkit-scrollbar{width:0}
  .nav{flex:none;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem .6rem 0}
  .nav .cnt{font:700 1.5rem var(--sans);color:var(--ink)}
  .nav .cnt b{font:900 3rem/1 var(--sans);color:var(--g1);margin:0 .25rem}
  .nav .hint{flex:1;text-align:center;font:500 1.2rem var(--sans);color:var(--muted)}
  .btn{border:0;border-radius:999px;padding:.9rem 3.2rem;font:900 1.75rem var(--sans)}
  .btn.main{background:var(--g1);color:#fff;box-shadow:0 .35rem .9rem rgba(15,77,51,.28)}
  .btn.sec{background:rgba(255,255,255,.85);color:var(--ink);border:.15rem solid var(--g1)}
  .btn:disabled{opacity:.4;box-shadow:none}
  .btn:active:not(:disabled){transform:scale(.97)}
  .banner{background:#fff4d6;border:2px solid #e8c56b;border-radius:.9rem;padding:.5rem 1rem;margin-bottom:.6rem;font:700 1.05rem var(--sans);color:#7a5a00}

  .panel{background:rgba(255,255,255,.94);border:.12rem solid var(--line);border-radius:1.3rem;padding:1rem 1.5rem;box-shadow:0 .3rem 1rem rgba(60,90,60,.1)}
  .two{display:grid;grid-template-columns:1.15fr 1fr;gap:1.4rem;align-items:stretch}
  .ph{display:flex;align-items:center;gap:.9rem;margin-bottom:.7rem;font:900 1.9rem var(--sans)}
  .pi{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--g2)}
  .pi svg{width:1.7rem;height:1.7rem}

  /* step 1 */
  .mbar{display:flex;align-items:center;justify-content:center;gap:2.4rem;margin-bottom:.6rem}
  .mbar .t{font:900 2.4rem var(--sans);min-width:15rem;text-align:center}
  .mbar button{width:3.6rem;height:3.6rem;border:.12rem solid #c4cbbd;border-radius:50%;background:#fff;font:900 1.8rem/1 var(--sans);color:var(--ink)}
  .mbar button:disabled{opacity:.3}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#dfe3d4;border:1px solid #dfe3d4;border-radius:.8rem;overflow:hidden}
  .cal .wd{text-align:center;font:700 1.25rem var(--sans);color:var(--ink);padding:.7rem 0;background:#e9ece0}
  .cal .d{height:4.15rem;border:0;background:#fff;font:700 1.75rem var(--sans);color:var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;border-radius:0}
  .cal .d small{font:700 1rem var(--sans);color:var(--muted);margin-top:.1rem}
  .cal .d.off{background:#fff;color:#a9aea6}
  .cal .d.off.closed{background:#e3e5df;color:var(--ink)}
  .cal .d.sel{background:var(--g1);color:#fff;border-radius:.5rem}
  .cal .d.sel small{color:#dff2e4}
  .cal .d.has::after{content:"";position:absolute;right:.5rem;top:.45rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--leaf)}
  .cal .d.sel.has::after{content:"✓";width:auto;height:auto;background:none;position:static;font:900 1.2rem/1 var(--sans);color:#fff}
  .cal .blank{height:4.15rem;background:#fff}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  .slot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;border:.12rem solid var(--line);background:#fff;border-radius:1rem;padding:.4rem 1.1rem;min-height:4.4rem;text-align:left;width:100%;box-shadow:0 .15rem .5rem rgba(60,90,60,.08)}
  .slot .tm{font:900 2.2rem var(--sans);color:var(--ink)}
  .slot .st{font:500 1.1rem var(--sans);color:var(--muted);text-align:right}
  .slot.warn .st{color:var(--amber);font-weight:700}
  .slot.off{background:#f0f1ec;box-shadow:none}
  .slot.off .tm,.slot.off .st{color:#a9aea6}
  .slot.sel{background:var(--soft);border-color:#8fc27a}
  .slot .ck{width:2.7rem;height:2.7rem;border-radius:50%;background:var(--g1);color:#fff;display:flex;align-items:center;justify-content:center}
  .slot .ck svg{width:1.5rem;height:1.5rem}
  .notice{padding:1.6rem 1rem;text-align:center;font:700 1.3rem/1.5 var(--sans);color:var(--muted)}
  .basket{margin-top:.9rem;padding-top:.7rem;border-top:.12rem solid #e0e4d6;font:700 1.15rem var(--sans);color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
  .tag{display:inline-flex;align-items:center;gap:.6rem;background:var(--soft);border-radius:999px;padding:.35rem .6rem .35rem 1.1rem;font:500 1.2rem var(--sans);color:var(--ink)}
  .tag button{border:0;background:none;font:900 1.3rem/1 var(--sans);color:var(--ink);padding:0 .3rem}

  /* step 2 */
  .field{margin-bottom:.8rem}
  .field label{display:block;margin-bottom:.35rem;font:900 1.3rem var(--sans)}
  .field label .req{color:var(--red);margin-left:.3rem} .field label .opt{color:var(--muted);font-weight:500;font-size:1.05rem;margin-left:.4rem}
  input[type=text],input[type=tel],textarea{width:100%;border:.12rem solid #c6cfbc;border-radius:.8rem;background:#fff;padding:.7rem 1rem;font:500 1.5rem var(--sans);color:var(--ink)}
  input::placeholder,textarea::placeholder{color:#9aa39b}
  input:focus,textarea:focus{outline:none;border:.18rem solid var(--g1);box-shadow:none}
  textarea{min-height:5.4rem;resize:none}
  .sugg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
  .sg{border:.12rem solid var(--line);background:#fff;border-radius:.9rem;padding:.6rem 1rem;font:900 1.5rem var(--sans);text-align:left;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:.5rem;min-height:3.5rem}
  .sg small{font:500 1rem var(--sans);color:var(--muted)}
  .sg:active{background:var(--soft)}
  .smsg{margin-top:.5rem;font:700 1.1rem var(--sans);color:var(--muted);min-height:1.4em}
  .picked{display:flex;align-items:stretch;gap:.8rem}
  .picked .v{flex:1;display:flex;align-items:center;background:var(--soft);border:.12rem solid #c6d9b8;border-radius:.8rem;padding:.6rem 1rem;font:900 1.7rem var(--sans);color:var(--ink)}
  .picked .v small{font:500 1rem var(--sans);color:var(--muted);margin-left:.7rem}
  .picked button,.phoneLock button{border:.14rem solid var(--g1);background:#fff;color:var(--ink);border-radius:.8rem;padding:.5rem 1.3rem;font:700 1.15rem var(--sans)}
  .famrow{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.4rem}
  .fam{border:.12rem solid var(--g1);background:#fff;border-radius:.9rem;padding:.6rem 1rem;font:900 1.4rem/1.3 var(--sans);text-align:left;color:var(--ink);position:relative;min-height:4.4rem}
  .fam small{display:block;font:500 1.05rem var(--sans);color:var(--muted)}
  .fam.on{background:var(--g1);color:#fff}
  .fam.on small{color:#dbece1}
  .fam.on::after{content:"✓";position:absolute;right:.8rem;top:.8rem;width:2.2rem;height:2.2rem;border-radius:50%;background:#fff;color:var(--g1);font:900 1.3rem/2.2rem var(--sans);text-align:center}
  .fam.new{display:flex;align-items:center;gap:.6rem;font-size:1.3rem}
  .rels{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
  .chip{border:.12rem solid var(--g1);background:#fff;border-radius:.6rem;padding:.55rem .3rem;font:700 1.25rem var(--sans);color:var(--ink)}
  .chip.on{background:var(--g1);color:#fff}
  .err{color:var(--red);font:700 1.05rem var(--sans);margin-top:.3rem;min-height:1.1em}
  .alert{background:#fbeeec;border:2px solid #e6c9c4;border-radius:1rem;padding:.7rem 1rem;margin-top:.6rem;font:700 1.15rem/1.45 var(--sans);color:#7a2b22}
  .phoneLock{display:flex;align-items:stretch;gap:.8rem}
  .phoneLock .v{flex:1;border:.12rem solid #c6d9b8;border-radius:.8rem;padding:.7rem 1rem;font:700 1.5rem var(--sans);color:var(--ink);background:var(--soft)}
  .note{font:500 .95rem var(--sans);color:var(--muted);margin-top:.25rem}

  /* step 3 / done */
  .sum{background:rgba(255,255,255,.95);border:.12rem solid var(--line);border-radius:1.3rem;padding:.6rem 1.4rem 1rem;box-shadow:0 .3rem 1rem rgba(60,90,60,.1)}
  .sum .sh{display:flex;align-items:center;gap:.9rem;padding:.4rem 0 .6rem;font:900 2.2rem var(--sans)}
  .sum .sh svg{width:2.6rem;height:2.6rem;color:var(--g2)}
  .sum .r{display:flex;align-items:center;gap:1.4rem;padding:.5rem 0;border-top:.1rem solid #dfe3d4}
  .sum .r .k{flex:none;width:18rem;background:#eef0e8;border-radius:.7rem;padding:.8rem 1.1rem;font:900 1.5rem var(--sans);color:var(--ink)}
  .sum .r .v{flex:1;font:900 2.2rem var(--sans);display:flex;align-items:center;flex-wrap:wrap;gap:.9rem}
  .sum .r .v .pill{background:var(--soft);border-radius:.8rem;padding:.4rem 1.2rem;font:700 1.55rem var(--sans)}
  .sum .r .v small{font:500 1.2rem var(--sans);color:var(--muted)}
  .center{text-align:center}
  .done{display:flex;flex-direction:column;align-items:center;padding-top:.2rem}
  .done .wr{width:min(38rem,62vw);height:auto;display:block}
  .done h1{font-size:4rem;margin-top:-.4rem}
  .done .sub{font-size:1.6rem}
  .done .sum{width:min(78rem,90%);margin:1.2rem auto .4rem;padding:.3rem 1.2rem}
  .done .sum .r:first-child{border-top:0}
  .done .sum .r .k{width:12rem;background:none;padding-left:.4rem}
  .done .sum .r .v{font-size:1.9rem}
  .done .cd{margin:.5rem 0 .6rem;font:500 1.2rem var(--sans);color:var(--muted)}
  .done .btns{display:flex;gap:1.4rem}
  @media (max-aspect-ratio:1/1){
    .two{grid-template-columns:1fr !important}
    .hd{flex-wrap:wrap;gap:.8rem}.hhelp{display:none}.hsteps{order:3;flex-basis:100%}.ln{width:3rem}.si{min-width:5.4rem}
    h1{font-size:2.6rem}.sum .r{flex-direction:column;align-items:stretch;gap:.5rem}.sum .r .k{width:auto}
    .rels{grid-template-columns:repeat(3,1fr)}
  }

  .btn.small{padding:.5rem 1.4rem;font-size:1.15rem}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem}
  .tabs{display:flex;gap:.6rem;margin-bottom:.6rem}
  .tab{flex:1;border:.12rem solid var(--g1);background:#fff;border-radius:.8rem;padding:.5rem;font:900 1.4rem var(--sans);color:var(--ink)}
  .tab.on{background:var(--g1);color:#fff}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
  .tile{display:flex;align-items:center;justify-content:space-between;gap:.4rem;background:#fff;border:.12rem solid var(--line);border-radius:.9rem;padding:.35rem .5rem .35rem .9rem;min-height:3.5rem}
  .tile.on{border-color:#8fc27a;background:var(--soft)}.tile .nm{font:700 1.3rem var(--sans)}
  .qs{display:flex;align-items:center;gap:.3rem}
  .qs button{width:2.7rem;height:2.7rem;border:0;border-radius:50%;background:#e4e8dc;color:var(--ink);font:900 1.5rem/1 var(--sans)}
  .qs button.add{background:var(--g1);color:#fff}.qs button:active{transform:scale(.92)}.qs .q{min-width:1.6rem;text-align:center;font:900 1.4rem var(--sans)}
  .other{display:flex;gap:.7rem;align-items:center;margin-top:.6rem}.other input{flex:1}
  .sel .row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.4rem 0;border-bottom:.1rem solid #dfe3d4;font:700 1.25rem var(--sans)}
  .sel .row:last-child{border-bottom:0}.sel .row .k{font:700 .95rem var(--sans);color:#fff;background:#b25a1e;border-radius:.5rem;padding:.1rem .5rem;margin-right:.5rem}
  .sel .row .k.i{background:var(--g1)}
  .sel .empty{padding:1.5rem .5rem;text-align:center;color:var(--muted);font:500 1.2rem var(--sans)}
  .sel h3{margin:.1rem 0 .4rem;font:900 1.5rem var(--sans)}
  .cam{position:relative;background:#101a14;border-radius:1rem;overflow:hidden;aspect-ratio:2.2/1;display:flex;align-items:center;justify-content:center}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;color:#e8efe9;font:700 1.4rem/1.5 var(--sans);text-align:center;padding:1.5rem}
  .camBtns{display:flex;gap:.8rem;margin-top:.6rem;flex-wrap:wrap}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
  .th{position:relative;border:.12rem solid var(--line);border-radius:.8rem;overflow:hidden;background:#fff;aspect-ratio:4/3}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th button{position:absolute;right:.3rem;top:.3rem;width:2.2rem;height:2.2rem;border:0;border-radius:50%;background:rgba(180,64,47,.92);color:#fff;font:900 1.1rem/1 var(--sans)}
  .th.blank{border-style:dashed;display:flex;align-items:center;justify-content:center;color:#b9b2a3;font:700 1rem var(--sans)}
  .done .code{display:inline-block;margin:.4rem 0;padding:.5rem 2rem;border:.2rem dashed var(--g1);border-radius:1rem;font:900 2.8rem var(--sans);color:var(--g2);letter-spacing:.08em;background:#fff}
  .done p.t{font:500 1.4rem/1.5 var(--sans);color:var(--muted);margin:.3rem 0}
  @media (max-aspect-ratio:1/1){.tiles{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="lf tl"></div><div class="lf tr"></div><div class="lf bl"></div><div class="lf br"></div>
<div id="app"></div>
<input type="file" id="fileIn" accept="image/*" capture="environment" style="display:none">
<script>
/* ===== 設定 ===== */
var API_URL = "https://script.google.com/macros/s/AKfycbwN0nILIfWhTlZAgOUnuVt9TuvaLAJG3RRPMA7XDQWS5-c2Up8rghz7mU89_Ez6GsjT/exec";   // 物品系統後端：公開只用 suggest 與 familyDropoff
var MOCK = /[?&]mock=1/.test(location.search);   // ?mock=1：假資料預覽，不連線、不送出
var COMMON_ITEM = ["長袖上衣","短袖上衣","長褲","短褲","外套","內衣","內褲","襪子","帽子","毛巾","拖鞋","鞋子","杯子","牙刷","臉盆","圍巾"];
var COMMON_CONS = ["衛生紙","濕紙巾","尿布","看護墊","口罩","手套","潔身液","乳液","牙膏","沐浴乳","洗髮精","營養品"];
var RELS = ["子女","配偶","孫輩","兄弟姊妹","其他親屬","朋友"];
var MAX_PHOTOS = 6, MAX_B64 = 850000, LONG_EDGE = 1280, MIN_Q = 2;
var MOCK_RES=[{id:"m1",name:"王小明",floor:""},{id:"m2",name:"王小美",floor:""},{id:"m3",name:"王大同",floor:"3F"},{id:"m4",name:"王大同",floor:"5F"},{id:"m5",name:"陳月西",floor:""}];

var S;
function fresh(){ return { step:1, q:"", sugg:[], suggState:"idle", resident:null, family:"", rel:"", phone:"", tab:"item", sel:[], oName:"", oQty:1, photos:[], note:"", err:{}, sending:false, done:false, code:"", sendErr:"" }; }
S=fresh();
var cam={stream:null,state:"idle"};
var $app=document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function normName(s){ return String(s||"").replace(/[（(][^）)]*[）)]/g,"").replace(/\s+/g,"").trim(); }

/* ===== 已選物品 ===== */
function qtyOf(kind,name){ var r=S.sel.filter(function(x){return x.kind===kind&&x.name===name;})[0]; return r?r.qty:0; }
function setQty(kind,name,q){ var i=S.sel.findIndex(function(x){return x.kind===kind&&x.name===name;});
  if(q<=0){ if(i>=0) S.sel.splice(i,1); } else if(i>=0) S.sel[i].qty=Math.min(99,q); else S.sel.push({kind:kind,name:name,qty:Math.min(99,q)}); }
function totalQty(){ return S.sel.reduce(function(a,x){return a+x.qty;},0); }

/* ===== 建議住民 ===== */
var suggSeq=0, suggTimer=null;
function getJSON(u){ return fetch(u,{cache:"no-store"}).then(function(r){return r.json();}); }
function doSuggest(){
  var key=normName(S.q); clearTimeout(suggTimer);
  if(key.length<MIN_Q){ S.sugg=[]; S.suggState="idle"; paintSugg(); return; }
  S.suggState="loading"; paintSugg(); var my=++suggSeq;
  suggTimer=setTimeout(function(){
    var p=MOCK?Promise.resolve({ok:true,items:MOCK_RES.filter(function(r){return r.name.indexOf(key)>=0;}).slice(0,6)}):getJSON(API_URL+"?action=suggest&q="+encodeURIComponent(S.q)+"&t="+Date.now());
    p.then(function(j){ if(my!==suggSeq) return;
      if(j&&j.ok&&j.items){ S.sugg=j.items; S.suggState=j.items.length?"ok":"empty"; }
      else if(j&&j.ok===false&&j.error==="busy"){ S.sugg=[]; S.suggState="busy"; } else { S.sugg=[]; S.suggState="error"; }
      paintSugg(); }).catch(function(){ if(my!==suggSeq) return; S.sugg=[]; S.suggState="error"; paintSugg(); });
  },250);
}
function paintSugg(){
  var box=document.getElementById("suggBox"), msg=document.getElementById("suggMsg"); if(!box||!msg) return;
  box.innerHTML=S.sugg.map(function(r,i){return '<button class="sg" data-sg="'+i+'"><span>'+esc(r.name)+'</span>'+(r.floor?'<small>'+esc(r.floor)+'</small>':'')+'</button>';}).join("");
  var key=normName(S.q), m="";
  if(S.suggState==="idle") m=key.length?"再多輸入一個字，系統就會幫您找":"";
  else if(S.suggState==="loading") m="尋找中…"; else if(S.suggState==="ok") m="請點選您要登記的長輩";
  else if(S.suggState==="empty") m="找不到符合的長輩，請確認姓名是否正確，或洽櫃檯人員協助";
  else if(S.suggState==="busy") m="目前查詢人數較多，請稍候幾秒再試"; else m="目前無法自動搜尋，請洽櫃檯人員協助";
  msg.textContent=m;
  box.querySelectorAll("[data-sg]").forEach(function(b){ b.onclick=function(){ var r=S.sugg[+b.dataset.sg]; S.resident={id:r.id,name:r.name,floor:r.floor||""}; S.sugg=[]; S.suggState="idle"; S.err.res=""; keep(); render(); }; });
}

/* ===== 鏡頭與照片 ===== */
function stopCam(){ if(cam.stream){ try{cam.stream.getTracks().forEach(function(t){t.stop();});}catch(e){} cam.stream=null; } cam.state="idle"; }
function startCam(){
  if(cam.state==="on"||cam.state==="starting") return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ cam.state="error"; paintCam(); return; }
  cam.state="starting"; paintCam();
  navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(st){
    if(S.step!==3||S.done){ st.getTracks().forEach(function(t){t.stop();}); cam.state="idle"; return; }
    cam.stream=st; var v=document.getElementById("vid"); if(!v){ stopCam(); return; } v.srcObject=st;
    return v.play().then(function(){ cam.state="on"; paintCam(); });
  }).catch(function(){ cam.state="error"; paintCam(); });
}
function paintCam(){
  var m=document.getElementById("camMsg"), btn=document.getElementById("snap"); if(!m) return;
  if(cam.state==="on"){ m.style.display="none"; if(btn) btn.disabled=S.photos.length>=MAX_PHOTOS; }
  else{ m.style.display="flex"; if(btn) btn.disabled=true;
    m.innerHTML = cam.state==="starting"?'<div>鏡頭啟動中…<br><small>若畫面詢問是否允許使用鏡頭，請按「允許」</small></div>'
      : '<div>無法使用機台鏡頭<br><small>可改用下方「從檔案選擇照片」，或不拍照直接下一步</small></div><button class="btn sec small" id="retryCam">重新啟動鏡頭</button>';
    var r=document.getElementById("retryCam"); if(r) r.onclick=function(){ cam.state="idle"; startCam(); }; }
}
function canvasToB64(cv){
  var q=0.75, d=cv.toDataURL("image/jpeg",q);
  while(d.length>MAX_B64 && q>0.3){ q-=0.1; d=cv.toDataURL("image/jpeg",q); }
  if(d.length>MAX_B64) return null;
  return d;
}
function addPhotoFromSource(src,w,h){
  if(S.photos.length>=MAX_PHOTOS) return false;
  var sc=Math.min(1,LONG_EDGE/Math.max(w,h)), cw=Math.round(w*sc), ch=Math.round(h*sc);
  var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch; cv.getContext("2d").drawImage(src,0,0,cw,ch);
  var d=canvasToB64(cv); if(!d) return false;
  S.photos.push({url:d,b64:d.replace(/^data:image\/jpeg;base64,/,"")}); return true;
}
function snap(){
  var v=document.getElementById("vid"); if(!v||cam.state!=="on"||!v.videoWidth) return;
  if(addPhotoFromSource(v,v.videoWidth,v.videoHeight)){ paintThumbs(); paintCam(); }
}
function fromFile(f){
  if(!f) return; var u=URL.createObjectURL(f), im=new Image();
  im.onload=function(){ addPhotoFromSource(im,im.naturalWidth,im.naturalHeight); URL.revokeObjectURL(u); paintThumbs(); paintCam(); };
  im.onerror=function(){ URL.revokeObjectURL(u); };
  im.src=u;
}
document.getElementById("fileIn").onchange=function(e){ var fs=e.target.files; for(var i=0;i<fs.length&&S.photos.length<MAX_PHOTOS;i++) fromFile(fs[i]); e.target.value=""; };
function paintThumbs(){
  var box=document.getElementById("thumbs"); if(!box) return;
  var h=S.photos.map(function(p,i){return '<div class="th"><img src="'+p.url+'" alt=""><button data-del="'+i+'">✕</button></div>';}).join("");
  for(var i=S.photos.length;i<MAX_PHOTOS;i++) h+='<div class="th blank">'+(i+1)+'</div>';
  box.innerHTML=h; var c=document.getElementById("pcount"); if(c) c.textContent=S.photos.length;
  box.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(){ S.photos.splice(+b.dataset.del,1); paintThumbs(); paintCam(); }; });
}

/* ===== 畫面 ===== */
/* ===== 畫面 ===== */
var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var ICO_HS='<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 52V44a30 30 0 0160 0v8"/><rect x="12" y="46" width="12" height="22" rx="5"/><rect x="76" y="46" width="12" height="22" rx="5"/><path d="M82 68c0 10-8 14-22 14"/><circle cx="50" cy="48" r="13"/><path d="M24 96c2-18 12-26 26-26s24 8 26 26"/></svg>';
var ICO_ONE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.6-4.6 4-7 8.5-7s7.9 2.4 8.5 7z"/></svg>';
var ICO_TWO='<svg viewBox="0 0 28 24" fill="currentColor" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21c.5-4.4 3.6-6.6 8-6.6s7.500 2.200 8 6.600z"/><circle cx="20" cy="9" r="3.2"/><path d="M19.500 14.600c4 0 6.300 1.800 6.800 5.400h-6c-.2-2.300-.5-3.900-1.800-5.200.3-.1.600-.2 1-.2z"/></svg>';
var ICO_CLIP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.500" y="4.500" width="15" height="17" rx="2.500"/><path d="M9 4.500V3.500h6v1M8 11h8M8 15h8"/></svg>';
function headerHtml(){
  var cur=S.done?5:S.step, labels=["長輩與登記人","帶來的物品","拍照","確認送出"];
  var st=labels.map(function(t,i){ var n=i+1; return '<div class="si '+(cur>n?'done':(cur===n?'on':''))+'"><span class="c">'+(cur>n?CHECK:n)+'</span><span class="l">'+t+'</span></div>'; }).join('<i class="ln"></i>');
  return '<header class="hd"><button class="hback" id="hb">← 回首頁</button><img class="hlogo" src="../logo.png" alt="線東大眾護理之家"><div class="hsteps">'+st+'</div>'
    +'<div class="hhelp">'+ICO_HS+'<span>需要協助，<br>請洽櫃檯人員</span></div></header>';
}
function render(){
  if(S.done){ renderDone(); return; }
  if(S.step!==3) stopCam();
  var banner=MOCK?'<div class="banner">預覽模式：假資料，不會連線也不會送出</div>':'';
  var m=S.step===1?step1():S.step===2?step2():S.step===3?step3():step4();
  $app.innerHTML=headerHtml()+'<div class="ttl"><h1>'+m.title+'</h1><p class="sub">'+m.sub+'</p></div><div class="body">'+banner+m.body+'</div><div class="nav">'+m.nav+'</div>';
  var hb=document.getElementById("hb"); if(hb) hb.onclick=home;
  bind(); if(S.step===1){ paintSugg(); } if(S.step===3){ paintThumbs(); paintCam(); startCam(); }
}
function step1(){
  var left=S.resident?'<div class="picked"><div class="v">'+esc(S.resident.name)+(S.resident.floor?'<small>'+esc(S.resident.floor)+'</small>':'')+'</div><button id="chg">更換長輩</button></div>'
    :'<input type="text" id="q" value="'+esc(S.q)+'" placeholder="輸入長輩的姓名，例如：王小明" autocomplete="off"><div class="sugg" id="suggBox"></div><div class="smsg" id="suggMsg"></div>';
  return { title:'請先填寫基本資料',sub:'輸入長輩姓名並點選，讓櫃檯人員知道這些物品是給哪一位長輩',body:'<div class="two"><div class="panel"><div class="ph"><span class="pi">'+ICO_ONE+'</span>長輩資料</div><div class="field"><label>長輩的姓名 <span class="req">＊</span></label>'+left+'<div class="err">'+esc(S.err.res||"")+'</div></div></div>'
    +'<div class="panel"><div class="ph"><span class="pi">'+ICO_TWO+'</span>登記人資料</div><div class="field"><label>您的姓名 <span class="req">＊</span></label><input type="text" id="family" value="'+esc(S.family)+'" placeholder="例如：王大華" autocomplete="off"><div class="err">'+esc(S.err.family||"")+'</div></div>'
    +'<div class="field"><label>與長輩的關係 <span class="req">＊</span></label><div class="chips">'+RELS.map(function(r){return '<button type="button" class="chip'+(S.rel===r?' on':'')+'" data-rel="'+r+'">'+r+'</button>';}).join("")+'</div><div class="err">'+esc(S.err.rel||"")+'</div></div>'
    +'<div class="field"><label>聯絡電話<span class="opt">（選填）</span></label><input type="tel" id="phone" value="'+esc(S.phone)+'" placeholder="例如：0912345678" autocomplete="off"></div></div></div>',
    nav:'<span class="hint"></span><button class="btn main" id="to2">下一步 →</button>' };
}
function step2(){
  var list=S.tab==="item"?COMMON_ITEM:COMMON_CONS;
  var tiles=list.map(function(n){ var q=qtyOf(S.tab,n); return '<div class="tile'+(q>0?' on':'')+'"><span class="nm">'+n+'</span><span class="qs">'+(q>0?'<button type="button" data-dec="'+n+'">−</button><span class="q">'+q+'</span>':'')+'<button type="button" class="add" data-inc="'+n+'">＋</button></span></div>'; }).join("");
  var selHtml=S.sel.length?S.sel.map(function(x,i){return '<div class="row"><span><span class="k '+(x.kind==="item"?"i":"")+'">'+(x.kind==="item"?"用品":"消耗品")+'</span>'+esc(x.name)+'</span><span class="qs"><button type="button" data-sdec="'+i+'">−</button><span class="q">'+x.qty+'</span><button type="button" class="add" data-sinc="'+i+'">＋</button></span></div>';}).join(""):'<div class="empty">還沒有選擇物品<br>點左邊的「＋」加入</div>';
  return { title:'這次帶來哪些物品？',sub:'分成「用品」（衣物、日用品）和「消耗品」（衛生紙、尿布等）；沒有在清單裡的請填在「其他」',body:'<div class="two" style="grid-template-columns:2.1fr 1fr"><div class="panel"><div class="tabs"><button class="tab'+(S.tab==="item"?' on':'')+'" data-tab="item">用品</button><button class="tab'+(S.tab==="cons"?' on':'')+'" data-tab="cons">消耗品</button></div><div class="tiles">'+tiles+'</div>'
    +'<div class="other"><input type="text" id="oName" value="'+esc(S.oName)+'" placeholder="其他'+(S.tab==="item"?'用品':'消耗品')+'，例如：'+(S.tab==="item"?'輪椅坐墊':'成人營養奶粉')+'" maxlength="20" autocomplete="off"><span class="qs"><button type="button" id="oDec">−</button><span class="q">'+S.oQty+'</span><button type="button" class="add" id="oInc">＋</button></span><button type="button" class="btn sec small" id="oAdd">加入</button></div><div class="err">'+esc(S.err.other||"")+'</div></div>'
    +'<div class="panel sel"><h3>已選擇（共 '+totalQty()+' 件）</h3>'+selHtml+'<div class="err">'+esc(S.err.items||"")+'</div></div></div>',
    nav:'<button class="btn sec" id="back">← 上一步</button><span class="hint"></span><button class="btn main" id="to3">下一步 →</button>' };
}
function step3(){
  return { title:'請拍下帶來的物品',sub:'把物品放在鏡頭前拍照（最多 '+MAX_PHOTOS+' 張，可以不拍直接下一步）。照片只供櫃檯人員核對物品。',body:'<div class="two" style="grid-template-columns:1.6fr 1fr"><div class="panel"><div class="cam"><video id="vid" playsinline muted></video><div class="msg" id="camMsg"></div></div>'
    +'<div class="camBtns"><button class="btn main" id="snap" disabled>📷 拍照</button><button class="btn sec" id="pick">從檔案選擇照片</button></div></div>'
    +'<div class="panel"><div style="font:900 1.35rem var(--serif);margin-bottom:.5rem">已拍 <span id="pcount">0</span> / '+MAX_PHOTOS+' 張</div><div class="thumbs" id="thumbs"></div></div></div>',
    nav:'<button class="btn sec" id="back">← 上一步</button><span class="hint"></span><button class="btn main" id="to4">下一步 →</button>' };
}
function step4(){
  var items=S.sel.map(function(x){return esc(x.name)+' × '+x.qty+(x.kind==="cons"?'（消耗品）':'');}).join("<br>");
  return { title:'請確認後送出',sub:'送出後會產生登記編號，請記下來，櫃檯人員會依編號點收',body:'<div class="two" style="grid-template-columns:1.3fr 1fr"><div><div class="sum"><div class="r"><span>長輩</span><span>'+esc(S.resident.name)+'</span></div><div class="r"><span>登記人</span><span>'+esc(S.family)+'（'+esc(S.rel)+'）'+(S.phone?'　'+esc(S.phone):'')+'</span></div><div class="r"><span>物品</span><span>'+items+'</span></div><div class="r"><span>照片</span><span>'+S.photos.length+' 張</span></div></div>'
    +(S.sendErr?'<div class="alert">'+esc(S.sendErr)+'</div>':'')+'</div><div class="panel"><div class="field"><label>備註<span class="opt">（選填，例如：需要標示姓名）</span></label><textarea id="note" maxlength="200">'+esc(S.note)+'</textarea></div></div></div>',
    nav:'<button class="btn sec" id="back"'+(S.sending?' disabled':'')+'>← 上一步</button><span class="hint"></span><button class="btn main" id="send"'+(S.sending?' disabled':'')+'>'+(S.sending?'送出中…':'確認送出')+'</button>' };
}
function renderDone(){
  stopCam();
  $app.innerHTML=headerHtml()+'<div class="body"><div class="done"><img class="wr" src="../img/wreath.png" alt=""><h1>登記完成，謝謝您！</h1><p class="sub">您的登記編號</p><div class="code" id="codeBox">'+esc(S.code)+'</div><p class="t">請記下編號（或用手機拍下這個畫面），櫃檯人員會依編號點收物品。</p><div class="cd"><span id="dc">20</span> 秒後自動回到首頁。</div><div class="btns"><button class="btn main" id="goHome">回首頁</button><button class="btn sec" id="again">再登記一位長輩</button></div></div></div>';
  var hb=document.getElementById("hb"); if(hb) hb.onclick=home;
  var n=20,t=setInterval(function(){ n--; var e=document.getElementById("dc"); if(e) e.textContent=n; if(n<=0){ clearInterval(t); home(); } },1000);
  document.getElementById("goHome").onclick=function(){ clearInterval(t); home(); };
  document.getElementById("again").onclick=function(){ clearInterval(t); reset(); };
}
function home(){ stopCam(); try{ parent.postMessage({kiosk:"home"},location.origin); }catch(e){} }
function reset(){ stopCam(); S=fresh(); render(); }

/* ===== 互動 ===== */
function keep(){ var g=function(id){var e=document.getElementById(id);return e?e.value:null;};
  if(g("family")!==null) S.family=g("family").trim(); if(g("phone")!==null) S.phone=g("phone").trim(); if(g("oName")!==null) S.oName=g("oName"); if(g("note")!==null) S.note=g("note"); if(g("q")!==null) S.q=g("q"); }
function bind(){
  var q=function(sel,fn){ document.querySelectorAll(sel).forEach(fn); }, on=function(id,fn){ var e=document.getElementById(id); if(e) e.onclick=fn; };
  q("[data-rel]",function(b){ b.onclick=function(){ keep(); S.rel=b.dataset.rel; S.err.rel=""; render(); }; });
  q("[data-tab]",function(b){ b.onclick=function(){ keep(); S.tab=b.dataset.tab; S.oName=""; S.oQty=1; render(); }; });
  q("[data-inc]",function(b){ b.onclick=function(){ keep(); setQty(S.tab,b.dataset.inc,qtyOf(S.tab,b.dataset.inc)+1); S.err.items=""; render(); }; });
  q("[data-dec]",function(b){ b.onclick=function(){ keep(); setQty(S.tab,b.dataset.dec,qtyOf(S.tab,b.dataset.dec)-1); render(); }; });
  q("[data-sinc]",function(b){ b.onclick=function(){ keep(); var x=S.sel[+b.dataset.sinc]; setQty(x.kind,x.name,x.qty+1); render(); }; });
  q("[data-sdec]",function(b){ b.onclick=function(){ keep(); var x=S.sel[+b.dataset.sdec]; setQty(x.kind,x.name,x.qty-1); render(); }; });
  var qi=document.getElementById("q"); if(qi){ qi.oninput=function(){ S.q=qi.value; doSuggest(); }; setTimeout(function(){ try{qi.focus();}catch(e){} },60); }
  on("chg",function(){ keep(); S.resident=null; S.q=""; S.sugg=[]; S.suggState="idle"; render(); });
  on("to2",function(){ keep(); S.err={}; if(!S.resident) S.err.res="請輸入長輩姓名並點選下方的建議"; if(!S.family) S.err.family="請填寫您的姓名"; if(!S.rel) S.err.rel="請選擇與長輩的關係";
    if(S.err.res||S.err.family||S.err.rel){ render(); return; } S.step=2; render(); });
  on("back",function(){ keep(); S.sendErr=""; S.step--; render(); });
  on("oDec",function(){ keep(); S.oQty=Math.max(1,S.oQty-1); render(); }); on("oInc",function(){ keep(); S.oQty=Math.min(99,S.oQty+1); render(); });
  on("oAdd",function(){ keep(); var n=(S.oName||"").trim().slice(0,20); if(!n){ S.err.other="請先填寫物品名稱"; render(); return; } setQty(S.tab,n,qtyOf(S.tab,n)+S.oQty); S.oName=""; S.oQty=1; S.err.other=""; S.err.items=""; render(); });
  on("to3",function(){ keep(); if(!S.sel.length){ S.err.items="請至少選擇一項物品"; render(); return; } S.step=3; render(); });
  on("snap",snap); on("pick",function(){ document.getElementById("fileIn").click(); });
  on("to4",function(){ stopCam(); S.step=4; render(); });
  on("send",send);
}

/* ===== 送出（不自動重試，避免重複登記）===== */
async function send(){
  keep(); if(S.sending) return; S.sending=true; S.sendErr=""; render();
  var data={ residentId:S.resident.id, residentName:S.resident.name, familyName:S.family, relation:S.rel, phone:S.phone,
    items:S.sel.map(function(x){return {kind:x.kind==="cons"?"consumable":"item",name:x.name,qty:x.qty};}), note:S.note.trim(),
    photos:S.photos.map(function(p){return {data:p.b64,label:""};}) };
  try{
    if(MOCK){ await new Promise(function(r){setTimeout(r,700);}); S.code="D20261019-001"; }
    else{
      var ctl=new AbortController(), to=setTimeout(function(){ctl.abort();},60000);
      var res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"familyDropoff",data:data}),signal:ctl.signal});
      clearTimeout(to); var j=await res.json();
      if(!j||!j.ok){ var er=new Error((j&&j.error)||"server"); er.server=true; throw er; }
      S.code=j.id||"";
    }
    S.done=true; S.sending=false; render();
  }catch(e){
    S.sending=false;
    if(e&&e.server){ S.sendErr = e.message==="invalid" ? "資料不完整，請檢查長輩姓名與物品後再送出。" : e.message==="busy" ? "目前使用人數較多或今日登記已達上限，請稍後再試，或洽櫃檯人員協助。" : "登記沒有成功，資料還在，請再按一次「確認送出」；若仍失敗請洽櫃檯人員協助。"; }
    else S.sendErr="網路沒有回應，登記「可能已經送出」。請先洽櫃檯人員確認，避免重複登記。";
    render();
  }
}
render();
