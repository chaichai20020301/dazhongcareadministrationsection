<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>線東大眾護理之家 · 家屬自助服務</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2f9e6b; --green-d:#1c6b48; --leaf:#6aae3c;
    --ink:#1c2b23; --muted:#5d6d63; --paper:#f2efe6; --card:#fffdf8; --line:#e6ded0;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --serif:"Noto Serif TC",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer}

  /* ===== 首頁（水彩風）===== */
  #home{position:fixed;inset:0;display:flex;flex-direction:column;padding:2.6vmin 3.6vmin 2vmin;gap:2.4vmin;
    background:#fcf9ef}
  #home.hide{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:2vmin;flex:none}
  .top img{height:clamp(46px,8.4vmin,100px);width:auto;display:block}
  .clock{text-align:right;line-height:1.2}
  .clock .t{font:900 clamp(30px,6vmin,72px)/1 var(--sans);color:#0f4d33;letter-spacing:.02em}
  .clock .d{font:500 clamp(14px,2.2vmin,26px) var(--sans);color:#33443a;margin-top:.6vmin}
  .welcome{position:relative;flex:none;overflow:hidden;border-radius:3vmin;padding:2.6vmin 4vmin;min-height:19vmin;display:flex;flex-direction:column;justify-content:center;
    background:#f3f4e2 url(img/bld.jpg) right center/auto 100% no-repeat;box-shadow:0 .6vmin 2vmin rgba(60,80,50,.12)}
  .welcome::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f6f5e6 0,#f6f5e6 38%,rgba(246,245,230,0) 66%)}
  .welcome>*{position:relative}
  .welcome h1{margin:0;font:900 clamp(30px,5.4vmin,72px)/1.18 var(--serif);letter-spacing:.04em;color:#17261d}
  .welcome h1 br{display:none}
  .welcome p{margin:1vmin 0 0;font:500 clamp(18px,3vmin,38px) var(--sans);color:#33443a}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2.6vmin}
  .card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vmin;text-align:center;
    border:.25vmin solid #c8dcb8;border-radius:3vmin;padding:2.6vmin 2vmin;color:#17261d;overflow:hidden;
    background:linear-gradient(160deg,#e8f3dc,#d9ead0);
    box-shadow:0 .8vmin 2.2vmin rgba(60,90,60,.14);transition:transform .12s ease,box-shadow .12s ease}
  .card:active{transform:scale(.975);box-shadow:0 .3vmin 1vmin rgba(60,90,60,.2)}
  .card .leaf{position:absolute;width:11vmin;height:auto;opacity:.55;pointer-events:none}
  .card .leaf.l{left:-1.5vmin;top:1vmin}
  .card .leaf.r{right:-1.5vmin;bottom:5vmin;transform:scaleX(-1) rotate(8deg)}
  .card .ico{width:clamp(70px,16vmin,190px);height:auto;color:#0f4d33;flex:none;position:relative}
  .card .txt{position:relative}
  .card h2{margin:0;font:900 clamp(30px,5.6vmin,70px)/1.1 var(--sans);letter-spacing:.04em}
  .card p{margin:1vmin 0 0;font:500 clamp(16px,2.5vmin,32px)/1.4 var(--sans);color:#33443a}
  .card .go{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;color:#fff;background:#14583a;
    padding:1.7vmin 3vmin;width:90%;font:900 clamp(20px,3.2vmin,40px) var(--sans);box-shadow:0 .5vmin 1.2vmin rgba(15,77,51,.3)}
  .card.items{background:linear-gradient(160deg,#fdf1de,#f8e4c6);border-color:#efc994;color:#17261d}
  .card.items .ico{color:#a9531b}
  .card.items .go{background:#b25a1e;box-shadow:0 .5vmin 1.2vmin rgba(178,90,30,.3)}
  .card.soon{filter:saturate(.55)}
  .card .tag{position:absolute;right:2.4vmin;top:2.4vmin;z-index:1;background:#fff;color:#8a5a00;border-radius:999px;
    padding:.8vmin 2vmin;font:900 clamp(15px,2.3vmin,26px) var(--sans)}
  .foot{flex:none;display:flex;align-items:center;gap:2.4vmin;padding-top:1.8vmin;border-top:.2vmin solid #cfd3c4;
    font:500 clamp(14px,2.2vmin,26px) var(--sans);color:#33443a}
  .foot .hs{width:clamp(44px,8vmin,90px);height:auto;color:#0f4d33;flex:none}
  .foot .help{font:700 clamp(20px,3.6vmin,46px) var(--sans);color:#17261d;letter-spacing:.03em}
  .foot .info{margin-left:auto;display:flex;align-items:center;gap:2vmin}
  .foot .sep{width:.2vmin;height:3.4vmin;background:#aab1a0}
  .foot b{color:#0f4d33;font-weight:700}
  @media (max-aspect-ratio:1/1){
    .welcome h1 br{display:inline}
    .welcome{min-height:24vmin;padding:3vmin 4vmin}
    .grid{grid-template-columns:1fr;grid-auto-rows:1fr}
    .card{display:grid;grid-template-columns:34% 1fr;grid-template-rows:auto auto;column-gap:2vmin;row-gap:1.2vmin;align-content:center;text-align:left;padding:2.4vmin 3vmin}
    .card .ico{grid-row:1/3;justify-self:center;width:clamp(80px,22vmin,230px)}
    .card .txt{grid-column:2;grid-row:1;align-self:end}
    .card .go{grid-column:2;grid-row:2;align-self:start;width:100%}
    .card .leaf.r{display:none}
    .card h2{font-size:7.2vmin}
    .card p{font-size:3vmin}
    .card .go{font-size:4vmin;padding:2vmin 3vmin}
    .welcome h1{font-size:7vmin}
    .welcome p{font-size:3.4vmin}
    .foot .info{font-size:2.6vmin}
    .foot .help{font-size:4.4vmin}
    .foot{flex-wrap:wrap}
    .foot .info{margin-left:0;flex-basis:100%;margin-top:-1vmin}
    .foot .info .sep{display:none}
    .foot .info{gap:3vmin;justify-content:flex-start}
    .foot .help{flex:1}
  }

  /* ===== 內嵌系統畫面 ===== */
  #frameView{position:fixed;inset:0;display:none;flex-direction:column;background:var(--paper)}
  #frameView.show{display:flex}
  .bar{flex:none;height:clamp(64px,10vmin,110px);display:flex;align-items:center;gap:2.4vmin;padding:0 3vmin;
    background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 .4vmin 1.6vmin rgba(28,43,35,.08);z-index:2}
  .back{display:inline-flex;align-items:center;gap:1vmin;border:0;border-radius:999px;color:#fff;
    background:linear-gradient(120deg,var(--green),var(--green-d));padding:0 3.4vmin;height:72%;
    font:900 clamp(20px,3.2vmin,38px) var(--sans);box-shadow:0 .6vmin 1.6vmin rgba(28,107,72,.3)}
  .back:active{transform:scale(.97)}
  .bar .ttl{font:900 clamp(22px,3.6vmin,44px) var(--serif);letter-spacing:.04em}
  .bar .help{margin-left:auto;font:500 clamp(14px,2.2vmin,26px) var(--sans);color:var(--muted)}
  #frame{flex:1;width:100%;border:0;background:var(--paper)}

  /* ===== 閒置提醒 / 提示 ===== */
  #idle{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(28,43,35,.55);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #idle.show{display:flex}
  #idle .box{background:var(--card);border-radius:3vmin;padding:5vmin 6vmin;text-align:center;max-width:90vw;box-shadow:0 3vmin 8vmin rgba(0,0,0,.35)}
  #idle h3{margin:0 0 1.4vmin;font:900 clamp(28px,5vmin,60px) var(--serif)}
  #idle p{margin:0 0 3vmin;font:500 clamp(18px,3vmin,34px) var(--sans);color:var(--muted)}
  #idle p b{color:#b4402f;font-size:1.4em}
  #idle .row{display:flex;gap:2.4vmin;justify-content:center;flex-wrap:wrap}
  #idle button{border:0;border-radius:999px;padding:2vmin 5vmin;font:900 clamp(20px,3.2vmin,38px) var(--sans)}
  #idle .keep{background:linear-gradient(120deg,var(--green),var(--green-d));color:#fff}
  #idle .quit{background:#fff;color:var(--green-d);border:2px solid var(--green)}
  #toast{position:fixed;left:50%;bottom:6vmin;transform:translateX(-50%);z-index:11;background:#1c2b23;color:#fff;border-radius:999px;
    padding:1.8vmin 4vmin;font:700 clamp(18px,2.8vmin,32px) var(--sans);opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
</style>
</head>
<body>

<!-- 首頁 -->
<main id="home">
  <div class="top">
    <img src="logo.png" alt="線東大眾護理之家">
    <div class="clock"><div class="t" id="clkT">--:--</div><div class="d" id="clkD"></div></div>
  </div>
  <div class="welcome">
    <h1>歡迎來到<br>大眾護理之家</h1>
    <p>請點選您需要的服務</p>
  </div>
  <div class="grid">
    <button class="card" onclick="openApp('visit')">
      <svg class="leaf l" viewBox="0 0 100 120" aria-hidden="true"><g fill="#7fae5f"><path d="M50 118 C48 80 46 50 52 6" stroke="#6a9a4e" stroke-width="2.5" fill="none"/><path d="M50 90 C30 86 16 70 14 54 C34 56 48 70 50 90Z"/><path d="M50 70 C70 66 84 50 86 34 C66 36 52 50 50 70Z"/><path d="M50 46 C34 42 24 30 22 16 C38 18 48 30 50 46Z"/></g></svg><svg class="leaf r" viewBox="0 0 100 120" aria-hidden="true"><g fill="#7fae5f"><path d="M50 118 C48 80 46 50 52 6" stroke="#6a9a4e" stroke-width="2.5" fill="none"/><path d="M50 90 C30 86 16 70 14 54 C34 56 48 70 50 90Z"/><path d="M50 70 C70 66 84 50 86 34 C66 36 52 50 50 70Z"/><path d="M50 46 C34 42 24 30 22 16 C38 18 48 30 50 46Z"/></g></svg><svg class="ico" viewBox="0 0 120 110" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="16" width="82" height="76" rx="12"/><path d="M26 6v18M72 6v18M8 38h82"/><g fill="currentColor" stroke="none" opacity=".75"><rect x="20" y="48" width="12" height="10" rx="2"/><rect x="40" y="48" width="12" height="10" rx="2"/><rect x="60" y="48" width="12" height="10" rx="2"/><rect x="20" y="68" width="12" height="10" rx="2"/><rect x="40" y="68" width="12" height="10" rx="2"/></g><circle cx="88" cy="82" r="22" fill="#fff" fill-opacity=".0"/><path d="M88 68v15l10 6"/></svg>
      <div class="txt"><h2>探視預約</h2><p>預約探視家人的日期與時段</p></div>
      <span class="go">開始預約 →</span>
    </button>
    <button class="card" onclick="openApp('tour')">
      <svg class="leaf l" viewBox="0 0 100 120" aria-hidden="true"><g fill="#7fae5f"><path d="M50 118 C48 80 46 50 52 6" stroke="#6a9a4e" stroke-width="2.5" fill="none"/><path d="M50 90 C30 86 16 70 14 54 C34 56 48 70 50 90Z"/><path d="M50 70 C70 66 84 50 86 34 C66 36 52 50 50 70Z"/><path d="M50 46 C34 42 24 30 22 16 C38 18 48 30 50 46Z"/></g></svg><svg class="leaf r" viewBox="0 0 100 120" aria-hidden="true"><g fill="#7fae5f"><path d="M50 118 C48 80 46 50 52 6" stroke="#6a9a4e" stroke-width="2.5" fill="none"/><path d="M50 90 C30 86 16 70 14 54 C34 56 48 70 50 90Z"/><path d="M50 70 C70 66 84 50 86 34 C66 36 52 50 50 70Z"/><path d="M50 46 C34 42 24 30 22 16 C38 18 48 30 50 46Z"/></g></svg><svg class="ico" viewBox="0 0 120 110" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 54L60 10l52 44"/><path d="M20 48v52h80V48"/><path d="M48 100V72a12 12 0 0124 0v28"/><g fill="currentColor" stroke="none"><rect x="28" y="62" width="10" height="10" rx="2"/><rect x="82" y="62" width="10" height="10" rx="2"/></g></svg>
      <div class="txt"><h2>參訪預約</h2><p>想了解入住？預約參觀機構環境</p></div>
      <span class="go">開始預約 →</span>
    </button>
    <button class="card items" id="cardItems" onclick="openApp('items')">
      <svg class="leaf l" viewBox="0 0 100 120" aria-hidden="true"><g fill="#7fae5f"><path d="M50 118 C48 80 46 50 52 6" stroke="#6a9a4e" stroke-width="2.5" fill="none"/><path d="M50 90 C30 86 16 70 14 54 C34 56 48 70 50 90Z"/><path d="M50 70 C70 66 84 50 86 34 C66 36 52 50 50 70Z"/><path d="M50 46 C34 42 24 30 22 16 C38 18 48 30 50 46Z"/></g></svg><svg class="leaf r" viewBox="0 0 100 120" aria-hidden="true"><g fill="#7fae5f"><path d="M50 118 C48 80 46 50 52 6" stroke="#6a9a4e" stroke-width="2.5" fill="none"/><path d="M50 90 C30 86 16 70 14 54 C34 56 48 70 50 90Z"/><path d="M50 70 C70 66 84 50 86 34 C66 36 52 50 50 70Z"/><path d="M50 46 C34 42 24 30 22 16 C38 18 48 30 50 46Z"/></g></svg><span class="tag" id="itemsTag" style="display:none">即將開放</span><svg class="ico" viewBox="0 0 120 110" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M60 34L16 54v40l44 16 44-16V54z" transform="translate(0 -10)"/><path d="M16 44l44 16 44-16M60 60v50" transform="translate(0 -10)"/><path d="M92 12l8-8M104 30l10-3M80 6l2-8" stroke-width="5"/></svg>
      <div class="txt"><h2>物品登記</h2><p>登記今天帶來給長輩的衣物與用品</p></div>
      <span class="go">開始登記 →</span>
    </button>
  </div>
  <div class="foot">
    <svg class="hs" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 52V44a30 30 0 0160 0v8"/><rect x="12" y="46" width="12" height="22" rx="5"/><rect x="76" y="46" width="12" height="22" rx="5"/><path d="M82 68c0 10-8 14-22 14"/><circle cx="50" cy="48" r="13"/><path d="M24 96c2-18 12-26 26-26s24 8 26 26"/></svg><span class="help">需要協助，請洽櫃檯人員</span>
    <span class="info"><span>服務電話 <b>(04)763-0685</b></span><span class="sep"></span><span>彰化縣彰化市線東路一段一號</span></span>
  </div>
</main>

<!-- 內嵌系統 -->
<section id="frameView">
  <div class="bar">
    <button class="back" onclick="goHome()">← 回首頁</button>
    <span class="ttl" id="ttl"></span>
    <span class="help">需要協助請洽櫃檯人員</span>
  </div>
  <iframe id="frame" title="家屬自助服務"></iframe>
</section>

<!-- 閒置提醒 -->
<div id="idle">
  <div class="box">
    <h3>您還在使用嗎？</h3>
    <p><b id="cnt">15</b> 秒後會自動回到首頁，並清除已填寫的資料</p>
    <div class="row">
      <button class="keep" onclick="keepUsing()">繼續使用</button>
      <button class="quit" onclick="goHome()">回首頁</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ===== 設定 ===== */
var IDLE_MS = 90 * 1000;        // 沒有操作多久後跳出提醒
var WARN_SEC = 15;              // 提醒後幾秒自動回首頁
var APPS = {
  visit: { title:"探視預約", src:"visit/index.html",          zoom:1,      open:true  },
  tour:  { title:"參訪預約", src:"../tour-family/index.html", zoom:1.5,    open:true, fitHero:true },
  items: { title:"物品登記", src:"items/index.html",          zoom:1,      open:true  }   // 後端部署完成後改 true
};

var $ = function(id){ return document.getElementById(id); };
var cur = null, idleTimer = null, warnTimer = null, warnLeft = 0, warning = false;

/* ===== 時鐘 ===== */
function tick(){
  var n = new Date();
  $("clkT").textContent = n.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
  $("clkD").textContent = n.toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
}
tick(); setInterval(tick, 15000);

/* ===== 卡片狀態 ===== */
(function(){
  if(!APPS.items.open){ $("itemsTag").style.display=""; $("cardItems").classList.add("soon"); }
})();

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

/* ===== 開啟 / 回首頁 ===== */
function openApp(key){
  var a = APPS[key]; if(!a) return;
  if(!a.open){ toast("此服務即將開放，請洽櫃檯人員協助"); return; }
  cur = key;
  $("ttl").textContent = a.title;
  $("home").classList.add("hide");
  $("frameView").classList.add("show");
  $("frame").src = a.src;
  armIdle();
}
function goHome(){
  cur = null; warning = false;
  clearTimeout(idleTimer); clearInterval(warnTimer);
  $("idle").classList.remove("show");
  $("frame").src = "about:blank";             // 清掉已填寫的資料
  $("frameView").classList.remove("show");
  $("home").classList.remove("hide");
}

/* ===== 閒置偵測 ===== */
function armIdle(){
  if(!cur || warning) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(showWarn, IDLE_MS);
}
function showWarn(){
  if(!cur) return;
  warning = true; warnLeft = WARN_SEC; $("cnt").textContent = warnLeft;
  $("idle").classList.add("show");
  clearInterval(warnTimer);
  warnTimer = setInterval(function(){
    warnLeft--; $("cnt").textContent = Math.max(warnLeft,0);
    if(warnLeft <= 0){ goHome(); }
  }, 1000);
}
function keepUsing(){
  warning = false; clearInterval(warnTimer);
  $("idle").classList.remove("show");
  armIdle();
}
["touchstart","mousedown","keydown","wheel"].forEach(function(ev){
  document.addEventListener(ev, armIdle, {capture:true, passive:true});
});

/* ===== 調整被嵌入的家屬頁（同網域，可直接改 DOM）===== */
function zoomFor(a){
  if(a.zoom !== "auto") return a.zoom;
  var w = $("frame").clientWidth || window.innerWidth;
  return Math.max(1, Math.min(1.8, w / 1000));
}
function tuneFrame(){
  if(!cur) return;
  var f = $("frame"), d;
  try{ d = f.contentDocument; }catch(e){ return; }
  if(!d || !d.body || d.location.href === "about:blank") return;
  var a = APPS[cur];

  // 拿掉員工用的「← 入口網站」返回列與「工作人員入口」
  d.querySelectorAll('a[href="../index.html"]').forEach(function(x){ if(x.parentElement) x.parentElement.remove(); });
  var st = d.getElementById("staff-override-trigger"); if(st) st.style.display = "none";

  var s = d.createElement("style");
  s.textContent = "html body{padding-top:0 !important} ::-webkit-scrollbar{width:0;height:0} *{-webkit-tap-highlight-color:transparent}";
  d.head.appendChild(s);
  var z = zoomFor(a);
  d.documentElement.style.zoom = z;
  if(a.fitHero){   // zoom 會讓 100svh 的大圖超出畫面，改成剛好一屏
    var h = d.createElement("style");
    h.textContent = ".hero{height:" + Math.floor(f.clientHeight / z) + "px !important;min-height:0 !important}";
    d.head.appendChild(h);
  }

  // 不讓家屬點到外部連結或離開這個機台畫面
  d.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("a[href]") : null;
    if(!el) return;
    var h = el.getAttribute("href") || "";
    if(h.charAt(0) === "#") return;
    e.preventDefault();
  }, true);
  d.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  ["touchstart","mousedown","keydown","wheel","scroll"].forEach(function(ev){
    d.addEventListener(ev, armIdle, {capture:true, passive:true});
  });
}
$("frame").addEventListener("load", tuneFrame);

/* 內嵌頁（物品登記）完成後通知首頁 */
window.addEventListener("message", function(e){
  if(e.origin !== location.origin || !e.data) return;
  if(e.data.kiosk === "home") goHome();
});
</script>
</body>
</html>
