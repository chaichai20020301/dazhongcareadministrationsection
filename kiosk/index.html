<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>線東大眾護理之家 · 家屬自助服務</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2f9e6b; --green-d:#1c6b48; --leaf:#6aae3c;
    --ink:#1c2b23; --muted:#5d6d63; --paper:#f2efe6; --card:#fffdf8; --line:#e6ded0;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --serif:"Noto Serif TC",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer}

  /* ===== 首頁 ===== */
  #home{position:fixed;inset:0;display:flex;flex-direction:column;padding:3.2vmin 4vmin 2.6vmin;
    background:radial-gradient(120% 90% at 85% -10%,#e3efd5 0,rgba(227,239,213,0) 55%),var(--paper)}
  #home.hide{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:2vmin}
  .top img{height:clamp(46px,8vmin,96px);width:auto;display:block}
  .clock{text-align:right;line-height:1.25}
  .clock .t{font:700 clamp(26px,4.4vmin,52px)/1 var(--sans);color:var(--green-d);letter-spacing:.02em}
  .clock .d{font:500 clamp(15px,2.3vmin,26px) var(--sans);color:var(--muted);margin-top:.5vmin}
  .welcome{margin:3vmin 0 3.2vmin}
  .welcome h1{margin:0;font:900 clamp(34px,6vmin,76px)/1.15 var(--serif);letter-spacing:.04em}
  .welcome p{margin:1.2vmin 0 0;font:500 clamp(18px,2.9vmin,34px) var(--sans);color:var(--muted)}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:3vmin}
  .card{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;
    border:0;border-radius:3vmin;padding:3.4vmin;color:#fff;overflow:hidden;
    background:linear-gradient(145deg,var(--a1),var(--a2));
    box-shadow:0 1.2vmin 3vmin rgba(28,43,35,.18);transition:transform .12s ease,box-shadow .12s ease}
  .card:active{transform:scale(.975);box-shadow:0 .5vmin 1.4vmin rgba(28,43,35,.2)}
  .card::after{content:"";position:absolute;right:-8vmin;top:-8vmin;width:30vmin;height:30vmin;border-radius:50%;background:rgba(255,255,255,.12)}
  .card h2{margin:0;font:900 clamp(30px,5.2vmin,64px)/1.1 var(--sans);letter-spacing:.04em}
  .card p{margin:1.2vmin 0 0;font:500 clamp(17px,2.7vmin,32px)/1.45 var(--sans);opacity:.95}
  .card .go{display:inline-flex;align-items:center;gap:1vmin;background:#fff;color:var(--green-d);border-radius:999px;
    padding:1.6vmin 3.2vmin;font:900 clamp(18px,2.9vmin,34px) var(--sans)}
  .card.soon{filter:saturate(.55)}
  .card .tag{position:absolute;right:2.4vmin;top:2.4vmin;z-index:1;background:#fff;color:#8a5a00;border-radius:999px;
    padding:.8vmin 2vmin;font:900 clamp(15px,2.3vmin,26px) var(--sans)}
  .foot{margin-top:2.4vmin;display:flex;justify-content:space-between;align-items:center;gap:2vmin;
    font:500 clamp(15px,2.3vmin,26px) var(--sans);color:var(--muted)}
  .foot b{color:var(--green-d);font-weight:700}
  @media (max-aspect-ratio:1/1){ .grid{grid-template-columns:1fr;grid-auto-rows:1fr} .card{flex-direction:row;align-items:center;gap:3vmin}
    .card .txt{flex:1} .card .go{align-self:center} }

  /* ===== 內嵌系統畫面 ===== */
  #frameView{position:fixed;inset:0;display:none;flex-direction:column;background:var(--paper)}
  #frameView.show{display:flex}
  .bar{flex:none;height:clamp(64px,10vmin,110px);display:flex;align-items:center;gap:2.4vmin;padding:0 3vmin;
    background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 .4vmin 1.6vmin rgba(28,43,35,.08);z-index:2}
  .back{display:inline-flex;align-items:center;gap:1vmin;border:0;border-radius:999px;color:#fff;
    background:linear-gradient(120deg,var(--green),var(--green-d));padding:0 3.4vmin;height:72%;
    font:900 clamp(20px,3.2vmin,38px) var(--sans);box-shadow:0 .6vmin 1.6vmin rgba(28,107,72,.3)}
  .back:active{transform:scale(.97)}
  .bar .ttl{font:900 clamp(22px,3.6vmin,44px) var(--serif);letter-spacing:.04em}
  .bar .help{margin-left:auto;font:500 clamp(14px,2.2vmin,26px) var(--sans);color:var(--muted)}
  #frame{flex:1;width:100%;border:0;background:var(--paper)}

  /* ===== 閒置提醒 / 提示 ===== */
  #idle{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(28,43,35,.55);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #idle.show{display:flex}
  #idle .box{background:var(--card);border-radius:3vmin;padding:5vmin 6vmin;text-align:center;max-width:90vw;box-shadow:0 3vmin 8vmin rgba(0,0,0,.35)}
  #idle h3{margin:0 0 1.4vmin;font:900 clamp(28px,5vmin,60px) var(--serif)}
  #idle p{margin:0 0 3vmin;font:500 clamp(18px,3vmin,34px) var(--sans);color:var(--muted)}
  #idle p b{color:#b4402f;font-size:1.4em}
  #idle .row{display:flex;gap:2.4vmin;justify-content:center;flex-wrap:wrap}
  #idle button{border:0;border-radius:999px;padding:2vmin 5vmin;font:900 clamp(20px,3.2vmin,38px) var(--sans)}
  #idle .keep{background:linear-gradient(120deg,var(--green),var(--green-d));color:#fff}
  #idle .quit{background:#fff;color:var(--green-d);border:2px solid var(--green)}
  #toast{position:fixed;left:50%;bottom:6vmin;transform:translateX(-50%);z-index:11;background:#1c2b23;color:#fff;border-radius:999px;
    padding:1.8vmin 4vmin;font:700 clamp(18px,2.8vmin,32px) var(--sans);opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
</style>
</head>
<body>

<!-- 首頁 -->
<main id="home">
  <div class="top">
    <img src="logo.png" alt="線東大眾護理之家">
    <div class="clock"><div class="t" id="clkT">--:--</div><div class="d" id="clkD"></div></div>
  </div>
  <div class="welcome">
    <h1>歡迎來到線東大眾護理之家</h1>
    <p>請點選您需要的服務，需要協助時請洽櫃檯人員</p>
  </div>
  <div class="grid">
    <button class="card" style="--a1:#2f9e6b;--a2:#1c6b48" onclick="openApp('visit')">
      <div class="txt"><h2>探視預約</h2><p>預約探視家人的日期與時段</p></div>
      <span class="go">開始預約 →</span>
    </button>
    <button class="card" style="--a1:#6aae3c;--a2:#2f8f78" onclick="openApp('tour')">
      <div class="txt"><h2>參訪預約</h2><p>想了解入住？預約參觀機構環境</p></div>
      <span class="go">開始預約 →</span>
    </button>
    <button class="card" id="cardItems" style="--a1:#c8923a;--a2:#a8702a" onclick="openApp('items')">
      <span class="tag" id="itemsTag" style="display:none">即將開放</span>
      <div class="txt"><h2>物品登記</h2><p>登記今天帶來給長輩的衣物與用品</p></div>
      <span class="go">開始登記 →</span>
    </button>
  </div>
  <div class="foot">
    <span>服務電話 <b>(04)763-0685</b></span>
    <span>彰化縣彰化市線東路一段一號</span>
  </div>
</main>

<!-- 內嵌系統 -->
<section id="frameView">
  <div class="bar">
    <button class="back" onclick="goHome()">← 回首頁</button>
    <span class="ttl" id="ttl"></span>
    <span class="help">需要協助請洽櫃檯人員</span>
  </div>
  <iframe id="frame" title="家屬自助服務"></iframe>
</section>

<!-- 閒置提醒 -->
<div id="idle">
  <div class="box">
    <h3>您還在使用嗎？</h3>
    <p><b id="cnt">15</b> 秒後會自動回到首頁，並清除已填寫的資料</p>
    <div class="row">
      <button class="keep" onclick="keepUsing()">繼續使用</button>
      <button class="quit" onclick="goHome()">回首頁</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ===== 設定 ===== */
var IDLE_MS = 90 * 1000;        // 沒有操作多久後跳出提醒
var WARN_SEC = 15;              // 提醒後幾秒自動回首頁
var APPS = {
  visit: { title:"探視預約", src:"visit/index.html",          zoom:1,      open:true  },
  tour:  { title:"參訪預約", src:"../tour-family/index.html", zoom:1.5,    open:true, fitHero:true },
  items: { title:"物品登記", src:"items/index.html",          zoom:1,      open:true  }   // 後端部署完成後改 true
};

var $ = function(id){ return document.getElementById(id); };
var cur = null, idleTimer = null, warnTimer = null, warnLeft = 0, warning = false;

/* ===== 時鐘 ===== */
function tick(){
  var n = new Date();
  $("clkT").textContent = n.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
  $("clkD").textContent = n.toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
}
tick(); setInterval(tick, 15000);

/* ===== 卡片狀態 ===== */
(function(){
  if(!APPS.items.open){ $("itemsTag").style.display=""; $("cardItems").classList.add("soon"); }
})();

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

/* ===== 開啟 / 回首頁 ===== */
function openApp(key){
  var a = APPS[key]; if(!a) return;
  if(!a.open){ toast("此服務即將開放，請洽櫃檯人員協助"); return; }
  cur = key;
  $("ttl").textContent = a.title;
  $("home").classList.add("hide");
  $("frameView").classList.add("show");
  $("frame").src = a.src;
  armIdle();
}
function goHome(){
  cur = null; warning = false;
  clearTimeout(idleTimer); clearInterval(warnTimer);
  $("idle").classList.remove("show");
  $("frame").src = "about:blank";             // 清掉已填寫的資料
  $("frameView").classList.remove("show");
  $("home").classList.remove("hide");
}

/* ===== 閒置偵測 ===== */
function armIdle(){
  if(!cur || warning) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(showWarn, IDLE_MS);
}
function showWarn(){
  if(!cur) return;
  warning = true; warnLeft = WARN_SEC; $("cnt").textContent = warnLeft;
  $("idle").classList.add("show");
  clearInterval(warnTimer);
  warnTimer = setInterval(function(){
    warnLeft--; $("cnt").textContent = Math.max(warnLeft,0);
    if(warnLeft <= 0){ goHome(); }
  }, 1000);
}
function keepUsing(){
  warning = false; clearInterval(warnTimer);
  $("idle").classList.remove("show");
  armIdle();
}
["touchstart","mousedown","keydown","wheel"].forEach(function(ev){
  document.addEventListener(ev, armIdle, {capture:true, passive:true});
});

/* ===== 調整被嵌入的家屬頁（同網域，可直接改 DOM）===== */
function zoomFor(a){
  if(a.zoom !== "auto") return a.zoom;
  var w = $("frame").clientWidth || window.innerWidth;
  return Math.max(1, Math.min(1.8, w / 1000));
}
function tuneFrame(){
  if(!cur) return;
  var f = $("frame"), d;
  try{ d = f.contentDocument; }catch(e){ return; }
  if(!d || !d.body || d.location.href === "about:blank") return;
  var a = APPS[cur];

  // 拿掉員工用的「← 入口網站」返回列與「工作人員入口」
  d.querySelectorAll('a[href="../index.html"]').forEach(function(x){ if(x.parentElement) x.parentElement.remove(); });
  var st = d.getElementById("staff-override-trigger"); if(st) st.style.display = "none";

  var s = d.createElement("style");
  s.textContent = "html body{padding-top:0 !important} ::-webkit-scrollbar{width:0;height:0} *{-webkit-tap-highlight-color:transparent}";
  d.head.appendChild(s);
  var z = zoomFor(a);
  d.documentElement.style.zoom = z;
  if(a.fitHero){   // zoom 會讓 100svh 的大圖超出畫面，改成剛好一屏
    var h = d.createElement("style");
    h.textContent = ".hero{height:" + Math.floor(f.clientHeight / z) + "px !important;min-height:0 !important}";
    d.head.appendChild(h);
  }

  // 不讓家屬點到外部連結或離開這個機台畫面
  d.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("a[href]") : null;
    if(!el) return;
    var h = el.getAttribute("href") || "";
    if(h.charAt(0) === "#") return;
    e.preventDefault();
  }, true);
  d.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  ["touchstart","mousedown","keydown","wheel","scroll"].forEach(function(ev){
    d.addEventListener(ev, armIdle, {capture:true, passive:true});
  });
}
$("frame").addEventListener("load", tuneFrame);

/* 內嵌頁（物品登記）完成後通知首頁 */
window.addEventListener("message", function(e){
  if(e.origin !== location.origin || !e.data) return;
  if(e.data.kiosk === "home") goHome();
});
</script>
</body>
</html>
