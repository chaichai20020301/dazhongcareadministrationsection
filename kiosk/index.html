<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>線東大眾護理之家 · 家屬自助服務</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2f9e6b; --green-d:#1c6b48; --leaf:#6aae3c;
    --ink:#1c2b23; --muted:#5d6d63; --paper:#f2efe6; --card:#fffdf8; --line:#e6ded0;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --serif:"Noto Serif TC",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer}

  /* ===== 首頁（自動適應螢幕比例；素材為分離的透明圖）===== */
  #home{--u:1vmin;position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(var(--u)*2.6) calc(var(--u)*3.6) 0;gap:calc(var(--u)*2.2);background:#faf8ef;overflow:hidden}
  #home.hide{display:none}
  #home>*{position:relative;z-index:1}
  .im{position:absolute;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%;display:block}
  .corner{position:absolute !important;z-index:0 !important}
  .corner.bl{left:0;bottom:0;width:calc(var(--u)*12);aspect-ratio:640/639;background-image:url(img/n-c-bl.webp)}
  .corner.br{right:0;bottom:0;width:calc(var(--u)*12);aspect-ratio:622/640;background-image:url(img/n-c-br.webp)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2);flex:none}
  .top img{height:clamp(46px,calc(var(--u)*8.4),100px);width:auto;display:block}
  .clock{text-align:right;line-height:1.2}
  .clock .t{font:900 clamp(30px,calc(var(--u)*6.4),76px)/1 var(--sans);color:#092f25;letter-spacing:.02em}
  .clock .d{font:500 clamp(14px,calc(var(--u)*2.5),30px) var(--sans);color:#4d695a;margin-top:calc(var(--u)*.7)}
  .welcome{flex:none;overflow:hidden;border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.6) calc(var(--u)*5);min-height:calc(var(--u)*19);display:flex;flex-direction:column;justify-content:center;
    background:#f5f6e6;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2) rgba(60,80,50,.12);position:relative}
  .welcome .wl{left:calc(var(--u)*-1);top:calc(var(--u)*-1);height:90%;aspect-ratio:640/601;background-image:url(img/n-c-tl.webp);opacity:.9}
  .welcome .wr{right:calc(var(--u)*-1);top:calc(var(--u)*-1);height:90%;aspect-ratio:518/640;background-image:url(img/n-c-tr.webp);opacity:.9}
  .welcome .wb{right:calc(var(--u)*4);bottom:0;height:110%;aspect-ratio:1100/533;background-image:url(img/n-bld.webp)}
  .welcome>*{position:relative}.welcome>.im{position:absolute}
  .welcome h1{margin:0;font:900 clamp(30px,calc(var(--u)*5.4),72px)/1.25 var(--serif);letter-spacing:.04em;color:#092f25}
  .welcome h1 br{display:none}
  .welcome p{margin:calc(var(--u)*1) 0 0;font:500 clamp(18px,calc(var(--u)*3),38px) var(--sans);color:#4d695a}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--u)*2.6)}
  .card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);text-align:center;
    border:2px solid #b5cda2;border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.4) calc(var(--u)*2);color:#092f25;overflow:hidden;
    background:#eaf3dc;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.2) rgba(60,90,60,.14);transition:transform .12s ease}
  .card:active{transform:scale(.975)}
  .card .lv.l{left:0;top:8%;height:70%;aspect-ratio:232/640;background-image:url(img/n-g-l.webp);opacity:.95}
  .card .lv.r{right:0;top:0;height:30%;aspect-ratio:640/525;background-image:url(img/n-g-r.webp);opacity:.9}
  .card.items{background:#fff0d7;border-color:#edc58d}
  .card.items .lv.l{background-image:url(img/n-o-l.webp);aspect-ratio:249/640}
  .card.items .lv.r{background-image:url(img/n-o-r.webp);aspect-ratio:640/629}
  .card .ico{position:relative;height:clamp(56px,calc(var(--u)*14),200px);width:auto;flex:none}
  .card .txt{position:relative}
  .card h2{margin:0;font:900 clamp(30px,calc(var(--u)*5.8),72px)/1.25 var(--sans);letter-spacing:.04em}
  .card p{margin:calc(var(--u)*1) 0 0;font:500 clamp(16px,calc(var(--u)*2.6),34px)/1.5 var(--sans);color:#4d695a}
  .card .go{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;color:#fff;background:#14563f;
    padding:calc(var(--u)*1.7) calc(var(--u)*3);width:90%;font:800 clamp(20px,calc(var(--u)*3.3),42px)/1.3 var(--sans);box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.2) rgba(20,86,63,.3)}
  .card.items .go{background:#b65b16;box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.2) rgba(182,91,22,.3)}
  .card.soon{filter:saturate(.55)}
  .foot{flex:none;display:flex;align-items:center;gap:calc(var(--u)*2.4);padding:calc(var(--u)*1.6) 0 calc(var(--u)*2.2);border-top:2px solid #d3d8c8;
    font:500 clamp(14px,calc(var(--u)*2.3),28px) var(--sans);color:#4d695a}
  .foot .hs{height:clamp(44px,calc(var(--u)*8),90px);width:auto;flex:none}
  .foot .help{font:700 clamp(20px,calc(var(--u)*3.8),48px) var(--sans);color:#092f25;letter-spacing:.03em}
  .foot .info{margin-left:auto;display:flex;align-items:center;gap:calc(var(--u)*2);text-align:right}
  .foot .sep{width:2px;height:calc(var(--u)*3.4);background:#aab1a0;flex:none}
  .foot b{color:#14563f;font-weight:700}
  @media (max-aspect-ratio:1/1){
    #home{--u:min(1vmin,.563vh)}
    .welcome h1{font-size:calc(var(--u)*7)}.welcome h1 br{display:inline}
    .welcome p{font-size:calc(var(--u)*3.4)}
    .welcome{min-height:calc(var(--u)*27)}
    .welcome .wb{height:80%;right:calc(var(--u)*2)}
    .grid{grid-template-columns:1fr;grid-auto-rows:1fr}
    .card{display:grid;grid-template-columns:34% 1fr;grid-template-rows:auto auto;column-gap:calc(var(--u)*2);row-gap:calc(var(--u)*1.2);align-content:center;text-align:left;padding:calc(var(--u)*2.4) calc(var(--u)*3)}
    .card .ico{grid-row:1/3;justify-self:center;height:auto;width:clamp(80px,calc(var(--u)*24),240px)}
    .card .txt{grid-column:2;grid-row:1;align-self:end}
    .card .go{grid-column:2;grid-row:2;align-self:start;width:100%;font-size:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*3)}
    .card h2{font-size:calc(var(--u)*7.2)}.card p{font-size:calc(var(--u)*3)}
    .foot{flex-wrap:wrap}.foot .info{margin-left:0;flex-basis:100%;margin-top:calc(var(--u)*-1);justify-content:flex-start;font-size:calc(var(--u)*2.6);gap:calc(var(--u)*3);text-align:left}
    .foot .info .sep{display:none}.foot .help{flex:1;font-size:calc(var(--u)*4.4)}
  }

  /* ===== 閒置輪播（沒人操作時自動播放機構介紹／營養保健品；點一下螢幕回首頁）===== */
  #attract{--u:1vmin;position:fixed;inset:0;z-index:9;display:none;flex-direction:column;background:#faf8ef;overflow:hidden;cursor:pointer}
  #attract.show{display:flex;animation:atIn .6s ease}
  @keyframes atIn{from{opacity:0}to{opacity:1}}
  #attract .top{padding:calc(var(--u)*2.6) calc(var(--u)*3.6) 0;position:relative;z-index:2}
  #attract .stage{position:relative;flex:1;min-height:0}
  .slide{position:absolute;inset:0;display:flex;align-items:center;gap:calc(var(--u)*3);padding:0 calc(var(--u)*6);opacity:0;transition:opacity 1.1s ease;pointer-events:none}
  .slide.on{opacity:1}
  .slide .art{flex:1.15;min-width:0;height:88%;display:flex;align-items:center;justify-content:center}
  .slide .art img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .slide.on .art img{animation:drift 9s ease-in-out both}
  @keyframes drift{from{transform:scale(1)}to{transform:scale(1.05)}}
  .slide .words{flex:1;min-width:0}
  .slide .tag{display:inline-block;padding:calc(var(--u)*.7) calc(var(--u)*2.4);border-radius:999px;background:#14563f;color:#fff;font:800 clamp(16px,calc(var(--u)*2.6),32px) var(--sans);letter-spacing:.08em}
  .slide.promo .tag{background:#b65b16}
  .slide h2{margin:calc(var(--u)*1.8) 0 calc(var(--u)*1.6);font:900 clamp(34px,calc(var(--u)*6.6),84px)/1.25 var(--serif);letter-spacing:.04em;color:#092f25}
  .slide p{margin:0;font:500 clamp(20px,calc(var(--u)*3.3),42px)/1.65 var(--sans);color:#3d5a4a}
  .slide ul{margin:0;padding:0;list-style:none;font:700 clamp(22px,calc(var(--u)*3.6),46px)/1.5 var(--sans);color:#17261d}
  .slide li{position:relative;padding-left:calc(var(--u)*4)}
  .slide li+li{margin-top:calc(var(--u)*1)}
  .slide li::before{content:"";position:absolute;left:0;top:.5em;width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);border-radius:50% 0 50% 0;background:#6aae3c}
  .slide.promo li::before{background:#e08a3a}
  .slide .art.photo img{border-radius:calc(var(--u)*3);box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.4) rgba(60,80,50,.2);background:#fff}
  #attract .bottom{flex:none;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6);padding:0 0 calc(var(--u)*3.4);position:relative;z-index:2}
  .touchme{display:inline-flex;align-items:center;padding:calc(var(--u)*1.8) calc(var(--u)*6);border-radius:999px;background:#14563f;color:#fff;
    font:900 clamp(22px,calc(var(--u)*4),52px) var(--sans);letter-spacing:.06em;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.6) rgba(20,86,63,.35);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .dots{display:flex;gap:calc(var(--u)*1.2)}
  .dots i{width:calc(var(--u)*1.4);height:calc(var(--u)*1.4);border-radius:999px;background:#c9d4bd;transition:all .4s}
  .dots i.on{width:calc(var(--u)*4.4);background:#14563f}
  @media (max-aspect-ratio:1/1){
    #attract{--u:min(1vmin,.563vh)}
    .slide{flex-direction:column;justify-content:center;gap:calc(var(--u)*2);padding:0 calc(var(--u)*5)}
    .slide .art{flex:none;height:44%;width:100%}
    .slide .words{flex:none;text-align:center}
    .slide ul{display:inline-block;text-align:left}
    .slide h2{font-size:calc(var(--u)*8)}.slide p{font-size:calc(var(--u)*3.8)}.slide ul{font-size:calc(var(--u)*4.2)}
    .slide .tag{font-size:calc(var(--u)*3)}
    .touchme{font-size:calc(var(--u)*4.6)}
  }

  /* 整張圖片（滿版，例如評鑑證明文件）＋花邊 */
  #attract.isfull .top{opacity:0;pointer-events:none}
  #attract .top{transition:opacity .6s}
  .slide.full{display:block;padding:0}
  .slide.full .shot{position:fixed;inset:0;z-index:1;background:#faf8ef;display:flex;align-items:center;justify-content:center}
  .slide.full .shot img{width:100%;height:100%;object-fit:contain;display:block}
  .slide.full.fit-cover .shot img{object-fit:cover}
  .slide.full.fr .shot{inset:calc(var(--u)*3.4)}
  .slide.full .frm{position:fixed;inset:0;z-index:1;pointer-events:none;--fc:#6aae3c;--hue:0deg}
  .slide.full.fr-orange .frm{--fc:#e0a35a;--hue:-70deg}
  .slide.full.fr-teal .frm{--fc:#5ba39a;--hue:62deg}
  .slide.full .frm::before{content:"";position:absolute;inset:calc(var(--u)*1.2);border:calc(var(--u)*.5) solid var(--fc);border-radius:calc(var(--u)*3);box-shadow:inset 0 0 0 calc(var(--u)*.4) rgba(255,255,255,.9),0 0 calc(var(--u)*1.2) rgba(60,80,50,.18)}
  .slide.full .frm .c{position:absolute;width:calc(var(--u)*17);aspect-ratio:1;background-size:contain;background-repeat:no-repeat;filter:hue-rotate(var(--hue))}
  .frm .tl{left:0;top:0;background-image:url(img/n-c-tl.webp);background-position:left top}
  .frm .tr{right:0;top:0;background-image:url(img/n-c-tr.webp);background-position:right top}
  .frm .bl{left:0;bottom:0;background-image:url(img/n-c-bl.webp);background-position:left bottom}
  .frm .br{right:0;bottom:0;background-image:url(img/n-c-br.webp);background-position:right bottom}
  #attract.isfull .bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(var(--u)*5);pointer-events:none;z-index:3}
  #attract.isfull .dots{display:none}
  #attract.isfull .touchme{font-size:calc(var(--u)*3);padding:calc(var(--u)*1.2) calc(var(--u)*4);animation:none;opacity:.92}
  #attract.isfull.hint .touchme{animation:hintOut 4s ease forwards}
  @keyframes hintOut{0%,70%{opacity:.92}100%{opacity:0}}

  /* ===== 內嵌系統畫面 ===== */
  #frameView{position:fixed;inset:0;display:none;flex-direction:column;background:var(--paper)}
  #frameView.show{display:flex}
  .bar{flex:none;height:clamp(64px,10vmin,110px);display:flex;align-items:center;gap:2.4vmin;padding:0 3vmin;
    background:#fcf9ef;border-bottom:.2vmin solid #d3dcc7;z-index:2}
  .back{display:inline-flex;align-items:center;gap:1vmin;border:.3vmin solid #14583a;border-radius:999px;color:#17261d;
    background:rgba(255,255,255,.8);padding:0 3.4vmin;height:72%;font:900 clamp(20px,3.2vmin,38px) var(--sans)}
  .back:active{background:#e8f3dc}
  .bar .ttl{font:900 clamp(22px,3.6vmin,44px) var(--sans);letter-spacing:.04em;color:#17261d}
  .bar .help{margin-left:auto;font:700 clamp(14px,2.2vmin,26px) var(--sans);color:#17261d}
  #frameView.nobar .bar{display:none}
  #frame{flex:1;width:100%;border:0;background:var(--paper)}

  /* ===== 閒置提醒 / 提示 ===== */
  #idle{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(28,43,35,.55);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #idle.show{display:flex}
  #idle .box{background:var(--card);border-radius:3vmin;padding:5vmin 6vmin;text-align:center;max-width:90vw;box-shadow:0 3vmin 8vmin rgba(0,0,0,.35)}
  #idle h3{margin:0 0 1.4vmin;font:900 clamp(28px,5vmin,60px) var(--serif)}
  #idle p{margin:0 0 3vmin;font:500 clamp(18px,3vmin,34px) var(--sans);color:var(--muted)}
  #idle p b{color:#b4402f;font-size:1.4em}
  #idle .row{display:flex;gap:2.4vmin;justify-content:center;flex-wrap:wrap}
  #idle button{border:0;border-radius:999px;padding:2vmin 5vmin;font:900 clamp(20px,3.2vmin,38px) var(--sans)}
  #idle .keep{background:linear-gradient(120deg,var(--green),var(--green-d));color:#fff}
  #idle .quit{background:#fff;color:var(--green-d);border:2px solid var(--green)}
  #toast{position:fixed;left:50%;bottom:6vmin;transform:translateX(-50%);z-index:11;background:#1c2b23;color:#fff;border-radius:999px;
    padding:1.8vmin 4vmin;font:700 clamp(18px,2.8vmin,32px) var(--sans);opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
</style>
</head>
<body>

<!-- 首頁 -->
<main id="home">
  <i class="im corner bl"></i><i class="im corner br"></i>
  <div class="top">
    <img src="logo.png" alt="線東大眾護理之家">
    <div class="clock"><div class="t" data-clk="t">--:--</div><div class="d" data-clk="d"></div></div>
  </div>
  <div class="welcome">
    <i class="im wl"></i><i class="im wr"></i><i class="im wb"></i>
    <h1>歡迎來到<br>大眾護理之家</h1>
    <p>請點選您需要的服務</p>
  </div>
  <div class="grid">
    <button class="card" onclick="openApp('visit')">
      <i class="im lv l"></i><i class="im lv r"></i><img class="ico" src="img/n-cal.webp" alt="">
      <div class="txt"><h2>探視預約</h2><p>預約探視家人的日期與時段</p></div>
      <span class="go">開始預約 →</span>
    </button>
    <button class="card items" id="cardItems" onclick="openApp('items')">
      <i class="im lv l"></i><i class="im lv r"></i><img class="ico" src="img/n-box.webp" alt="">
      <div class="txt"><h2>物品登記</h2><p>登記今天帶來給長輩的衣物與用品</p></div>
      <span class="go">開始登記 →</span>
    </button>
  </div>
  <div class="foot">
    <img class="hs" src="img/n-hs.webp" alt=""><span class="help">需要協助，請洽櫃檯人員</span>
    <span class="info"><span>服務電話 <b>(04)763-0685</b></span><span class="sep"></span><span>彰化縣彰化市線東路一段一號</span></span>
  </div>
</main>

<!-- 內嵌系統 -->
<section id="frameView">
  <div class="bar">
    <button class="back" onclick="goHome()">← 回首頁</button>
    <span class="ttl" id="ttl"></span>
    <span class="help">需要協助請洽櫃檯人員</span>
  </div>
  <iframe id="frame" title="家屬自助服務"></iframe>
</section>

<!-- 閒置輪播 -->
<div id="attract" onclick="endAttract()">
  <div class="top">
    <img src="logo.png" alt="線東大眾護理之家" style="height:clamp(46px,calc(var(--u)*8.4),100px);width:auto">
    <div class="clock"><div class="t" data-clk="t">--:--</div><div class="d" data-clk="d"></div></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bottom"><div class="dots" id="dots"></div><span class="touchme">請點一下螢幕開始使用</span></div>
</div>

<!-- 閒置提醒 -->
<div id="idle">
  <div class="box">
    <h3>您還在使用嗎？</h3>
    <p><b id="cnt">15</b> 秒後會自動回到首頁，並清除已填寫的資料</p>
    <div class="row">
      <button class="keep" onclick="keepUsing()">繼續使用</button>
      <button class="quit" onclick="goHome()">回首頁</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ===== 設定 ===== */
var IDLE_MS = 90 * 1000;        // 沒有操作多久後跳出提醒
var WARN_SEC = 15;              // 提醒後幾秒自動回首頁
var ATTRACT_MS = 60 * 1000;     // 首頁沒人操作多久後開始自動輪播
var SLIDE_MS = 9 * 1000;        // 每一張輪播停留幾秒
/* 輪播內容平常由主管在入口網站的「機台輪播管理」維護，機台開著時會自己去讀（每 3 分鐘更新一次）。
   下面這份是「備援」：後端連不上、而且機台也沒讀過內容時才會播。結構：type "intro"＝機構介紹（綠色標籤）、"promo"＝營養保健品（橘色標籤）；
   words 文字段落、list 條列（二選一）；title／words 裡的 \n 是換行；photo:true 表示是照片（加圓角陰影）。 */
var SLIDES_API = "https://script.google.com/macros/s/AKfycby79wULdv1ZN5kzcHNXyWuHv_EsF0dGDTpzuS5ry638Qy9L_CHG6iLO5Povy9a4IQx_nQ/exec";            // 機台輪播後端（Apps Script /exec 網址）；部署後填入。空白＝只用下面的備援內容
var SLIDES = [
  { type:"intro", tag:"線東大眾護理之家", title:"讓我們一起開心、\n健康的慢慢變老", words:"把熱忱、關愛、專業和耐心，當作撐起每個家庭裡長輩生活的支點。", art:"../assets/tour/hero.webp" },
  { type:"intro", tag:"專業照護", title:"專業照護，細心陪伴", list:["日常生活看顧　專人協助洗澡","護理師每天量測生命徵象","社工服務與長照諮詢","醫師、藥師、營養師定期巡視","文康活動，延緩身心老化"], art:"../assets/tour/sec-services.webp" },
  { type:"intro", tag:"適合對象", title:"適合哪些長輩", list:["日常生活需他人協助者","慢性病需護理照顧者","急性醫療出院後仍需照護者","中風、失智、行動不便者","需洗腎、化療、傷口照護者","安寧照護"], art:"../assets/tour/sec-who.webp" },
  { type:"intro", tag:"生活日常", title:"像家一樣的每一天", words:"獨立私人衣櫃、電動升降床、全熱交換器新鮮空氣，並定期舉辦多元活動與社區互動。", art:"../assets/tour/sec-daily.webp" },
  { type:"intro", tag:"歡迎參觀", title:"想了解入住？\n歡迎來電或洽櫃檯", words:"服務電話　(04)763-0685\n彰化縣彰化市線東路一段一號", art:"../assets/tour/sec-cta.webp" },
];
var APPS = {
  visit: { title:"探視預約", src:"visit/index.html",          zoom:1,      open:true, bar:false },
  items: { title:"物品登記", src:"items/index.html",          zoom:1,      open:true, bar:false }   // 後端部署完成後改 true
};

var $ = function(id){ return document.getElementById(id); };
var cur = null, idleTimer = null, warnTimer = null, warnLeft = 0, warning = false;

/* ===== 時鐘 ===== */
function tick(){
  var n = new Date();
  var t = n.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
  var d = n.toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
  document.querySelectorAll('[data-clk="t"]').forEach(function(e){ e.textContent = t; });
  document.querySelectorAll('[data-clk="d"]').forEach(function(e){ e.textContent = d; });
}
tick(); setInterval(tick, 15000);

/* ===== 卡片狀態 ===== */
(function(){
  if(!APPS.items.open){ $("cardItems").classList.add("soon"); }
})();

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

/* ===== 開啟 / 回首頁 ===== */
function openApp(key){
  var a = APPS[key]; if(!a) return;
  if(!a.open){ toast("此服務即將開放，請洽櫃檯人員協助"); return; }
  cur = key; clearTimeout(atTimer);
  $("ttl").textContent = a.title;
  $("home").classList.add("hide");
  $("frameView").classList.add("show");
  $("frameView").classList.toggle("nobar", a.bar === false);   // 頁面自帶頂列時隱藏外層返回列
  $("frame").src = a.src;
  armIdle();
}
function goHome(){
  cur = null; warning = false;
  clearTimeout(idleTimer); clearInterval(warnTimer);
  $("idle").classList.remove("show");
  $("frame").src = "about:blank";             // 清掉已填寫的資料
  $("frameView").classList.remove("show");
  $("home").classList.remove("hide");
  armAttract();
}

/* ===== 閒置偵測 ===== */
function armIdle(){
  if(!cur || warning) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(showWarn, IDLE_MS);
}
function showWarn(){
  if(!cur) return;
  warning = true; warnLeft = WARN_SEC; $("cnt").textContent = warnLeft;
  $("idle").classList.add("show");
  clearInterval(warnTimer);
  warnTimer = setInterval(function(){
    warnLeft--; $("cnt").textContent = Math.max(warnLeft,0);
    if(warnLeft <= 0){ goHome(); }
  }, 1000);
}
function keepUsing(){
  warning = false; clearInterval(warnTimer);
  $("idle").classList.remove("show");
  armIdle();
}
["touchstart","mousedown","keydown","wheel"].forEach(function(ev){
  document.addEventListener(ev, armIdle, {capture:true, passive:true});
});

/* ===== 閒置輪播 ===== */
var atTimer = null, slideTimer = null, slideIdx = 0, slidesBuilt = false;
function escH(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }).replace(/\n/g,"<br>"); }
var slideData = SLIDES;           // 目前要播的內容（先用備援，讀到後端的就換掉）
function applySlides(d){
  if(!d || !d.slides || !d.slides.length) return;
  slideData = d.slides;
  if(d.settings){
    if(d.settings.attractSec >= 15) ATTRACT_MS = d.settings.attractSec * 1000;
    if(d.settings.slideSec >= 4) SLIDE_MS = d.settings.slideSec * 1000;
  }
  if(!$("attract").classList.contains("show")){ slidesBuilt = false; armAttract(); }   // 正在播的話，等下次開始播再換
}
function loadSlides(){
  if(!SLIDES_API) return;
  var done = false, ctl = window.AbortController ? new AbortController() : null;
  var to = setTimeout(function(){ if(ctl) ctl.abort(); }, 8000);
  fetch(SLIDES_API, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"get"}), signal: ctl ? ctl.signal : undefined })
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearTimeout(to);
      if(j && j.ok){ applySlides(j); try{ localStorage.setItem("kiosk_slides", JSON.stringify(j)); }catch(e){} }
    }).catch(function(){ clearTimeout(to); });
}
try{ applySlides(JSON.parse(localStorage.getItem("kiosk_slides")||"null")); }catch(e){}   // 先用上次讀到的（斷網也能播）
loadSlides(); setInterval(loadSlides, 3 * 60 * 1000);
function buildSlides(){
  if(slidesBuilt) return; slidesBuilt = true;
  var list = slideData.filter(function(x){ return x.enabled !== false; });
  $("stage").innerHTML = list.map(function(x){
    var art = /^https?:|^\.\.\//.test(x.art) ? x.art : "../" + x.art;
    if(x.type === "full"){
      var fr = ["green","orange","teal"].indexOf(x.frame) >= 0 ? x.frame : "";
      return '<div class="slide full fit-'+(x.fit==="cover"?"cover":"contain")+(fr?" fr fr-"+fr:"")+'"><div class="shot"><img src="'+escH(art)+'" alt=""></div>'+
             (fr?'<div class="frm"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>':"")+'</div>';
    }
    var body = x.list && x.list.length ? "<ul>"+x.list.map(function(t){ return "<li>"+escH(t)+"</li>"; }).join("")+"</ul>" : "<p>"+escH(x.words)+"</p>";
    return '<div class="slide '+(x.type==="promo"?"promo":"intro")+'"><div class="art'+(x.photo?" photo":"")+'"><img src="'+escH(art)+'" alt=""></div>'+
           '<div class="words">'+(x.tag?'<span class="tag">'+escH(x.tag)+'</span>':"")+'<h2>'+escH(x.title)+'</h2>'+body+'</div></div>';
  }).join("");
  $("dots").innerHTML = list.map(function(){ return "<i></i>"; }).join("");
}
function showSlide(i){
  var sl = document.querySelectorAll("#stage .slide"), ds = document.querySelectorAll("#dots i");
  if(!sl.length) return;
  slideIdx = (i + sl.length) % sl.length;
  sl.forEach(function(e,k){ e.classList.remove("on"); if(k === slideIdx){ void e.offsetWidth; e.classList.add("on"); } });
  var at = $("attract"), full = sl[slideIdx].classList.contains("full");
  at.classList.toggle("isfull", full);
  at.classList.remove("hint"); if(full){ void at.offsetWidth; at.classList.add("hint"); }   // 滿版時「請點一下螢幕」只在剛換頁時顯示幾秒，避免擋到圖片
  ds.forEach(function(e,k){ e.classList.toggle("on", k === slideIdx); });
}
function startAttract(){
  if(cur || warning) return;                // 有人正在用就不播
  buildSlides();
  if(!document.querySelector("#stage .slide")) return;
  $("attract").classList.add("show");
  showSlide(0);
  clearInterval(slideTimer);
  slideTimer = setInterval(function(){ showSlide(slideIdx + 1); }, SLIDE_MS);
}
function endAttract(){
  clearInterval(slideTimer);
  $("attract").classList.remove("show");
  armAttract();
}
function armAttract(){
  clearTimeout(atTimer);
  if(cur || $("attract").classList.contains("show")) return;
  atTimer = setTimeout(startAttract, ATTRACT_MS);
}
["touchstart","mousedown","keydown","wheel"].forEach(function(ev){
  document.addEventListener(ev, armAttract, {capture:true, passive:true});
});
armAttract();

/* ===== 螢幕不熄滅：向瀏覽器要求「保持喚醒」（支援的瀏覽器才有效；裝置本身的休眠設定仍要關掉）===== */
var wakeLock = null;
function keepAwake(){
  if(!navigator.wakeLock || wakeLock || document.visibilityState !== "visible") return;
  navigator.wakeLock.request("screen").then(function(l){
    wakeLock = l; l.addEventListener("release", function(){ wakeLock = null; });
  }).catch(function(){});
}
keepAwake();
document.addEventListener("visibilitychange", keepAwake);
["touchstart","mousedown"].forEach(function(ev){ document.addEventListener(ev, keepAwake, {capture:true, passive:true}); });
setInterval(keepAwake, 60 * 1000);

/* ===== 調整被嵌入的家屬頁（同網域，可直接改 DOM）===== */
function zoomFor(a){
  if(a.zoom !== "auto") return a.zoom;
  var w = $("frame").clientWidth || window.innerWidth;
  return Math.max(1, Math.min(1.8, w / 1000));
}
function tuneFrame(){
  if(!cur) return;
  var f = $("frame"), d;
  try{ d = f.contentDocument; }catch(e){ return; }
  if(!d || !d.body || d.location.href === "about:blank") return;
  var a = APPS[cur];

  // 拿掉員工用的「← 入口網站」返回列與「工作人員入口」
  d.querySelectorAll('a[href="../index.html"]').forEach(function(x){ if(x.parentElement) x.parentElement.remove(); });
  var st = d.getElementById("staff-override-trigger"); if(st) st.style.display = "none";

  var s = d.createElement("style");
  s.textContent = "html body{padding-top:0 !important} ::-webkit-scrollbar{width:0;height:0} *{-webkit-tap-highlight-color:transparent}";
  d.head.appendChild(s);
  var z = zoomFor(a);
  d.documentElement.style.zoom = z;
  if(a.fitHero){   // zoom 會讓 100svh 的大圖超出畫面，改成剛好一屏
    var h = d.createElement("style");
    h.textContent = ".hero{height:" + Math.floor(f.clientHeight / z) + "px !important;min-height:0 !important}";
    d.head.appendChild(h);
  }

  // 不讓家屬點到外部連結或離開這個機台畫面
  d.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("a[href]") : null;
    if(!el) return;
    var h = el.getAttribute("href") || "";
    if(h.charAt(0) === "#") return;
    e.preventDefault();
  }, true);
  d.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  ["touchstart","mousedown","keydown","wheel","scroll"].forEach(function(ev){
    d.addEventListener(ev, armIdle, {capture:true, passive:true});
  });
}
$("frame").addEventListener("load", tuneFrame);

/* 內嵌頁（物品登記）完成後通知首頁 */
window.addEventListener("message", function(e){
  if(e.origin !== location.origin || !e.data) return;
  if(e.data.kiosk === "home") goHome();
});
</script>
</body>
</html>
