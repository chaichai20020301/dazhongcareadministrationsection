<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探視名單查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FAF8EF;font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input:focus{outline:none;border-color:#14563F}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ld{display:inline-block;vertical-align:middle;width:16px;height:16px;border:2px solid #D3D8C8;border-top-color:#14563F;border-radius:50%;animation:spin .9s linear infinite}
.card{animation:riseIn .3s ease both}
.langbtn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;padding:5px 10px;border-radius:20px;font:700 12px 'Noto Sans TC';opacity:.7}
.langbtn.on{background:#fff;color:#14563F;opacity:1;border-color:#fff}
#app-bg{min-height:100vh;padding:22px 14px 60px}
#app-shell{max-width:560px;margin:0 auto}
@media (min-width:768px){#app-bg{padding:36px 20px 72px}#app-shell{max-width:680px}}
@media (min-width:1024px){#app-shell{max-width:760px}}

/* ===== 水彩風（同入口網站）===== */
html,body{background:#FAF8EF!important}
#app-bg{position:relative;z-index:1}
.v-page-leaf{position:fixed;bottom:0;width:105px;z-index:0;pointer-events:none}
.v-page-leaf.bl{left:0}.v-page-leaf.br{right:0}
input:focus{border-color:#14563F!important;box-shadow:0 0 0 4px rgba(20,86,63,.12)}
#btn-today,#btn-refresh{border-radius:999px!important}
.v-topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:2147483647;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(250,248,239,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #E3E5D8;box-sizing:border-box}
.v-back{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:#14563F;color:#fff!important;border-radius:999px;
  font:700 14px/1 'Noto Sans TC',system-ui,sans-serif;text-decoration:none;box-shadow:0 3px 8px rgba(20,86,63,.22)}
.v-tb-logo{height:40px;width:auto;flex:none}
.v-tb-title{font:900 19px 'Noto Serif TC',serif;color:#14563F;border-left:1px solid #B3BDB0;padding-left:14px;white-space:nowrap}
.v-hero{position:relative;overflow:hidden;isolation:isolate;min-height:150px;padding:24px 24px 20px;background:#F5F6E6}
.v-hero-leaf{position:absolute;top:0;z-index:-1;opacity:.75;pointer-events:none}
.v-hero-leaf.l{left:0;width:90px}.v-hero-leaf.r{right:0;width:62px}
.v-hero-art{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:55%;object-fit:contain;object-position:right bottom;z-index:-1}
.v-hero-row{display:flex;flex-direction:column;gap:14px;max-width:62%}
.v-hero-title{font:900 26px/1.3 'Noto Serif TC',serif;color:#092F25;letter-spacing:.03em}
.v-hero-sub{margin-top:6px;font:500 14px/1.7 'Noto Sans TC';color:#4D695A}
.v-langs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.v-langs .v-ico{width:22px;height:22px;color:#14563F;margin-right:2px}
.v-ico{display:inline-block;flex:none;background:currentColor;-webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
.langbtn{border:1px solid #B5CDA2!important;background:#FFFDF8!important;color:#14563F!important;opacity:1!important;padding:6px 13px!important;border-radius:999px!important}
.langbtn.on{background:#14563F!important;color:#fff!important;border-color:#14563F!important}
.v-empty-img{display:block;width:120px;height:auto;margin:0 auto 8px}
@media (max-width:600px){
  .v-topbar{height:56px;padding:0 12px;gap:10px}
  body{padding-top:56px!important}
  .v-tb-logo{display:none}
  .v-hero{padding:20px 18px}
  .v-hero-row{max-width:100%}
  .v-hero-art{opacity:.45}
  .v-hero-title{font-size:23px}
  .v-page-leaf{width:60px;opacity:.6}
}
</style>
</head>
<body>
<!--BACK_TO_PORTAL--><style>body{padding-top:64px !important}</style><div class="v-topbar"><a class="v-back" href="../index.html">&larr; 入口網站</a><img class="v-tb-logo" src="../portal-img/logo.png" alt="線東大眾護理之家"><span class="v-tb-title">探視名單</span></div>
<img class="v-page-leaf bl" src="../kiosk/img/n-c-bl.webp" alt=""><img class="v-page-leaf br" src="../kiosk/img/n-c-br.webp" alt="">
<div id="app-bg">
<div id="app-shell">
<div style="background:#FFFDF8;border:1px solid #E3E5D8;border-radius:20px;overflow:hidden;box-shadow:0 6px 26px rgba(23,59,37,.08)">
<div class="v-hero">
<img class="v-hero-leaf l" src="../kiosk/img/n-c-tl.webp" alt=""><img class="v-hero-leaf r" src="../kiosk/img/n-c-tr.webp" alt="">
<img class="v-hero-art" src="../assets/visit/banner.webp" alt="">
<div class="v-hero-row">
<div>
<div id="t-title" class="v-hero-title">探視名單查詢</div>
<div id="t-sub" class="v-hero-sub"></div>
</div>
<div class="v-langs"><i class="v-ico" style="--ico:url(../assets/visit/icon-language.webp)"></i>
<button class="langbtn" data-lang="zh">中</button>
<button class="langbtn" data-lang="id">ID</button>
<button class="langbtn" data-lang="vi">VI</button>
</div>
</div>
</div>

<div style="padding:16px 16px 20px">
<div style="display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end;padding:0 2px 12px">
<div style="flex:1;min-width:130px;display:flex;flex-direction:column;gap:5px">
<label id="lab-date" style="font:700 11.5px 'Noto Sans TC';color:#4D695A"></label>
<input type="date" id="q-date" style="width:100%;padding:11px 12px;background:#fff;border:1px solid #E3E5D8;border-radius:12px;font:700 15px 'Noto Sans TC';color:#14563F">
</div>
<div style="flex:2;min-width:160px;display:flex;flex-direction:column;gap:5px">
<label id="lab-name" style="font:700 11.5px 'Noto Sans TC';color:#4D695A"></label>
<input type="text" id="q-name" style="width:100%;padding:11px 12px;background:#fff;border:1px solid #E3E5D8;border-radius:12px;font:400 15px 'Noto Sans TC';color:#092F25">
</div>
<button id="btn-today" style="flex:none;padding:11px 15px;border:1px solid #D3D8C8;background:#fff;color:#14563F;border-radius:12px;font:700 13px 'Noto Sans TC'"></button>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px">
<div id="t-count" style="font:700 13px 'Noto Sans TC';color:#4D695A"></div>
<button id="btn-refresh" style="border:1px solid #D3D8C8;background:#fff;color:#14563F;padding:7px 14px;border-radius:20px;font:700 12.5px 'Noto Sans TC'"></button>
</div>
<div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
</div>
</div>
<div id="sync" style="margin-top:16px;text-align:center;font:400 11px 'Noto Sans TC';color:#A7B3AA;letter-spacing:.08em"></div>
</div>
</div>

<script>
(function(){
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxstYtZTFyuC0ChLh1KtJSRj4sH7w0xUHPaecI9xTvbeVDiqo73xOau7FNwyw0aTKag/exec";
  var CODE = "";
  // 入口認證 token（有效的 portal_token 就走 token 模式；否則過渡期用 handover_code）
  var TOKEN = "";
  try { var pt = localStorage.getItem("portal_token"); var pe = parseInt(localStorage.getItem("portal_exp") || "0", 10); if (pt && pe * 1000 > Date.now()) TOKEN = pt; } catch (e) {}

  var I18N = {
    zh: { title:"探視名單查詢", sub:"預設顯示今日，可依日期或住民姓名查詢", date:"日期", name:"住民姓名", namePh:"輸入姓名查詢（跨日期）",
          today:"今日", resident:"住民", family:"家屬", room:"房號",
          empty:"此日期尚無探視預約", emptySearch:"查無符合的住民", loading:"讀取中…", offline:"連線失敗，請稍後再試",
          refresh:"重新整理", count:function(n){return "共 "+n+" 筆";}, synced:"已更新 ", locale:"zh-TW",
          mismatch:"通行碼與探視系統不符，請洽管理員", busy:"系統忙碌，請稍後再試", roleBlocked:"此頁僅限工作人員使用", backPortal:"返回入口網站" },
    id: { title:"Cari Daftar Kunjungan", sub:"Default hari ini; cari per tanggal atau nama penghuni", date:"Tanggal", name:"Nama penghuni", namePh:"Cari nama (semua tanggal)",
          today:"Hari ini", resident:"Penghuni", family:"Keluarga", room:"Kamar",
          empty:"Tidak ada kunjungan di tanggal ini", emptySearch:"Penghuni tidak ditemukan", loading:"Memuat…", offline:"Gagal terhubung, coba lagi",
          refresh:"Muat ulang", count:function(n){return "Total "+n;}, synced:"Diperbarui ", locale:"id-ID",
          mismatch:"Kode akses tidak cocok dengan sistem kunjungan, hubungi admin", busy:"Sistem sibuk, coba lagi nanti", roleBlocked:"Halaman ini khusus staf", backPortal:"Kembali ke portal" },
    vi: { title:"Tra cứu lịch thăm", sub:"Mặc định hôm nay; tìm theo ngày hoặc tên người cao tuổi", date:"Ngày", name:"Tên người cao tuổi", namePh:"Tìm theo tên (mọi ngày)",
          today:"Hôm nay", resident:"Người cao tuổi", family:"Người nhà", room:"Phòng",
          empty:"Ngày này chưa có lượt thăm", emptySearch:"Không tìm thấy", loading:"Đang tải…", offline:"Kết nối thất bại, thử lại",
          refresh:"Tải lại", count:function(n){return "Tổng "+n;}, synced:"Đã cập nhật ", locale:"vi-VN",
          mismatch:"Mã truy cập không khớp hệ thống thăm, liên hệ quản trị", busy:"Hệ thống bận, thử lại sau", roleBlocked:"Trang chỉ dành cho nhân viên", backPortal:"Về trang cổng" }
  };

  var lang = "zh";
  try { var pl = localStorage.getItem("portal_lang"); if (pl && I18N[pl]) lang = pl; } catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };
  var cache = null;

  function normDate(str){
    if(!str) return "";
    var m = String(str).replace(/\//g,"-").trim().match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
    var d = new Date(str);
    if(!isNaN(d.getTime())) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return String(str);
  }
  function normTime(str){
    if(!str) return "";
    var s = String(str).trim().replace(/：/g,":");
    if(s.indexOf(" ")>=0) s = s.split(" ")[1];
    var p = s.split(":");
    if(p.length>=2) return p[0].replace(/^0/,"")+":"+p[1];
    return s;
  }
  function normName(s){ return String(s||"").replace(/[（(][^）)]*[）)]/g,"").replace(/\s+/g,"").trim(); }
  function bedOf(r){ var m = String(r.residentName||r.name||"").match(/^\s*\[([^\]]+)\]/); return m?m[1].trim():""; }
  function floorOf(bed){ var m = String(bed||"").match(/^[^-_/‐-―－]+/); return m?m[0].trim():""; }
  function nameNoBed(s){ return String(s||"").replace(/^\s*\[[^\]]+\]\s*/,""); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  function applyStaticText(){
    var T = I18N[lang];
    document.documentElement.lang = T.locale;
    document.title = T.title;
    $("t-title").innerText = T.title;
    $("t-sub").innerText = T.sub;
    $("lab-date").innerText = T.date;
    $("lab-name").innerText = T.name;
    $("q-name").placeholder = T.namePh;
    $("btn-today").innerText = T.today;
    $("btn-refresh").innerText = T.refresh;
    var btns = document.querySelectorAll(".langbtn");
    for(var i=0;i<btns.length;i++){ btns[i].className = "langbtn" + (btns[i].getAttribute("data-lang")===lang ? " on" : ""); }
  }

  function cmpRow(a,b){
    var t = normTime(a.time).localeCompare(normTime(b.time), undefined, {numeric:true}); if(t) return t;
    var f = floorOf(bedOf(a)).localeCompare(floorOf(bedOf(b)), undefined, {numeric:true}); if(f) return f;
    return bedOf(a).localeCompare(bedOf(b), undefined, {numeric:true});
  }

  function render(){
    var T = I18N[lang];
    var listEl = $("list");
    if(cache === null){
      listEl.innerHTML = '<div style="padding:34px;text-align:center;background:#fff;border:1px solid #E3E5D8;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:9px"><span class="ld"></span><span style="font:400 14px \'Noto Sans TC\';color:#7F9186">'+esc(T.loading)+'</span></div>';
      $("t-count").innerText = "";
      return;
    }
    var q = normName($("q-name").value);
    var rows, searchMode = q.length > 0;
    if(searchMode){
      rows = cache.filter(function(r){ return normName(r.residentName || r.name).indexOf(q) !== -1; })
        .sort(function(a,b){ var d = normDate(a.date).localeCompare(normDate(b.date)); return d ? d : cmpRow(a,b); });
    } else {
      var d = normDate($("q-date").value) || todayStr();
      rows = cache.filter(function(r){ return normDate(r.date) === d; }).sort(cmpRow);
    }
    $("t-count").innerText = T.count(rows.length);
    if(!rows.length){
      listEl.innerHTML = '<div style="padding:40px 20px;text-align:center;background:#fff;border:1px solid #E3E5D8;border-radius:12px;font:400 15px \'Noto Sans TC\';color:#7F9186">'+'<img class="v-empty-img" src="../assets/'+(searchMode?'common/state-empty':'visit/state-no-visit')+'.webp" alt="">'+esc(searchMode ? T.emptySearch : T.empty)+'</div>';
      return;
    }
    listEl.innerHTML = rows.map(function(r){
      var bed = bedOf(r);
      var name = esc(nameNoBed(r.residentName || r.name || ""));
      var fam = esc(r.familyName || "");
      var time = esc(r.time || "");
      var dateTag = searchMode ? '<span style="font:400 11px \'Noto Sans TC\';color:#7A8C80">'+esc(normDate(r.date))+'</span>' : '';
      return '<div class="card" style="display:flex;gap:12px;padding:14px;background:#fff;border:1px solid #E3E5D8;border-radius:12px;align-items:stretch">'
        + '<div style="width:60px;flex:none;display:flex;flex-direction:column;gap:4px">'
          + '<div style="padding:8px 0;background:#EAF3DC;border-radius:10px;text-align:center;font:700 15px \'Noto Serif TC\';color:#14563F">'+time+'</div>'
          + (bed ? '<div style="padding:4px 0;background:#F3F4EA;border:1px solid #E3E5D8;border-radius:10px;text-align:center;font:700 11px \'Noto Sans TC\';color:#4D695A;word-break:break-all">'+esc(bed)+'</div>' : '')
        + '</div>'
        + '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center">'
          + '<div style="display:flex;align-items:baseline;gap:8px"><span style="font:700 18px \'Noto Sans TC\';color:#092F25;word-break:break-all">'+name+'</span>'+dateTag+'</div>'
          + (fam ? '<div style="font:400 13px \'Noto Sans TC\';color:#4D695A">'+esc(T.family)+'：'+fam+'</div>' : '')
        + '</div></div>';
    }).join("");
  }

  function setSync(text, err){ $("sync").innerText = text; $("sync").style.color = err ? "#B65B16" : "#A7B3AA"; }

  var fetching = false;
  function load(){
    if(fetching) return;
    fetching = true;
    var T = I18N[lang];
    if(cache === null) render();
    var p;
    if(TOKEN){
      p = fetch(SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({ action:"visit_list", token:TOKEN }) });
    } else {
      p = fetch(SCRIPT_URL + "?action=visit_list&pwd=" + encodeURIComponent(CODE) + "&t=" + Date.now());
    }
    p.then(function(res){ return res.json(); })
      .then(function(j){
        if(j && j.error === "unauthorized"){ if(TOKEN){ location.href = "../index.html"; } else { showNotice(I18N[lang].mismatch, true); } return; }
        if(j && j.error === "forbidden"){ showNotice(I18N[lang].roleBlocked, true); return; }
        if(j && j.error === "busy"){ setSync(I18N[lang].busy, true); return; }
        cache = (j && j.records) || [];
        render();
        setSync(T.synced + new Date().toLocaleTimeString(T.locale, {hour:"2-digit",minute:"2-digit"}), false);
      })
      .catch(function(){
        setSync(T.offline, true);
        if(cache === null){ $("list").innerHTML = '<div style="padding:34px;text-align:center;background:#fff;border:1px solid #E3E5D8;border-radius:12px;font:400 14px \'Noto Sans TC\';color:#B65B16"><img class="v-empty-img" src="../assets/common/state-offline.webp" alt="">'+esc(T.offline)+'</div>'; }
      })
      .then(function(){ fetching = false; });
  }

  // 入口網站首頁（角色不符時提供返回連結，可依實際入口網址調整）
  var PORTAL_HOME = "../index.html";
  var ROLES_ALLOWED = { admin:1, nurseadmin:1, nurse:1, care:1 }; // C 頁允許：行政／護理行政／護理／照服

  // 以整頁通知取代白畫面（角色不符、通行碼不符、忙碌）
  function showNotice(msg, withBack){
    var html = '<div style="padding:40px 22px;text-align:center;background:#fff;border:1px solid #E3E5D8;border-radius:12px;font:400 15px/1.8 \'Noto Sans TC\';color:#A63124"><img class="v-empty-img" src="../assets/common/state-locked.webp" alt="">' + esc(msg) + '</div>';
    if(withBack){ html += '<a href="' + PORTAL_HOME + '" style="display:block;margin-top:12px;text-align:center;padding:13px;background:#14563F;color:#fff;border-radius:12px;font:700 14px \'Noto Sans TC\';text-decoration:none">' + esc(I18N[lang].backPortal) + '</a>'; }
    $("list").innerHTML = html;
    $("t-count").innerText = "";
  }

  function boot(){
    var role = ""; try { role = localStorage.getItem("portal_role") || ""; } catch(e){}
    if(!ROLES_ALLOWED[role]){ showNotice(I18N[lang].roleBlocked, true); return; }
    if(TOKEN){ load(); return; } // 入口認證 token 模式：由後端驗證
    var pwd = ""; try { pwd = localStorage.getItem("handover_code") || ""; } catch(e){} // 過渡期：舊通行碼
    if(!pwd){ showNotice(I18N[lang].mismatch, true); return; }
    CODE = pwd; load();
  }

  // 查詢控制
  $("q-date").value = todayStr();
  $("q-date").onchange = function(){ $("q-name").value = ""; render(); };
  $("q-name").addEventListener("input", render);
  $("btn-today").onclick = function(){ $("q-name").value = ""; $("q-date").value = todayStr(); render(); };
  $("btn-refresh").onclick = load;

  var btns = document.querySelectorAll(".langbtn");
  for(var i=0;i<btns.length;i++){
    btns[i].onclick = function(){
      lang = this.getAttribute("data-lang");
      try { localStorage.setItem("portal_lang", lang); } catch(e){}
      applyStaticText(); render();
    };
  }

  applyStaticText();
  boot();
})();
</script>
</body>
</html>
