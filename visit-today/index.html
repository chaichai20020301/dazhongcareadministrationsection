<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探視名單查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#f1ede5;font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input:focus{outline:none;border-color:#4f8c3a}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ld{display:inline-block;vertical-align:middle;width:16px;height:16px;border:2px solid #e0dbd1;border-top-color:#4f8c3a;border-radius:50%;animation:spin .9s linear infinite}
.card{animation:riseIn .3s ease both}
.langbtn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;padding:5px 10px;border-radius:20px;font:700 12px 'Noto Sans TC';opacity:.7}
.langbtn.on{background:#fff;color:#4f8c3a;opacity:1;border-color:#fff}
#app-bg{min-height:100vh;padding:22px 14px 60px}
#app-shell{max-width:560px;margin:0 auto}
@media (min-width:768px){#app-bg{padding:36px 20px 72px}#app-shell{max-width:680px}}
@media (min-width:1024px){#app-shell{max-width:760px}}
</style>
</head>
<body>
<!--BACK_TO_PORTAL--><style>body{padding-top:46px !important}</style><div style="position:fixed;top:0;left:0;right:0;height:46px;z-index:2147483647;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(255,253,248,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #e6ded0;box-shadow:0 2px 10px rgba(28,43,35,.06);box-sizing:border-box"><a href="../index.html" style="flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:linear-gradient(120deg,#2f9e6b,#1c6b48);color:#fff;border-radius:999px;font:600 13px/1 'Noto Sans TC','PingFang TC',system-ui,sans-serif;text-decoration:none;box-shadow:0 3px 10px rgba(28,107,72,.28)">&larr; 入口網站</a><span style="min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:500 12.5px/1 'Noto Sans TC',system-ui,sans-serif;color:#93a096;letter-spacing:1px">線東大眾護理之家 · 系統整合入口</span></div>
<div id="app-bg">
<div id="app-shell">
<div style="background:#faf8f4;border:1px solid #e7e1d6;border-radius:8px;overflow:hidden;box-shadow:0 6px 26px rgba(79,140,58,.10)">
<div style="padding:22px 22px 18px;background:#4f8c3a;color:#fff">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
<div>
<div id="t-title" style="font:700 22px/1.3 'Noto Serif TC';color:#fff">探視名單查詢</div>
<div id="t-sub" style="margin-top:5px;font:300 13px/1.7 'Noto Sans TC';color:#e2f0d3"></div>
</div>
<div style="display:flex;gap:5px;flex:none">
<button class="langbtn" data-lang="zh">中</button>
<button class="langbtn" data-lang="id">ID</button>
<button class="langbtn" data-lang="vi">VI</button>
</div>
</div>
</div>

<div style="padding:16px 16px 20px">
<div style="display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end;padding:0 2px 12px">
<div style="flex:1;min-width:130px;display:flex;flex-direction:column;gap:5px">
<label id="lab-date" style="font:700 11.5px 'Noto Sans TC';color:#7d766c"></label>
<input type="date" id="q-date" style="width:100%;padding:11px 12px;background:#fff;border:1px solid #e7e1d6;border-radius:6px;font:700 15px 'Noto Sans TC';color:#4f8c3a">
</div>
<div style="flex:2;min-width:160px;display:flex;flex-direction:column;gap:5px">
<label id="lab-name" style="font:700 11.5px 'Noto Sans TC';color:#7d766c"></label>
<input type="text" id="q-name" style="width:100%;padding:11px 12px;background:#fff;border:1px solid #e7e1d6;border-radius:6px;font:400 15px 'Noto Sans TC';color:#2a2926">
</div>
<button id="btn-today" style="flex:none;padding:11px 15px;border:1px solid #e0dbd1;background:#fff;color:#4f8c3a;border-radius:6px;font:700 13px 'Noto Sans TC'"></button>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px">
<div id="t-count" style="font:700 13px 'Noto Sans TC';color:#7d766c"></div>
<button id="btn-refresh" style="border:1px solid #e0dbd1;background:#fff;color:#4f8c3a;padding:7px 14px;border-radius:20px;font:700 12.5px 'Noto Sans TC'"></button>
</div>
<div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
</div>
</div>
<div id="sync" style="margin-top:16px;text-align:center;font:400 11px 'Noto Sans TC';color:#c6bfb2;letter-spacing:.08em"></div>
</div>
</div>

<script>
(function(){
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxstYtZTFyuC0ChLh1KtJSRj4sH7w0xUHPaecI9xTvbeVDiqo73xOau7FNwyw0aTKag/exec";
  var CODE = "";

  var I18N = {
    zh: { title:"探視名單查詢", sub:"預設顯示今日，可依日期或住民姓名查詢", date:"日期", name:"住民姓名", namePh:"輸入姓名查詢（跨日期）",
          today:"今日", resident:"住民", family:"家屬", room:"房號",
          empty:"此日期尚無探視預約", emptySearch:"查無符合的住民", loading:"讀取中…", offline:"連線失敗，請稍後再試",
          refresh:"重新整理", count:function(n){return "共 "+n+" 筆";}, synced:"已更新 ", locale:"zh-TW",
          mismatch:"通行碼與探視系統不符，請洽管理員", busy:"系統忙碌，請稍後再試", roleBlocked:"此頁僅限工作人員使用", backPortal:"返回入口網站" },
    id: { title:"Cari Daftar Kunjungan", sub:"Default hari ini; cari per tanggal atau nama penghuni", date:"Tanggal", name:"Nama penghuni", namePh:"Cari nama (semua tanggal)",
          today:"Hari ini", resident:"Penghuni", family:"Keluarga", room:"Kamar",
          empty:"Tidak ada kunjungan di tanggal ini", emptySearch:"Penghuni tidak ditemukan", loading:"Memuat…", offline:"Gagal terhubung, coba lagi",
          refresh:"Muat ulang", count:function(n){return "Total "+n;}, synced:"Diperbarui ", locale:"id-ID",
          mismatch:"Kode akses tidak cocok dengan sistem kunjungan, hubungi admin", busy:"Sistem sibuk, coba lagi nanti", roleBlocked:"Halaman ini khusus staf", backPortal:"Kembali ke portal" },
    vi: { title:"Tra cứu lịch thăm", sub:"Mặc định hôm nay; tìm theo ngày hoặc tên người cao tuổi", date:"Ngày", name:"Tên người cao tuổi", namePh:"Tìm theo tên (mọi ngày)",
          today:"Hôm nay", resident:"Người cao tuổi", family:"Người nhà", room:"Phòng",
          empty:"Ngày này chưa có lượt thăm", emptySearch:"Không tìm thấy", loading:"Đang tải…", offline:"Kết nối thất bại, thử lại",
          refresh:"Tải lại", count:function(n){return "Tổng "+n;}, synced:"Đã cập nhật ", locale:"vi-VN",
          mismatch:"Mã truy cập không khớp hệ thống thăm, liên hệ quản trị", busy:"Hệ thống bận, thử lại sau", roleBlocked:"Trang chỉ dành cho nhân viên", backPortal:"Về trang cổng" }
  };

  var lang = "zh";
  try { var pl = localStorage.getItem("portal_lang"); if (pl && I18N[pl]) lang = pl; } catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };
  var cache = null;

  function normDate(str){
    if(!str) return "";
    var m = String(str).replace(/\//g,"-").trim().match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
    var d = new Date(str);
    if(!isNaN(d.getTime())) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return String(str);
  }
  function normTime(str){
    if(!str) return "";
    var s = String(str).trim().replace(/：/g,":");
    if(s.indexOf(" ")>=0) s = s.split(" ")[1];
    var p = s.split(":");
    if(p.length>=2) return p[0].replace(/^0/,"")+":"+p[1];
    return s;
  }
  function normName(s){ return String(s||"").replace(/[（(][^）)]*[）)]/g,"").replace(/\s+/g,"").trim(); }
  function bedOf(r){ var m = String(r.residentName||r.name||"").match(/^\s*\[([^\]]+)\]/); return m?m[1].trim():""; }
  function floorOf(bed){ var m = String(bed||"").match(/^[^-_/‐-―－]+/); return m?m[0].trim():""; }
  function nameNoBed(s){ return String(s||"").replace(/^\s*\[[^\]]+\]\s*/,""); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  function applyStaticText(){
    var T = I18N[lang];
    document.documentElement.lang = T.locale;
    document.title = T.title;
    $("t-title").innerText = T.title;
    $("t-sub").innerText = T.sub;
    $("lab-date").innerText = T.date;
    $("lab-name").innerText = T.name;
    $("q-name").placeholder = T.namePh;
    $("btn-today").innerText = T.today;
    $("btn-refresh").innerText = T.refresh;
    var btns = document.querySelectorAll(".langbtn");
    for(var i=0;i<btns.length;i++){ btns[i].className = "langbtn" + (btns[i].getAttribute("data-lang")===lang ? " on" : ""); }
  }

  function cmpRow(a,b){
    var t = normTime(a.time).localeCompare(normTime(b.time), undefined, {numeric:true}); if(t) return t;
    var f = floorOf(bedOf(a)).localeCompare(floorOf(bedOf(b)), undefined, {numeric:true}); if(f) return f;
    return bedOf(a).localeCompare(bedOf(b), undefined, {numeric:true});
  }

  function render(){
    var T = I18N[lang];
    var listEl = $("list");
    if(cache === null){
      listEl.innerHTML = '<div style="padding:34px;text-align:center;background:#fff;border:1px solid #e7e1d6;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:9px"><span class="ld"></span><span style="font:400 14px \'Noto Sans TC\';color:#b6ae9f">'+esc(T.loading)+'</span></div>';
      $("t-count").innerText = "";
      return;
    }
    var q = normName($("q-name").value);
    var rows, searchMode = q.length > 0;
    if(searchMode){
      rows = cache.filter(function(r){ return normName(r.residentName || r.name).indexOf(q) !== -1; })
        .sort(function(a,b){ var d = normDate(a.date).localeCompare(normDate(b.date)); return d ? d : cmpRow(a,b); });
    } else {
      var d = normDate($("q-date").value) || todayStr();
      rows = cache.filter(function(r){ return normDate(r.date) === d; }).sort(cmpRow);
    }
    $("t-count").innerText = T.count(rows.length);
    if(!rows.length){
      listEl.innerHTML = '<div style="padding:40px 20px;text-align:center;background:#fff;border:1px solid #e7e1d6;border-radius:6px;font:400 15px \'Noto Sans TC\';color:#b6ae9f">'+esc(searchMode ? T.emptySearch : T.empty)+'</div>';
      return;
    }
    listEl.innerHTML = rows.map(function(r){
      var bed = bedOf(r);
      var name = esc(nameNoBed(r.residentName || r.name || ""));
      var fam = esc(r.familyName || "");
      var time = esc(r.time || "");
      var dateTag = searchMode ? '<span style="font:400 11px \'Noto Sans TC\';color:#a79f94">'+esc(normDate(r.date))+'</span>' : '';
      return '<div class="card" style="display:flex;gap:12px;padding:14px;background:#fff;border:1px solid #e7e1d6;border-radius:6px;align-items:stretch">'
        + '<div style="width:60px;flex:none;display:flex;flex-direction:column;gap:4px">'
          + '<div style="padding:8px 0;background:#eef5e6;border-radius:5px;text-align:center;font:700 15px \'Noto Serif TC\';color:#4f8c3a">'+time+'</div>'
          + (bed ? '<div style="padding:4px 0;background:#f5f2ec;border:1px solid #e7e1d6;border-radius:5px;text-align:center;font:700 11px \'Noto Sans TC\';color:#7d766c;word-break:break-all">'+esc(bed)+'</div>' : '')
        + '</div>'
        + '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center">'
          + '<div style="display:flex;align-items:baseline;gap:8px"><span style="font:700 18px \'Noto Sans TC\';color:#2a2926;word-break:break-all">'+name+'</span>'+dateTag+'</div>'
          + (fam ? '<div style="font:400 13px \'Noto Sans TC\';color:#857e73">'+esc(T.family)+'：'+fam+'</div>' : '')
        + '</div></div>';
    }).join("");
  }

  function setSync(text, err){ $("sync").innerText = text; $("sync").style.color = err ? "#a8763c" : "#c6bfb2"; }

  var fetching = false;
  function load(){
    if(fetching || !CODE) return;
    fetching = true;
    var T = I18N[lang];
    if(cache === null) render();
    fetch(SCRIPT_URL + "?pwd=" + encodeURIComponent(CODE) + "&t=" + Date.now())
      .then(function(res){ return res.json(); })
      .then(function(data){
        cache = data.records || [];
        render();
        var now = new Date();
        setSync(T.synced + now.toLocaleTimeString(T.locale, {hour:"2-digit",minute:"2-digit"}), false);
      })
      .catch(function(){
        setSync(T.offline, true);
        if(cache === null){ $("list").innerHTML = '<div style="padding:34px;text-align:center;background:#fff;border:1px solid #e7e1d6;border-radius:6px;font:400 14px \'Noto Sans TC\';color:#a8763c">'+esc(T.offline)+'</div>'; }
      })
      .then(function(){ fetching = false; });
  }

  // 入口網站首頁（角色不符時提供返回連結，可依實際入口網址調整）
  var PORTAL_HOME = "../index.html";
  var ROLES_ALLOWED = { admin:1, nurse:1, care:1 }; // C 頁允許：行政／護理／照服

  // 以整頁通知取代白畫面（角色不符、通行碼不符、忙碌）
  function showNotice(msg, withBack){
    var html = '<div style="padding:40px 22px;text-align:center;background:#fff;border:1px solid #e7e1d6;border-radius:6px;font:400 15px/1.8 \'Noto Sans TC\';color:#7a2b22">' + esc(msg) + '</div>';
    if(withBack){ html += '<a href="' + PORTAL_HOME + '" style="display:block;margin-top:12px;text-align:center;padding:13px;background:#4f8c3a;color:#fff;border-radius:6px;font:700 14px \'Noto Sans TC\';text-decoration:none">' + esc(I18N[lang].backPortal) + '</a>'; }
    $("list").innerHTML = html;
    $("t-count").innerText = "";
  }

  function verify(pwd, cb){
    if(!pwd){ cb(false, false); return; }
    fetch(SCRIPT_URL + "?action=verify&pwd=" + encodeURIComponent(pwd) + "&t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){ cb(!!(j && j.ok), !!(j && j.error === "busy")); })
      .catch(function(){ cb(false, false); });
  }
  function boot(){
    var role = ""; try { role = localStorage.getItem("portal_role") || ""; } catch(e){}
    if(!ROLES_ALLOWED[role]){ showNotice(I18N[lang].roleBlocked, true); return; }
    var pwd = ""; try { pwd = localStorage.getItem("handover_code") || ""; } catch(e){}
    verify(pwd, function(ok, busy){
      if(ok){ CODE = pwd; load(); }
      else { showNotice(busy ? I18N[lang].busy : I18N[lang].mismatch, !busy); }
    });
  }

  // 查詢控制
  $("q-date").value = todayStr();
  $("q-date").onchange = function(){ $("q-name").value = ""; render(); };
  $("q-name").addEventListener("input", render);
  $("btn-today").onclick = function(){ $("q-name").value = ""; $("q-date").value = todayStr(); render(); };
  $("btn-refresh").onclick = load;

  var btns = document.querySelectorAll(".langbtn");
  for(var i=0;i<btns.length;i++){
    btns[i].onclick = function(){
      lang = this.getAttribute("data-lang");
      try { localStorage.setItem("portal_lang", lang); } catch(e){}
      applyStaticText(); render();
    };
  }

  applyStaticText();
  boot();
})();
</script>
</body>
</html>
