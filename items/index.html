<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>線東大眾護理之家 · 住民物品登記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#FAF8EF}
  .portal-bar{position:fixed;top:0;left:0;right:0;height:56px;z-index:10;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:rgba(250,248,239,.96);border-bottom:1px solid #E3E5D8;box-sizing:border-box}
  .portal-bar a{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;
    background:#14563F;color:#fff;border-radius:999px;
    font:700 13.5px/1 "Noto Sans TC","PingFang TC",system-ui,sans-serif;text-decoration:none;
    box-shadow:0 3px 8px rgba(20,86,63,.22)}
  .portal-bar img{height:34px;width:auto;flex:none}
  .portal-bar span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    font:900 18px/1 "Noto Serif TC",serif;color:#B65B16;border-left:1px solid #B3BDB0;padding-left:14px}
  @media (max-width:600px){.portal-bar img{display:none}}
  iframe{position:fixed;top:56px;left:0;width:100%;height:calc(100% - 56px);border:0;display:block}
</style>
</head>
<body>
  <div class="portal-bar">
    <a href="../index.html">&larr; 入口網站</a>
    <img src="../portal-img/logo.png" alt="線東大眾護理之家">
    <span>住民物品登記</span>
  </div>
  <iframe src="app.dc.html" title="住民物品登記系統"></iframe>
</body>
</html>
