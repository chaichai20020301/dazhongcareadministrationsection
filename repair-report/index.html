<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>維修報修（護理／照服）</title>
<style>
  :root{
    --bg:#FAF8EF; --ink:#092F25; --sub:#3E5A4C; --sub2:#4D695A; --sub3:#7A8C80;
    --green:#1D5049; --green2:#27675F; --gl:#E6F1EE; --gl2:#F1F7F5; --gd:#CFE3DD;
    --line:#E3E5D8; --line2:#D3D8C8;
    --amber:#C07817; --amberbg:#FBF3E2;
    --red:#B4402F; --redbg:#FBEEE9;
    --err:#8F3F2C; --errbg:#FBEEE9; --errln:#B4553C;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Roboto,sans-serif;
    font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
  header{position:sticky;top:0;z-index:3;background:var(--bg);
    display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
    margin:0 -16px 18px}
  h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:700;line-height:1.2}
  h1 .sub{display:block;font-size:11.5px;font-weight:500;color:var(--sub3);margin-top:1px}
  .langs{flex:none;display:flex;gap:4px}
  .langs button{padding:5px 9px;border:1px solid var(--line2);background:transparent;color:var(--sub);
    font-size:12.5px;line-height:1;cursor:pointer;border-radius:9px}
  .langs button.on{background:var(--green);border-color:var(--green);color:#fff}

  .field{margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:0 0 7px}
  label .req{color:var(--red);font-weight:700;margin-left:3px}
  input,select,textarea{width:100%;font-size:16px;font-family:inherit;color:var(--ink);
    border:1px solid var(--line2);border-radius:11px;padding:12px 13px;background:#fff;-webkit-appearance:none;appearance:none}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%236A6E62' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");
    background-repeat:no-repeat;background-position:right 13px center;padding-right:36px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px rgba(39,103,95,.15)}
  textarea{resize:vertical;min-height:92px;line-height:1.55}

  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:1px solid var(--line2);background:#fff;border-radius:11px;padding:11px 6px;
    font-size:14.5px;font-weight:700;color:var(--sub2);cursor:pointer;line-height:1.2}
  .seg button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;background:#ccc}
  .seg button[data-v="緊急"] .dot{background:#D64533}
  .seg button[data-v="一般"] .dot{background:#E0A21B}
  .seg button[data-v="低"] .dot{background:#4E9A45}
  .seg button.on[data-v="緊急"]{background:var(--redbg);border-color:#D64533;color:#8F2E22}
  .seg button.on[data-v="一般"]{background:var(--amberbg);border-color:#E0A21B;color:#8A5A12}
  .seg button.on[data-v="低"]{background:var(--gl2);border-color:var(--green2);color:var(--green)}

  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
  .photos .p{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#EDEBE2}
  .photos .p img{width:100%;height:100%;object-fit:cover;display:block}
  .photos .p .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:6px;
    background:rgba(25,28,25,.62);color:#fff;font-size:13px;line-height:24px;text-align:center;cursor:pointer}
  .addp{aspect-ratio:1;border:1px dashed var(--line2);border-radius:10px;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub3);font-size:12px;font-weight:600;cursor:pointer}
  .addp .ic{font-size:20px;line-height:1}

  .btn{display:block;width:100%;padding:15px;border-radius:12px;border:0;
    background:var(--green2);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--green)}
  .btn:disabled{opacity:.55;cursor:default}
  .hint{color:var(--sub3);font-size:12px;margin-top:6px}

  .banner{padding:11px 13px;border-radius:11px;font-size:13.5px;line-height:1.55;margin-bottom:14px;display:none}
  .banner.err{display:block;background:var(--errbg);border:1px solid var(--errln);color:var(--err)}

  /* 成功畫面 */
  .done{text-align:center;padding:44px 18px}
  .done .ico{width:66px;height:66px;border-radius:50%;background:var(--gl);color:var(--green);
    font-size:34px;line-height:66px;margin:0 auto 16px}
  .done h2{margin:0 0 6px;font-size:20px;color:var(--green)}
  .done p{margin:0 0 22px;color:var(--sub2);font-size:14px}
  .done .no{display:inline-block;font-family:ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:4px 12px;color:var(--sub);margin-bottom:22px;font-size:14px}

  /* ===== 水彩風（同入口網站；維修系統主色＝淡藍綠）===== */
  body::after{content:"";position:fixed;right:0;bottom:0;width:100px;height:100px;background:url(../kiosk/img/n-c-br.webp) right bottom/contain no-repeat;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1}
  .v-topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:2147483647;display:flex;align-items:center;gap:14px;padding:0 20px;
    background:rgba(250,248,239,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #E3E5D8;box-sizing:border-box}
  .v-back{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:#14563F;color:#fff!important;border-radius:999px;
    font:700 14px/1 'Noto Sans TC',system-ui,sans-serif;text-decoration:none;box-shadow:0 3px 8px rgba(20,86,63,.22)}
  .v-tb-logo{height:40px;width:auto;flex:none}
  .v-tb-title{font:900 19px 'Noto Serif TC',serif;color:#27675F;border-left:1px solid #B3BDB0;padding-left:14px;white-space:nowrap}
  header{position:relative;top:auto;overflow:hidden;isolation:isolate;margin:14px 0 16px;padding:16px 20px 16px 90px;min-height:96px;
    background:#EEF5F2;border:0;border-radius:22px;box-shadow:0 6px 15px rgba(25,62,37,.06)}
  .r-leaf{position:absolute;left:0;top:0;height:100%;width:auto;opacity:.75;z-index:-1}
  .r-art{position:absolute;right:130px;bottom:0;height:100%;width:auto;max-width:42%;object-fit:contain;object-position:right bottom;z-index:-1}
  h1{font:900 26px/1.25 'Noto Serif TC',serif;color:#092F25}
  h1 .sub{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:#4D695A}
  .langs button{border-radius:999px;background:#FFFDF8;padding:6px 12px}
  label{color:#3E5A4C}
  select.as-tiles{display:none}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:8px 4px;border:1px solid #D3D8C8;
    background:#FFFDF8;border-radius:14px;font:600 13.5px/1.3 'Noto Sans TC',sans-serif;color:#3E5A4C;cursor:pointer;text-align:center}
  .tile img{width:34px;height:34px}
  .tile:hover{border-color:#7FB3A8}
  .tile.on{background:#27675F;border-color:#27675F;color:#fff}
  .tile.on img{filter:brightness(0) invert(1)}
  .tiles[data-kind="dept"]{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .tile.txt{min-height:44px;border-radius:999px;font-size:14px}
  .seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px}
  .pri-ico{width:22px;height:22px}
  .addp{border-radius:14px}
  .ic-cam{width:28px;height:28px;opacity:.75}
  .btn{border-radius:999px}
  .done-art{display:block;width:190px;height:auto;margin:0 auto 12px}
  .done h2{font-family:'Noto Serif TC',serif;font-weight:900;color:#092F25}
  /* 寬螢幕：左邊基本資料，右邊地點與設備 */
  @media (min-width:900px){
    .wrap{max-width:1180px;padding:0 20px 40px}
    #main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);column-gap:28px;align-items:start;
      grid-template-areas:"err err" "rep loc" "dept loc" "pri loc" "desc cat" "photo cat" "btn btn"}
    #main .banner{grid-area:err}
    .f-rep{grid-area:rep}.f-dept{grid-area:dept}.f-pri{grid-area:pri}.f-desc{grid-area:desc}.f-photo{grid-area:photo}
    .f-loc{grid-area:loc}.f-cat{grid-area:cat}
    #f_submit{grid-area:btn;max-width:420px;justify-self:center;margin-top:4px}
    #main .done{grid-column:1/-1}
    .tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  }
  @media (max-width:600px){
    .v-topbar{height:56px;padding:0 12px;gap:10px}
    body{padding-top:56px!important}
    .v-tb-logo{display:none}
    header{padding:14px 12px 14px 56px;min-height:80px}
    .r-art{right:0;opacity:.35;max-width:55%}
    h1{font-size:21px}
    .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
    .tile{min-height:78px;font-size:12.5px}
  }
</style>
</head>

var f = { reporter:'', org:'', dept:'', priority:'一般', location:'', category:'', desc:'', photos:[] };
// 預填報修人／機構（機構為入口網固定寫入的單一機構值，無 UI）
f.reporter = (localStorage.getItem('handover_name')||'').trim();
f.org = (localStorage.getItem('handover_org')||'').trim();

function t(k){ return (I18N[state.lang]&&I18N[state.lang][k]) || I18N.zh[k] || k; }
function optLabel(o){ return o[state.lang]||o.zh; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function pad2(n){ return n<10?'0'+n:''+n; }
function pad3(n){ return n<10?'00'+n:(n<100?'0'+n:''+n); }
function rocDate(d){ return (d.getFullYear()-1911)+'/'+pad2(d.getMonth()+1)+'/'+pad2(d.getDate()); }
function rocDateTime(d){ return rocDate(d)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function ticketPrefix(){ var d=new Date(); return 'R'+(d.getFullYear()-1911)+pad2(d.getMonth()+1)+'-'; }

/* ── 入口認證（統一登入）──
   token 來自入口網站登入後存的 portal_token；portal_exp（秒）已過期就視為未登入。
   過渡期（後端 AUTH_ENFORCE 未設）沒帶 token 後端照舊放行；切換日起後端只認 token。 */
function portalToken(){
  try{
    var tk=localStorage.getItem('portal_token')||'';
    if(!tk) return '';
    var exp=Number(localStorage.getItem('portal_exp')||0);
    if(exp && Date.now()/1000>exp) return '';
    return tk;
  }catch(e){ return ''; }
}
var _goingLogin=false;
function goLogin(){                       // unauthorized：憑證失效，導回入口登入頁
  if(_goingLogin) return; _goingLogin=true;
  try{ localStorage.removeItem('portal_token'); localStorage.removeItem('portal_exp'); }catch(e){}
  location.href='../index.html';
}
// 後端明確回覆的錯誤：不用重試（重試只會得到同樣答案）
var DEFINITE_ERR = {unauthorized:1, forbidden:1, conflict:1, bad_request:1};

/* ── 網路：POST text/plain（避開 CORS preflight），逾時＋重試一次 ── */
function api(payload){
  payload = Object.assign({ rootFolderId: ROOT }, payload);
  var tk = portalToken(); if(tk) payload.token = tk;       // token 放 POST body，不放網址
  var attempt = function(n){
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 60000) : null;
    return fetch(ENDPOINT, {
      method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload), signal: ctrl?ctrl.signal:undefined
    }).then(function(r){
      if(timer) clearTimeout(timer);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    }).then(function(txt){
      var o; try{ o=JSON.parse(txt); }catch(e){ throw new Error('bad json'); }
      if(o && o.error){ if(o.error==='unauthorized') goLogin(); throw new Error(o.error); }
      return o;
    }).catch(function(e){
      if(timer) clearTimeout(timer);
      if(e && DEFINITE_ERR[e.message]) throw e;
      if(n<1) return new Promise(function(res){ setTimeout(res,1200); }).then(function(){ return attempt(n+1); });
      throw e;
    });
  };
  return attempt(0);
}

/* ── 照片壓縮成 JPEG base64 ── */
function fileToJpeg(file, maxW){
  maxW=maxW||1280;
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height; if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(); };
    img.src=url;
  });
}

/* ── 畫面 ── */
function renderLangs(){
  var w=document.getElementById('langs'); w.innerHTML='';
  LANGS.forEach(function(p){
    var b=document.createElement('button'); b.textContent=p[1];
    if(p[0]===state.lang) b.className='on';
    b.onclick=function(){ state.lang=p[0]; try{localStorage.setItem('portal_lang',p[0]);}catch(e){} renderAll(); };
    w.appendChild(b);
  });
}

function optionsHtml(kind, cur){
  var html='<option value=""'+(cur?'':' selected')+' disabled>'+esc(t('choose'))+'</option>';
  OPTS[kind].forEach(function(o){
    html+='<option value="'+esc(o.v)+'"'+(o.v===cur?' selected':'')+'>'+esc(optLabel(o))+'</option>';
  });
  return html;
}

function renderForm(){
  var m=document.getElementById('main');
  m.innerHTML=
    '<div class="banner" id="err"></div>'+
    '<div class="field f-rep"><label>'+esc(t('reporter'))+'<span class="req">＊</span></label>'+
      '<input id="f_reporter" placeholder="'+esc(t('reporterPh'))+'" value="'+esc(f.reporter)+'"></div>'+
    '<div class="field f-dept"><label>'+esc(t('dept'))+'</label><select id="f_dept" class="as-tiles">'+optionsHtml('dept',f.dept)+'</select>'+tilesHtml('dept',f.dept,null)+'</div>'+
    '<div class="field f-pri"><label>'+esc(t('priority'))+'<span class="req">＊</span></label>'+
      '<div class="seg" id="f_seg">'+
        ['緊急','一般','低'].map(function(v){
          var lbl = v==='緊急'?t('pUrgent'):(v==='低'?t('pLow'):t('pNormal'));
          return '<button type="button" data-v="'+v+'" class="'+(f.priority===v?'on':'')+'"><img class="pri-ico" src="../assets/repair/urgency-'+(v==='緊急'?'high':v==='低'?'low':'normal')+'.webp" alt="">'+esc(lbl)+'</button>';
        }).join('')+
      '</div></div>'+
    '<div class="field f-loc"><label>'+esc(t('location'))+'<span class="req">＊</span></label><select id="f_location" class="as-tiles">'+optionsHtml('location',f.location)+'</select>'+tilesHtml('location',f.location,LOC_ICON)+'</div>'+
    '<div class="field f-cat"><label>'+esc(t('category'))+'<span class="req">＊</span></label><select id="f_category" class="as-tiles">'+optionsHtml('category',f.category)+'</select>'+tilesHtml('category',f.category,CAT_ICON)+'</div>'+
    '<div class="field f-desc"><label>'+esc(t('desc'))+'<span class="req">＊</span></label>'+
      '<textarea id="f_desc" placeholder="'+esc(t('descPh'))+'">'+esc(f.desc)+'</textarea></div>'+
    '<div class="field f-photo"><label>'+esc(t('photo'))+' <span style="color:var(--sub3);font-weight:500">'+esc(t('optional'))+'</span></label>'+
      '<div class="photos" id="f_photos"></div></div>'+
    '<button class="btn" id="f_submit">'+esc(t('submit'))+'</button>';

  document.getElementById('f_reporter').oninput=function(e){ f.reporter=e.target.value; };
  document.getElementById('f_dept').onchange=function(e){ f.dept=e.target.value; };
  document.getElementById('f_location').onchange=function(e){ f.location=e.target.value; };
  document.getElementById('f_category').onchange=function(e){ f.category=e.target.value; };
  document.getElementById('f_desc').oninput=function(e){ f.desc=e.target.value; };
  document.querySelectorAll('#f_seg button').forEach(function(b){
    b.onclick=function(){ document.querySelectorAll('#f_seg button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); f.priority=b.dataset.v; };
  });
  document.querySelectorAll('.tiles').forEach(function(box){
    var kind=box.getAttribute('data-kind'), sel=document.getElementById('f_'+kind);
    box.querySelectorAll('.tile').forEach(function(b){
      b.onclick=function(){ box.querySelectorAll('.tile').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
        f[kind]=b.getAttribute('data-v'); if(sel) sel.value=f[kind]; };
    });
  });
  document.getElementById('f_submit').onclick=submit;
  renderPhotos();
  if(state.err){ var e=document.getElementById('err'); e.textContent=t(state.err); e.classList.add('err'); }
}

function renderPhotos(){
  var box=document.getElementById('f_photos'); if(!box) return;
  box.innerHTML=f.photos.map(function(b64,i){
    return '<div class="p"><img src="data:image/jpeg;base64,'+b64+'"><button type="button" class="x" data-i="'+i+'">✕</button></div>';
  }).join('')+
  '<label class="addp"><img class="ic-cam" src="../assets/common/icon-camera.webp" alt="">'+esc(t('addPhoto'))+'<input type="file" accept="image/*" capture="environment" multiple style="display:none"></label>';
  var inp=box.querySelector('input[type=file]');
  inp.onchange=function(){
    var files=Array.prototype.slice.call(inp.files); if(!files.length) return;
    Promise.all(files.map(function(x){return fileToJpeg(x);})).then(function(b64s){ b64s.forEach(function(b){ f.photos.push(b); }); renderPhotos(); });
  };
  box.querySelectorAll('.x').forEach(function(b){ b.onclick=function(){ f.photos.splice(Number(b.dataset.i),1); renderPhotos(); }; });
}

function renderDone(){
  var m=document.getElementById('main');
  m.innerHTML=
    '<div class="done">'+
      '<img class="done-art" src="../assets/repair/state-sent.webp" alt="">'+
      '<h2>'+esc(t('okTitle'))+'</h2>'+
      '<p>'+esc(t('okMsg'))+'</p>'+
      '<div class="no">'+esc(state.done)+'</div><br>'+
      '<button class="btn" id="d_again" style="max-width:260px;margin:0 auto">'+esc(t('again'))+'</button>'+
    '</div>';
  document.getElementById('d_again').onclick=function(){
    // 保留報修人，其餘清空
    f={ reporter:f.reporter, dept:'', priority:'一般', location:'', category:'', desc:'', photos:[] };
    state.done=null; state.err=''; renderForm(); window.scrollTo(0,0);
  };
}

function renderAll(){
  document.documentElement.lang = state.lang==='zh'?'zh-Hant':state.lang;
  document.getElementById('title').childNodes[0].nodeValue = t('title');
  document.getElementById('subtitle').textContent = t('subtitle');
  document.title = t('title');
  renderLangs();
  if(state.done) renderDone(); else renderForm();
}

function showErr(key){ state.err=key; var e=document.getElementById('err'); if(e){ e.textContent=t(key); e.classList.add('err'); window.scrollTo(0,0);} }   // key＝I18N 的訊息代碼，切換語言時會跟著換

function submit(){
  if(state.submitting || !document.getElementById('f_reporter')) return;
  // 讀最新值
  f.reporter=(document.getElementById('f_reporter').value||'').trim();
  f.desc=(document.getElementById('f_desc').value||'').trim();
  state.err='';
  if(!f.reporter) return showErr('eReporter');
  if(!f.location) return showErr('eLoc');
  if(!f.category) return showErr('eCat');
  if(!f.desc) return showErr('eDesc');

  state.submitting=true;
  var btn=document.getElementById('f_submit'); btn.disabled=true; btn.textContent=t('sending');
  var now=new Date();
  // 先取單號，再送出（與完整版一致）。兩人同時取到同一個單號時，後端對後送的回 conflict：
  // 這裡自動重新取一次單號再送（最多一次），使用者不會看到錯誤。
  function send(retried){ return api({action:'nextSeq'}).then(function(res){
    var seq=(res&&res.nextSeq)||1;
    var no=ticketPrefix()+pad3(seq);
    var pIcon=f.priority==='緊急'?'🔴 緊急':(f.priority==='低'?'🟢 低':'🟡 一般');
    var hasPhoto=f.photos.length>0;
    var notify='🔧'+(f.priority==='緊急'?'【緊急】':' ')+'維修報修 '+no+'｜'+(f.org?f.org+'・':'')+f.location+'・'+f.category+
      '\n\n'+(f.org?'機　　構：'+f.org+'\n':'')+
      '報修單號：'+no+
      '\n急迫程度：'+pIcon+
      '\n報修時間：'+rocDateTime(now)+
      '\n部　　門：'+(f.dept||'—')+
      '\n地　　點：'+f.location+
      '\n設備類別：'+f.category+
      '\n報 修 人：'+f.reporter+
      '\n\n📝 問題描述\n'+f.desc+
      (hasPhoto?'\n\n📎 現況照請見附件':'');
    var ticket={
      no:no, date:rocDate(now), reporter:f.reporter, org:f.org, dept:f.dept, location:f.location,
      category:f.category, desc:f.desc, priority:f.priority, status:'待處理',
      assignee:'', method:'', vendor:'', cost:'', doneDate:'', note:'',
      updated:rocDateTime(now),
      log:[{t:rocDateTime(now), who:f.reporter, act:'建立報修單'}]
    };
    var photos=f.photos.map(function(b){ return {data:b, stage:'before'}; });
    return api({action:'upload', ticketNo:no, ticket:ticket, photos:photos, photoMode:'append',
                notifyText:notify, notifyPhoto:hasPhoto, notifyStage:'before'})
      .then(function(){ state.submitting=false; state.done=no; renderDone(); window.scrollTo(0,0); });
  }).catch(function(e){
    if(e && e.message==='conflict' && !retried) return send(true);
    throw e;
  }); }
  send(false).catch(function(e){
    state.submitting=false;
    btn.disabled=false; btn.textContent=t('submit');
    var code=e&&e.message;
    if(code==='unauthorized') return;                 // api() 已導回入口登入頁
    showErr(code==='forbidden' ? 'eForbidden' : 'eSend');
  });
}

renderAll();
</script>
