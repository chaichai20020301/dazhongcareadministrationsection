<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>總務維修申請系統</title>
<style>
  :root{
    --bg:#f4f3ef; --panel:#fff; --ink:#252a26; --ink2:#3c443d; --sub:#8b918a; --line:#e6e4dd; --line2:#efedE7;
    --brand:#2f6b3a; --brand-d:#245530; --brand-l:#eaf0e6; --brand-t:#3d6b45;
    --urgent:#9b2f28; --urgent-l:#f7edec;
    --amber:#c48a1e; --amber-l:#fbf3e2;
    --blue:#3a5f88; --blue-l:#eceff4;
    --mono:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC",BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;text-wrap:pretty}
  .wrap{max-width:760px;margin:0 auto;min-height:100vh}

  /* 頁首：白底細線，綠色只當重點色 */
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
    padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:14px}
  header .brand-logo{height:38px;flex-shrink:0;display:flex;align-items:center;overflow:hidden;max-width:44vw}
  header .brand-logo svg,header .brand-logo img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
  header .htxt{flex:1;min-width:0}
  header .title{font-size:19px;font-weight:600;letter-spacing:.5px;line-height:1.2;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sub{font-size:12px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:420px){ header .sub{display:none} header .brand-logo{max-width:40vw} }
  header button{background:#fff;border:1px solid var(--line);color:var(--ink2);padding:8px 14px;border-radius:6px;font-size:14px;font-weight:500;font-family:inherit;transition:.12s}
  header button:hover{border-color:#d5d2c9;background:#faf9f6}
  header button:active{background:#f1efe9}
  #btnRefresh{display:inline-flex;align-items:center;gap:4px}
  #btnRefresh .ri{display:inline-block;font-size:15px;line-height:1}
  #btnRefresh.spin .ri{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#btnRefresh.spin .ri{animation:none}}
  @media (max-width:520px){ #btnRefresh{padding:8px 10px} #btnRefresh .rt{display:none} }
  .cloud{font-size:11.5px;padding:4px 9px;border-radius:4px;background:#f4f3ef;color:var(--sub);white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:5px;letter-spacing:.3px}
  .cloud::before{content:"";width:5px;height:5px;border-radius:50%;background:#c3c0b8}
  .cloud.ok{background:var(--brand-l);color:var(--brand-t)}.cloud.ok::before{background:var(--brand)}
  .cloud.bad{background:var(--urgent-l);color:var(--urgent)}.cloud.bad::before{background:var(--urgent)}

  main{padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--sub);font-weight:500;margin:0 0 7px;letter-spacing:.3px}
  input,select,textarea{width:100%;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:6px;padding:11px 12px;background:#fff;color:var(--ink);transition:.12s}
  input:hover,select:hover,textarea:hover{border-color:#d5d2c9}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,58,.09)}
  textarea{resize:vertical;min-height:88px;line-height:1.6}
  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:0}
  .row{display:flex;gap:10px}.row>*{flex:1}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--brand);border-radius:6px;padding:13px 18px;font-size:15.5px;font-weight:600;font-family:inherit;letter-spacing:.5px;color:#fff;width:100%;background:var(--brand);transition:.12s}
  .btn:hover{background:var(--brand-d);border-color:var(--brand-d)}
  .btn:active{background:#1e4527}
  .btn.sec{background:#fff;color:var(--ink2);border-color:var(--line)}
  .btn.sec:hover{background:#faf9f6;border-color:#d5d2c9}
  .btn.danger{background:#fff;color:var(--urgent);border-color:#e4d3d1}
  .btn.sm{width:auto;padding:9px 14px;font-size:14px}
  .btnrow{display:flex;gap:12px}.btnrow>*{flex:1}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* 急迫程度 */
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:11px;font-size:15px;font-weight:500;font-family:inherit;color:var(--ink2);transition:.12s}
  .seg button:hover{border-color:#d5d2c9}
  .seg button.on[data-v="緊急"]{background:var(--urgent);border-color:var(--urgent);color:#fff}
  .seg button.on[data-v="一般"]{background:var(--blue);border-color:var(--blue);color:#fff}
  .seg button.on[data-v="低"]{background:#6f756e;border-color:#6f756e;color:#fff}

  /* chip */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:5px;padding:8px 13px;font-size:14px;font-family:inherit;color:var(--ink2);transition:.12s;font-weight:400}
  .chip:hover{border-color:#d5d2c9;background:#faf9f6}
  .chip.on{background:var(--brand-l);border-color:#bfd3b8;color:var(--brand-t);font-weight:600}
  .chip.add{border-style:dashed;color:var(--sub)}

  /* 照片 */
  .photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:8px}
  .photo{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#f4f3ef;border:1px solid var(--line)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .del{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:4px;background:rgba(25,28,25,.62);color:#fff;border:0;font-size:13px;line-height:24px;text-align:center}
  .addphoto{aspect-ratio:1;border:1px dashed #d5d2c9;border-radius:6px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:13px;font-weight:500;transition:.12s}
  .addphoto:hover{border-color:var(--brand);color:var(--brand-t)}
  .addphoto span.ic{font-size:20px;font-weight:400;line-height:1}

  /* 清單 */
  .toolbar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
  .tab{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 15px;font-size:14px;font-weight:500;font-family:inherit;color:var(--ink2);white-space:nowrap;transition:.12s}
  .tab:hover{border-color:#d5d2c9;background:#faf9f6}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .tab .n{opacity:.6;font-weight:500;margin-left:6px;font-family:var(--mono);font-size:12.5px}
  .tab.on .n{opacity:.75}
  .search{margin-bottom:14px}
  .search input{background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' fill='none' stroke='%238b918a' stroke-width='1.6'><circle cx='8' cy='8' r='6'/><path d='M13 13l4 4'/></svg>") no-repeat 13px center;padding-left:40px;font-size:15px}

  .ticket{background:var(--panel);border:1px solid var(--line);border-left:3px solid #d8d5cd;border-radius:8px;padding:16px 18px;margin-bottom:10px;transition:.12s;cursor:pointer}
  .ticket:hover{border-color:#d5d2c9;background:#fffefb}
  .ticket.p緊急{border-left-color:var(--urgent)}
  .ticket.p一般{border-left-color:var(--blue)}
  .ticket.p低{border-left-color:#c3c0b8}
  .ticket .top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .ticket .no{font-size:12.5px;color:var(--sub);font-weight:500;font-family:var(--mono);letter-spacing:.3px}
  .ticket .st{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:4px;margin-left:auto;letter-spacing:.5px}
  .st.待處理{background:var(--amber-l);color:var(--amber)}
  .st.處理中{background:var(--blue-l);color:var(--blue)}
  .st.已完成{background:var(--brand-l);color:var(--brand-t)}
  .ticket .desc{font-weight:500;font-size:16px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
  .ticket .meta{font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:3px 8px;align-items:baseline}
  .ticket .meta .sep{color:#d5d2c9}
  .ticket .meta .mono{font-family:var(--mono);font-size:12.5px}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;letter-spacing:.5px}
  .badge.緊急{background:var(--urgent-l);color:var(--urgent);border:1px solid #ebd8d6}
  .empty{text-align:center;color:var(--sub);padding:64px 20px;background:#fff;border:1px solid var(--line);border-radius:10px}
  .empty .ic{font-size:15px;letter-spacing:2px;color:#c3c0b8}

  /* 詳情列 */
  .kv{display:flex;padding:11px 0;border-bottom:1px solid var(--line2);font-size:15px}
  .kv:last-child{border-bottom:0}
  .kv .k{width:92px;color:var(--sub);flex-shrink:0;font-size:13.5px}
  .kv .v{flex:1;font-weight:400;color:var(--ink2)}

  /* 主要動作鍵 */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;color:#fff;border:1px solid var(--brand-d);border-radius:8px;padding:15px 34px;font-size:16px;font-weight:600;font-family:inherit;letter-spacing:1px;
    background:var(--brand);box-shadow:0 6px 20px rgba(37,42,38,.16);transition:.12s}
  .fab:hover{background:var(--brand-d)}
  .fab:active{background:#1e4527}

  /* 概況面板：標籤左、數字右 */
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 20px 8px;margin-bottom:16px}
  .stat .box{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line2)}
  .stat .box:last-child{border-bottom:0}
  .stat .lb{font-size:14.5px;color:var(--ink2);letter-spacing:.3px}
  .stat .num{font-size:26px;font-weight:600;color:var(--brand);line-height:1;font-family:var(--mono);letter-spacing:-.5px}
  .stat .box.warn .num{color:var(--amber)}

  .hint{font-size:12.5px;color:var(--sub);margin-top:7px;line-height:1.55}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#252a26;color:#fff;padding:11px 18px;border-radius:6px;font-size:14px;z-index:100;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .divider{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:1px;margin:20px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line2)}
  .hidden{display:none!important}
  a{color:var(--brand-t)}
  a:hover{color:var(--brand-d)}
  a.link{color:var(--brand-t);text-decoration:none;font-weight:600}
  ::selection{background:var(--brand-l)}

  /* ===== 響應式：寬螢幕（橫式顯示器）自動變多欄 ===== */
  @media (min-width:900px){
    .wrap{max-width:1140px}
    header{padding-left:24px;padding-right:24px}
    main{padding:24px}

    /* 清單頁：統計橫排、報修單多欄 */
    body[data-view="list"] .stat{display:grid;grid-template-columns:repeat(4,1fr);padding:0;overflow:hidden}
    body[data-view="list"] .stat .box{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;
      padding:16px 22px;border-bottom:0;border-right:1px solid var(--line2)}
    body[data-view="list"] .stat .box:last-child{border-right:0}
    body[data-view="list"] .stat .num{font-size:30px}

    #listBody{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
    #listBody .ticket{margin-bottom:0;height:100%}
    #listBody .empty{grid-column:1/-1}

    /* 表單／詳情／設定：維持好讀欄寬並置中，不要撐滿整個寬螢幕 */
    body[data-view="form"] main,
    body[data-view="detail"] main,
    body[data-view="settings"] main{max-width:780px;margin:0 auto}

    /* 詳情頁的照片區在寬螢幕排更多張 */
    body[data-view="detail"] .photogrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  }

  /* 超寬螢幕：報修單三欄以上、統計與清單再寬一點 */
  @media (min-width:1400px){
    .wrap{max-width:1320px}
  }
</style>
</head>

<script>
(function(){
  var NAME=""; try{ NAME=(localStorage.getItem("handover_name")||"").trim(); }catch(e){}
  if(!NAME) return;
  var SEL=['#f_reporter','input[placeholder*="點收並製表"]'];
  var done=[];
  function seen(el){ return done.indexOf(el)>=0; }
  function tick(){
    for(var i=0;i<SEL.length;i++){
      var list; try{ list=document.querySelectorAll(SEL[i]); }catch(e){ continue; }
      for(var j=0;j<list.length;j++){
        var el=list[j];
        if(seen(el)) continue;
        if((el.value||"").trim()!==""){ continue; }
        try{ var p=(el.tagName==="TEXTAREA")?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;
          Object.getOwnPropertyDescriptor(p,"value").set.call(el, NAME);
        }catch(e){ el.value=NAME; }
        el.dispatchEvent(new Event("input",{bubbles:true}));
        el.dispatchEvent(new Event("change",{bubbles:true}));
        if((el.value||"").trim()===NAME) done.push(el);
      }
    }
  }
  setInterval(tick, 400);
  if(document.readyState!=="loading") tick();
  document.addEventListener("DOMContentLoaded",tick);
})();
</script>

<script>
"use strict";
/* ============================================================
   總務維修申請系統 — 前端
   資料流：localStorage 為主（可離線）；有設定 Apps Script 就同步雲端
   ============================================================ */

var LS = {
  cfg: 'wx_cfg',        // { url, folderId, notifyUrl }
  opts: 'wx_opts',      // { locations:[], categories:[], depts:[], assignees:[] }
  tickets: 'wx_tickets',// 快取的報修單陣列
  seq: 'wx_seq'         // 快取的下一個流水號
};

// 機構 → 部門（連動）；地點、設備類別改為自由填寫。可在設定頁維護。
var DEFAULT_OPTS = {
  institutions: ['線東大眾護理之家'],
  deptsByOrg: {
    '線東大眾護理之家': ['護理組','照服組','行政組','營養/廚房','社工','復健','其他']
  }
};

// ===== 內建連線設定（寫死，發給同仁時免進設定填）=====
// 要換後端或資料夾時，改這兩行即可；留空字串則回到「設定頁自行填」模式。
var BUILTIN_URL    = 'https://script.google.com/macros/s/AKfycbwKWNcegoY9JxOjjp8kuNvTw9mhbtHnDkhXyR3glfYRK8Al19nW1ta0zrdie4R8FW-n3w/exec';
var BUILTIN_FOLDER = '1zVC4RGZOrBvfG0ohcX1LZQdJoQfupXx3';

var state = {
  cfg: (function(){
    var c = load(LS.cfg, {url:'', folderId:'', notifyUrl:''});
    if(BUILTIN_URL)    c.url = BUILTIN_URL;        // 內建值優先，確保每台裝置都指到同一後端
    if(BUILTIN_FOLDER) c.folderId = BUILTIN_FOLDER;
    return c;
  })(),
  opts: mergeOpts(load(LS.opts, null)),
  tickets: load(LS.tickets, []),
  seq: load(LS.seq, 1),
  view: 'list',      // list | form | detail | settings
  filter: 'all',
  current: null      // 詳情中的單號
};

function mergeOpts(saved){
  var d = JSON.parse(JSON.stringify(DEFAULT_OPTS));
  if(!saved) return d;
  var o = {
    institutions: (Array.isArray(saved.institutions) && saved.institutions.length) ? saved.institutions.slice() : d.institutions.slice(),
    deptsByOrg: (saved.deptsByOrg && typeof saved.deptsByOrg==='object') ? JSON.parse(JSON.stringify(saved.deptsByOrg)) : {}
  };
  // 舊格式相容：只有舊的扁平 depts → 套到第一間機構
  if(!saved.deptsByOrg && Array.isArray(saved.depts)){ o.deptsByOrg[o.institutions[0]] = saved.depts.slice(); }
  // 確保每間機構都有部門陣列（新機構預設沿用第一間的清單，方便起步）
  o.institutions.forEach(function(org){ if(!Array.isArray(o.deptsByOrg[org])) o.deptsByOrg[org] = (d.deptsByOrg[org]||d.deptsByOrg[d.institutions[0]]||[]).slice(); });
  return o;
}
function load(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2200); }

/* ---------- 民國日期 ---------- */
function rocDate(d){ d=d||new Date(); return (d.getFullYear()-1911)+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate()); }
function rocDateTime(d){ d=d||new Date(); return rocDate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function pad(n){ return n<10?'0'+n:''+n; }
function ticketPrefix(){ var d=new Date(); return 'R'+(d.getFullYear()-1911)+pad(d.getMonth()+1)+'-'; }

/* ---------- 雲端 ---------- */
function cloudReady(){ return !!(state.cfg.url && state.cfg.folderId); }
function setCloud(status,txt){
  var el=document.getElementById('cloud');
  el.className='cloud'+(status?' '+status:'');
  el.textContent=txt;
}
function api(payload){
  return fetch(state.cfg.url,{
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // 避開 CORS preflight
    body:JSON.stringify(Object.assign({rootFolderId:state.cfg.folderId},payload))
  }).then(function(r){ return r.json(); });
}

function syncLoad(){
  if(!cloudReady()){ setCloud('bad','未設定'); return Promise.resolve(); }
  setCloud('', '同步中…');
  return api({action:'load'}).then(function(res){
    if(res && res.tickets){
      state.tickets = res.tickets;
      state.seq = res.nextSeq || 1;
      save(LS.tickets, state.tickets);
      save(LS.seq, state.seq);
      setCloud('ok','雲端已同步');
      if(state.view==='list') render();
    } else { setCloud('bad','讀取失敗'); }
  }).catch(function(){ setCloud('bad','連線失敗'); });
}

/* 送出/更新一張單（含照片）到雲端 */
function pushTicket(ticket, photos, photoMode, notifyText, notifyPhoto, video, notifyStage){
  // 先寫本地
  upsertLocal(ticket);
  if(!cloudReady()){ toast('已存本機（雲端未設定）'); return Promise.resolve({local:true}); }
  setCloud('','儲存中…');
  // 通知交給後端在同一次上傳處理：notifyStage='before' 夾現況照、'done' 夾完工後照片。未設定通知則自動略過
  return api({action:'upload', ticketNo:ticket.no, ticket:ticket, photos:photos||[], photoMode:photoMode||'append', notifyText:notifyText||'', notifyPhoto:!!notifyPhoto, notifyStage:notifyStage||'', video:video||null})
    .then(function(res){
      if(res && !res.error){
        setCloud('ok','雲端已同步');
        return res;
      }
      setCloud('bad','儲存失敗'); toast('雲端儲存失敗：'+(res&&res.error||'')); return res;
    })
    .catch(function(){ setCloud('bad','連線失敗'); toast('雲端連線失敗，已存本機'); return {local:true}; });
}

function upsertLocal(t){
  var i = state.tickets.findIndex(function(x){return x.no===t.no;});
  if(i>=0) state.tickets[i]=t; else state.tickets.unshift(t);
  save(LS.tickets, state.tickets);
}

/* ---------- 照片壓縮 ---------- */
function fileToJpeg(file, maxW){
  maxW = maxW||1280;
  return new Promise(function(resolve,reject){
    var img=new Image(); var url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      var dataUrl=cv.toDataURL('image/jpeg',0.82);
      resolve(dataUrl.split(',')[1]); // 純 base64
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(); };
    img.src=url;
  });
}

/* ============================================================
   畫面
   ============================================================ */
function render(){
  var m=document.getElementById('main');
  document.body.setAttribute('data-view', state.view); // 供響應式 CSS 依頁面調整版面
  document.getElementById('fab').classList.toggle('hidden', state.view!=='list');
  if(state.view==='list') return renderList(m);
  if(state.view==='form') return renderForm(m);
  if(state.view==='detail') return renderDetail(m);
  if(state.view==='settings') return renderSettings(m);
}

/* ---------- 清單 / 看板 ---------- */
function renderList(m){
  document.getElementById('hTitle').textContent='維修申請系統';
  var counts={all:state.tickets.length,待處理:0,處理中:0,已完成:0};
  state.tickets.forEach(function(t){ if(counts[t.status]!=null) counts[t.status]++; });

  var tabs=[['all','全部'],['待處理','待處理'],['處理中','處理中'],['已完成','已完成']];
  var toolbar='<div class="toolbar">'+tabs.map(function(t){
    return '<button class="tab '+(state.filter===t[0]?'on':'')+'" data-f="'+t[0]+'">'+t[1]+'<span class="n">'+counts[t[0]]+'</span></button>';
  }).join('')+'</div>';

  var search='<div class="search"><input id="q" placeholder="搜尋 單號 / 地點 / 描述 / 報修人" value="'+esc(state._q||'')+'"></div>';

  // 統計（本月費用）
  var monthPrefix=ticketPrefix();
  var monthCost=0, monthN=0;
  state.tickets.forEach(function(t){ if(String(t.no).indexOf(monthPrefix)===0){ monthN++; monthCost+=Number(t.cost)||0; } });
  var stat='<div class="stat">'+
    '<div class="box'+(counts.待處理?' warn':'')+'"><div class="lb">待處理</div><div class="num">'+counts.待處理+'</div></div>'+
    '<div class="box"><div class="lb">處理中</div><div class="num">'+counts.處理中+'</div></div>'+
    '<div class="box"><div class="lb">本月報修</div><div class="num">'+monthN+'</div></div>'+
    '<div class="box"><div class="lb">本月維修費</div><div class="num">$'+monthCost.toLocaleString()+'</div></div>'+
    '</div>';

  var list=filteredTickets();
  var body;
  if(!list.length){
    body='<div class="empty"><div class="ic">— — —</div><div style="margin-top:14px;font-size:15px">目前沒有報修單</div><div class="hint">點下方「＋ 我要報修」開始</div></div>';
  } else {
    body=list.map(ticketCard).join('');
  }
  m.innerHTML=stat+toolbar+search+'<div id="listBody">'+body+'</div>';

  m.querySelectorAll('.tab').forEach(function(b){ b.onclick=function(){ state.filter=b.dataset.f; render(); }; });
  var q=document.getElementById('q');
  q.oninput=function(){ state._q=q.value; document.getElementById('listBody').innerHTML=(filteredTickets().map(ticketCard).join('')||'<div class="empty"><div class="ic">— — —</div><div style="margin-top:14px;font-size:15px">找不到符合的報修單</div></div>'); bindCards(); };
  bindCards();
}
function bindCards(){
  document.querySelectorAll('.ticket').forEach(function(c){ c.onclick=function(){ state.current=c.dataset.no; state.view='detail'; render(); window.scrollTo(0,0); }; });
}
function filteredTickets(){
  var order={待處理:0,處理中:1,已完成:2};
  var prio={緊急:0,一般:1,低:2};
  var q=(state._q||'').trim().toLowerCase();
  return state.tickets.filter(function(t){
    if(state.filter!=='all' && t.status!==state.filter) return false;
    if(q){
      var hay=(t.no+' '+t.location+' '+t.desc+' '+t.reporter+' '+t.category+' '+t.vendor).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort(function(a,b){
    if(order[a.status]!==order[b.status]) return order[a.status]-order[b.status];
    if(prio[a.priority]!==prio[b.priority]) return (prio[a.priority]||1)-(prio[b.priority]||1);
    return a.no<b.no?1:-1; // 新的在前
  });
}
function ticketCard(t){
  return '<div class="ticket p'+esc(t.priority||'一般')+'" data-no="'+esc(t.no)+'">'+
    '<div class="top"><span class="no">'+esc(t.no)+'</span>'+
      (t.priority==='緊急'?'<span class="badge 緊急">緊急</span>':'')+
      '<span class="st '+esc(t.status)+'">'+esc(t.status)+'</span></div>'+
    '<div class="desc">'+esc(t.desc||'(無描述)')+'</div>'+
    '<div class="meta">'+(t.org?'<span>'+esc(t.org)+'</span><span class="sep">·</span>':'')+'<span>'+esc(t.location||'-')+'</span><span class="sep">·</span><span>'+esc(t.category||'-')+'</span>'+
      '<span class="sep">·</span><span>'+esc(t.reporter||'-')+'</span>'+
      '<span class="sep">·</span><span class="mono">'+esc(t.date||'-')+'</span>'+
      (Number(t.cost)>0?'<span class="sep">·</span><span class="mono">$'+Number(t.cost).toLocaleString()+'</span>':'')+
    '</div></div>';
}

function deleteTicketFlow(t){
  if(!confirm('確定刪除報修單 '+t.no+'？\n照片與影片也會一併刪除，且無法復原。')) return;
  // 先移除本機
  var i=state.tickets.findIndex(function(x){return x.no===t.no;});
  if(i>=0){ state.tickets.splice(i,1); save(LS.tickets,state.tickets); }
  // 再刪雲端（資料列＋資料夾），失敗不擋，本機已移除
  if(cloudReady()){
    api({action:'deleteTicket', no:t.no, alsoFiles:true}).catch(function(){});
  }
  toast('已刪除 '+t.no);
  state.view='list'; render(); window.scrollTo(0,0);
}

function saveDetail(t){
  var old=t.status;
  var ns=document.getElementById('d_status').value;
  t.status=ns;
  t.method=document.getElementById('d_method').value;
  t.vendor=document.getElementById('d_vendor').value.trim();
  var c=document.getElementById('d_cost').value;
  t.cost=(c===''?'':Number(c)||0);
  t.note=document.getElementById('d_note').value.trim();
  var now=new Date();
  t.updated=rocDateTime(now);
  var acts=[];
  if(ns!==old) acts.push('狀態→'+ns);
  if(ns==='已完成' && !t.doneDate){ t.doneDate=rocDate(now); acts.push('完工'); }
  t.log=t.log||[]; t.log.push({t:rocDateTime(now), who:'總務', act:acts.length?acts.join('、'):'更新資料'});

  var notify=null;
  if(ns==='已完成' && old!=='已完成'){
    notify='✅ 維修完工 '+t.no+'｜'+(t.org?t.org+'・':'')+t.location+
      '\n\n'+(t.org?'機　　構：'+t.org+'\n':'')+
      '報修單號：'+t.no+
      '\n完工時間：'+t.updated+
      '\n地　　點：'+t.location+
      '\n設備類別：'+t.category+
      '\n處理方式：'+(t.method||'—')+(t.vendor?'（'+t.vendor+'）':'')+
      '\n維修費用：'+(Number(t.cost)>0?'$'+Number(t.cost).toLocaleString():'—')+
      '\n\n📝 原報修問題\n'+t.desc+
      (t.note?'\n\n🔧 處理說明\n'+t.note:'')+
      '\n\n📎 完工照片請見附件';
  }
  document.getElementById('d_save').textContent='儲存中…';
  pushTicket(t, [], 'append', notify, false, null, 'done').then(function(){
    toast('已更新'); state.view='detail'; render(); window.scrollTo(0,0);
  });
}

/* 詳情照片：讀雲端 + 可加拍 */
function loadDetailPhotos(no){
  var hint=document.getElementById('ph_hint');
  function paint(photos){
    var groups={before:[],done:[],receipt:[]};
    photos.forEach(function(p){ (groups[p.stage]||groups.before).push(p); });
    ['before','done','receipt'].forEach(function(stage){
      var el=document.getElementById('ph_'+stage);
      el.innerHTML=groups[stage].map(function(p){
        return '<div class="photo"><img src="data:image/jpeg;base64,'+p.data+'">'+
          '<button class="del" data-file="'+esc(p.fileName)+'">✕</button></div>';
      }).join('')+
      '<label class="addphoto"><span class="ic">＋</span>加拍<input type="file" accept="image/*" capture="environment" multiple style="display:none" data-stage="'+stage+'"></label>';
    });
    bindDetailPhotoInputs(no);
    hint.textContent=photos.length?'':'尚無照片，點「加拍」新增';
  }
  function paintVideo(url){
    var el=document.getElementById('detail_video'); if(!el) return;
    el.innerHTML=(url
        ? '<a class="link" href="'+esc(url)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--brand-l);font-weight:700">▶ 查看影片</a> '
        : '')+
      '<label style="display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:10px;background:#fafafa;color:var(--sub);font-weight:600;cursor:pointer">🎥 '+(url?'更換影片':'上傳影片')+'<input type="file" accept="video/*" capture="environment" style="display:none" id="detail_vid_input"></label>';
    var vi=document.getElementById('detail_vid_input');
    if(vi) vi.onchange=function(){
      var f=vi.files&&vi.files[0]; if(!f) return;
      var mb=f.size/1048576;
      if(mb>MAX_VIDEO_MB){ toast('影片太大（'+mb.toFixed(1)+'MB，上限'+MAX_VIDEO_MB+'MB）'); vi.value=''; return; }
      if(!cloudReady()) return toast('雲端未設定，無法上傳');
      toast('影片上傳中…（檔案較大請稍候）');
      var r=new FileReader();
      r.onload=function(){
        api({action:'upload', ticketNo:no, video:{data:String(r.result).split(',')[1], type:f.type||'video/mp4'}})
          .then(function(){ toast('影片已上傳'); loadDetailPhotos(no); });
      };
      r.readAsDataURL(f);
    };
  }
  if(!cloudReady()){ hint.textContent='雲端未設定，無法讀取/上傳照片'; paint([]); paintVideo(null); return; }
  api({action:'photos', ticketNo:no}).then(function(res){
    if(res && res.photos){ paint(res.photos); paintVideo(res.video||null); }
    else { hint.textContent='照片讀取失敗'; paint([]); paintVideo(null); }
  }).catch(function(){ hint.textContent='照片連線失敗'; paint([]); paintVideo(null); });
}
function bindDetailPhotoInputs(no){
  document.querySelectorAll('#ph_before input,#ph_done input,#ph_receipt input').forEach(function(inp){
    inp.onchange=function(){
      var stage=inp.dataset.stage;
      var files=Array.prototype.slice.call(inp.files);
      if(!files.length) return;
      if(!cloudReady()) return toast('雲端未設定，無法上傳');
      toast('照片上傳中…');
      Promise.all(files.map(function(f){return fileToJpeg(f);})).then(function(b64s){
        return api({action:'upload', ticketNo:no, photos:b64s.map(function(b){return{data:b,stage:stage};}), photoMode:'append'});
      }).then(function(){ toast('照片已上傳'); loadDetailPhotos(no); });
    };
  });
  document.querySelectorAll('#ph_before .del,#ph_done .del,#ph_receipt .del').forEach(function(b){
    b.onclick=function(){
      if(!confirm('刪除這張照片？')) return;
      api({action:'deletePhoto', ticketNo:no, fileName:b.dataset.file}).then(function(){ toast('已刪除'); loadDetailPhotos(no); });
    };
  });
}

   '<div class="card"><div class="hint" style="margin:0">「地點」「設備類別」由同仁報修時自由填寫，不需在此設定。</div></div>'+
   '<div style="height:16px"></div>';

  document.getElementById('s_back').onclick=function(){ state.view='list'; render(); };
  document.getElementById('s_reload').onclick=function(){ toast('重新讀取中…'); syncLoad().then(function(){ toast('已重新讀取'); }); };
  bindEditors();
}
/* role='org'（機構清單）或 'dept'（某機構的部門，orgidx 指向機構索引） */
function chipsEditorHtml(role, orgidx, arr, placeholder){
  var meta='data-role="'+role+'"'+(orgidx==null?'':' data-orgidx="'+orgidx+'"');
  return '<div class="chips">'+
      (arr||[]).map(function(v){return '<span class="chip on">'+esc(v)+'<button style="border:0;background:none;margin-left:7px;color:var(--sub);font-weight:600;font-family:inherit" '+meta+' data-del="'+esc(v)+'">✕</button></span>';}).join('')+
    '</div>'+
    '<div class="row" style="margin-top:10px"><input class="edit-new" placeholder="'+placeholder+'"><button class="btn sm" '+meta+' data-add="1">加入</button></div>';
}
function bindEditors(){
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick=function(){
      var role=b.dataset.role, val=b.dataset.del;
      if(role==='org'){
        state.opts.institutions=state.opts.institutions.filter(function(x){return x!==val;});
        delete state.opts.deptsByOrg[val];
      }else{
        var org=state.opts.institutions[Number(b.dataset.orgidx)];
        state.opts.deptsByOrg[org]=(state.opts.deptsByOrg[org]||[]).filter(function(x){return x!==val;});
      }
      save(LS.opts,state.opts); renderSettings(document.getElementById('main'));
    };
  });
  document.querySelectorAll('[data-add]').forEach(function(b){
    b.onclick=function(){
      var role=b.dataset.role;
      var inp=b.parentNode.querySelector('.edit-new'); var v=(inp.value||'').trim(); if(!v) return;
      if(role==='org'){
        if(state.opts.institutions.indexOf(v)<0){ state.opts.institutions.push(v); if(!state.opts.deptsByOrg[v]) state.opts.deptsByOrg[v]=(DEFAULT_OPTS.deptsByOrg[DEFAULT_OPTS.institutions[0]]||[]).slice(); }
      }else{
        var org=state.opts.institutions[Number(b.dataset.orgidx)];
        if(!state.opts.deptsByOrg[org]) state.opts.deptsByOrg[org]=[];
        if(state.opts.deptsByOrg[org].indexOf(v)<0) state.opts.deptsByOrg[org].push(v);
      }
      save(LS.opts,state.opts); renderSettings(document.getElementById('main'));
    };
  });
}

/* ---------- 共用小元件 ---------- */
function kv(k,v){ return '<div class="kv"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
function opt(arr,cur){ return arr.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>';}).join(''); }
function segHtml(cur){
  return '<div class="seg" id="seg">'+['緊急','一般','低'].map(function(v){
    return '<button type="button" data-v="'+v+'" class="'+(v===cur?'on':'')+'">'+v+'</button>';
  }).join('')+'</div>';
}
function bindSeg(cb){
  var seg=document.getElementById('seg'); if(!seg) return;
  seg.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); cb(b.dataset.v); };
  });
}
function photoBox(stage,arr){
  return '<div class="photogrid" id="pbox_'+stage+'">'+
    arr.map(function(b64,i){return '<div class="photo"><img src="data:image/jpeg;base64,'+b64+'"><button type="button" class="del" data-i="'+i+'">✕</button></div>';}).join('')+
    '<label class="addphoto"><span class="ic">＋</span>拍照 / 選圖<input type="file" accept="image/*" capture="environment" multiple style="display:none"></label>'+
   '</div>';
}
function bindPhotoBox(stage,arr,rerender){
  var box=document.getElementById('pbox_'+stage); if(!box) return;
  var inp=box.querySelector('input[type=file]');
  inp.onchange=function(){
    var files=Array.prototype.slice.call(inp.files); if(!files.length) return;
    toast('處理照片中…');
    Promise.all(files.map(function(f){return fileToJpeg(f);})).then(function(b64s){ b64s.forEach(function(b){arr.push(b);}); rerender(); });
  };
  box.querySelectorAll('.del').forEach(function(b){ b.onclick=function(){ arr.splice(Number(b.dataset.i),1); rerender(); }; });
}

/* ---------- 影片 ---------- */
var MAX_VIDEO_MB = 30;
function videoField(d){
  var has = d.video && d.video.data;
  var inner = has
    ? '<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--brand-l);font-weight:600;color:var(--ink)">🎬 已選影片（'+d.video.sizeMB+' MB）<button type="button" id="vid_del" style="margin-left:auto;border:0;background:none;color:var(--urgent);font-weight:700;font-size:15px">✕ 移除</button></div>'
    : '<label style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--line);border-radius:10px;background:#fafafa;color:var(--sub);font-weight:600" id="vidlabel">🎥 拍攝 / 選擇影片<input type="file" accept="video/*" capture="environment" style="display:none" id="vid_input"></label>';
  return '<div class="field"><label>現場錄影（選填，上限 '+MAX_VIDEO_MB+'MB）</label>'+inner+'<div class="hint">影片越短檔案越小，越不會上傳失敗；緊急故障建議拍 10～15 秒即可</div></div>';
}
function bindVideoField(d, rerender){
  var inp=document.getElementById('vid_input');
  if(inp){
    inp.onchange=function(){
      var f=inp.files&&inp.files[0]; if(!f) return;
      var mb=f.size/1048576;
      if(mb>MAX_VIDEO_MB){ toast('影片太大（'+mb.toFixed(1)+'MB，上限'+MAX_VIDEO_MB+'MB），請拍短一點'); inp.value=''; return; }
      toast('處理影片中…');
      var r=new FileReader();
      r.onload=function(){ d.video={data:String(r.result).split(',')[1], type:f.type||'video/mp4', sizeMB:mb.toFixed(1)}; rerender(); };
      r.onerror=function(){ toast('影片讀取失敗'); };
      r.readAsDataURL(f);
    };
  }
  var del=document.getElementById('vid_del');
  if(del) del.onclick=function(){ d.video=null; rerender(); };
}

/* ---------- 事件 ---------- */
document.getElementById('fab').onclick=function(){ formDraft=null; state.view='form'; render(); window.scrollTo(0,0); };
document.getElementById('btnSettings').onclick=function(){ state.view='settings'; render(); window.scrollTo(0,0); };
document.getElementById('btnRefresh').onclick=function(){
  if(!cloudReady()){ toast('雲端未設定'); return; }
  var b=document.getElementById('btnRefresh'); b.classList.add('spin');
  toast('重新整理中…');
  syncLoad().then(function(){ b.classList.remove('spin'); toast('已更新'); });
};

/* ---------- 啟動 ---------- */
// 若同資料夾放了 logo.png（或已在設定嵌入 logo），自動換上機構原始 logo
(function loadRealLogo(){
  var saved=load('wx_logo',''); // 可存 base64 dataURL
  var src=saved; if(!src) return;
  var img=new Image();
  img.onload=function(){ var box=document.getElementById('brandLogo'); if(box){ box.innerHTML=''; var el=new Image(); el.src=src; box.appendChild(el); } };
  img.onerror=function(){ /* 沒有就沿用內建向量 logo */ };
  img.src=src;
})();
render();
if(cloudReady()) syncLoad(); else setCloud('bad','未設定');
</script>
