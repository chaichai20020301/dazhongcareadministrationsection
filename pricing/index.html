<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<style>
  :root{
    --bg:#f3f7ee; --card:#fff; --line:#dfe8d5; --text:#233021; --muted:#7c8a72;
    --brand:#5c9a3e; --brand-d:#3f6f2a; --accent:#eef6e6; --sel:#eaf5df; --price:#c05621; --ok:#4e9a3e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-text-size-adjust:100%}
  header{background:#fff;color:var(--text);padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10;border-bottom:3px solid var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.05)}
  header .logo{height:46px;display:block}
  header .sub{font-size:16px;font-weight:800;color:var(--brand-d);border-left:2px solid var(--line);padding-left:12px}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .sp{flex:1}
  header label{color:var(--brand-d);font-weight:600}
  header select{font-size:15px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--text)}
  header .user{font-size:13px;color:var(--muted)}
  .wrap{display:flex;gap:14px;padding:14px;align-items:flex-start}
  .list{width:300px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .list .search{padding:10px;border-bottom:1px solid var(--line)}
  .list .search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  .list .items{max-height:calc(100vh - 170px);overflow:auto}
  .list .r{padding:9px 12px;border-bottom:1px solid #f0f2f5;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .list .r:hover{background:var(--accent)}
  .list .r.sel{background:var(--sel);border-left:4px solid var(--brand)}
  .list .r .bed{color:var(--muted);font-size:13px}
  .detail{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:300px;padding:16px}
  .detail .empty{color:var(--muted);text-align:center;padding:60px 0}
  .rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--brand);padding-bottom:10px;margin-bottom:6px}
  .rhead .name{font-size:22px;font-weight:800}
  .rhead .bed{color:var(--muted)}
  .rhead .room{margin-left:auto;font-size:15px;background:var(--accent);padding:6px 12px;border-radius:8px}
  .rhead .room b{color:var(--price);font-size:18px}
  .grp{margin-top:14px}
  .grp h3{margin:0 0 8px;font-size:14px;color:var(--brand-d);border-left:4px solid var(--brand);padding-left:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .item.on{border-color:var(--brand);background:var(--sel)}
  .item label{flex:1;cursor:pointer}
  .item .price{color:var(--price);font-weight:700;font-size:13px;white-space:nowrap}
  .item input[type=checkbox]{width:20px;height:20px}
  .item input[type=text],.item input[type=number],.item select{width:90px;padding:5px;border:1px solid var(--line);border-radius:6px;font-size:14px}
  .item.wide{grid-column:1/-1}
  .item.wide input[type=text]{width:100%}
  .item .sd{width:140px;padding:5px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  .item .loc{width:110px;padding:5px;border:1px solid var(--line);border-radius:6px;font-size:14px}
  .item .fields{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:2px}
  .active-summary{background:var(--accent);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0}
  .active-summary h3{margin:0 0 8px;font-size:14px;color:var(--brand-d);border-left:4px solid var(--brand);padding-left:8px}
  .active-summary .s-list{margin:0;padding-left:4px;list-style:none}
  .active-summary .s-list li{margin:5px 0;padding:5px 8px;background:#fff;border:1px solid var(--line);border-radius:6px}
  .active-summary .s-since{color:var(--brand-d);font-size:13px;margin-left:4px}
  .active-summary .s-loc{color:#8a4b00;background:#fff2e6;border-radius:4px;padding:1px 6px;font-size:13px;margin-left:4px}
  .active-summary .s-price{color:var(--price);font-weight:700;font-size:13px;float:right}
  .active-summary .s-empty{color:var(--muted)}
  .sec{margin:14px 0 8px;font-size:15px;color:var(--brand-d);border-left:4px solid var(--brand);padding-left:8px}
  .acard{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;margin:8px 0;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .acard-main{display:flex;align-items:center;gap:8px}
  .acard-main b{font-size:16px}
  .acard .s-price{color:var(--price);font-weight:700}
  .acard-fields{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .acard-fields .lbl{color:var(--muted);font-size:13px}
  .acard-fields input,.acard-fields select{padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:14px}
  .acard-fields .sd{width:140px}
  .acard-fields .loc{width:110px}
  .big-m{color:var(--price);font-weight:800;white-space:nowrap}
  .small-m{color:var(--brand-d);font-weight:800;white-space:nowrap}
  .total .big{font-size:20px}
  .btn-rm{background:#fff;border:1px solid #e6b8b8;color:#b23b3b;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
  .btn-rm:hover{background:#fdecec}
  .btn-add{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer}
  .btn-add:hover{background:var(--brand-d)}
  .addbar{margin:12px 0}
  .addpanel{border:1px dashed var(--brand);border-radius:10px;padding:14px;margin:10px 0;background:var(--accent)}
  .addpanel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  .addpanel select,.addpanel input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:15px;background:#fff}
  .addpanel .step{font-weight:700;color:var(--brand-d);min-width:76px}
  .addpanel .lbl{color:var(--muted);font-size:13px}
  .s-empty{color:var(--muted);padding:10px 2px}
  .btn-set{background:#fff;border:1px solid var(--brand);color:var(--brand-d);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:700}
  .btn-set:hover{background:var(--accent)}
  .settings h2{margin:4px 0 4px;font-size:20px}
  .settings .desc{color:var(--muted);font-size:13px;margin-bottom:12px}
  .settings .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table.cat{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
  table.cat th,table.cat td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
  table.cat th{background:var(--accent);color:var(--brand-d);position:sticky;top:0}
  table.cat input,table.cat select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;font-size:14px}
  table.cat input.price{text-align:right}
  table.cat td.num{width:100px}
  table.cat td.act{width:56px;text-align:center}
  .grp-row td{background:#f0f6ea;font-weight:700;color:var(--brand-d)}
  .total{position:sticky;bottom:0;margin-top:18px;background:#fff;border-top:2px dashed var(--line);padding-top:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .total .big{font-size:26px;font-weight:800;color:var(--price)}
  .total .hint{color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .saving{color:var(--muted);font-size:12px;margin-left:6px}
  .pbadge{background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:8px}
  .rbadge{background:#fff4e0;color:#c05621;border:1px solid #f6d5a8;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:8px}
  .acard.ended{opacity:.72;background:#f6f7f5}
  .ebadge{background:#eef0ee;color:#55605a;border:1px solid #dde3dd;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:8px}
  .sec-end{margin:16px 0 6px;color:var(--muted);font-size:14px;font-weight:700;border-top:1px dashed var(--line);padding-top:12px}
  /* 簡化版設定頁 */
  .setgrp{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden;background:#fff}
  .setgrp-h{background:var(--accent);color:var(--brand-d);font-weight:800;padding:8px 12px;border-bottom:1px solid var(--line)}
  .setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid #f0f2f5}
  .setrow:last-child{border-bottom:none}
  .setrow .nm{flex:1;min-width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  .setrow .pw{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--price)}
  .setrow .pw .price{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:right;font-size:15px}
  .setrow .unit{color:var(--muted);font-weight:600;font-size:13px}
  .setrow .adv{font-size:13px}
  .setrow .adv summary{cursor:pointer;color:var(--brand-d);user-select:none;padding:4px 6px}
  .setrow .advbox{display:flex;flex-wrap:wrap;gap:10px;padding:8px;background:#f7faf3;border:1px solid var(--line);border-radius:8px;margin-top:6px}
  .setrow .advbox label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
  .setrow .advbox input,.setrow .advbox select{padding:6px;border:1px solid var(--line);border-radius:6px;font-size:14px;color:var(--text)}
  .btn-add.sm,.btn-rm.sm{padding:6px 10px;font-size:13px}
  .btn-add.big{padding:12px 22px;font-size:16px}
  .setgrp-add{margin:8px 0}
  .rulebox{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .setrow.rule{gap:8px}
  .setrow.rule select{flex:1;min-width:130px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .setrow.rule .price{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:right}
  .setrow.rule .rtxt{color:var(--muted);font-size:14px;white-space:nowrap}
  .savebar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(243,247,238,0),var(--bg) 40%);padding:14px 0 4px;margin-top:16px;text-align:center}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  /* 平板直向／小筆電：名單窄一點，仍維持左右兩欄 */
  @media(max-width:1024px){ .list{width:250px} .wrap{padding:12px;gap:12px} }
  /* 平板直向以下：改成上下堆疊，元件觸控放大 */
  @media(max-width:820px){
    body{font-size:16px}
    .wrap{flex-direction:column;padding:10px;gap:10px}
    .list{width:100%}
    .list .items{max-height:40vh}
    header{padding:8px 12px;gap:8px}
    header .logo{height:38px}
    header h1{font-size:16px}
    header .sub{font-size:14px;padding-left:8px}
    .btn-set{padding:10px 14px;font-size:15px}
    .detail{padding:12px}
    .list .search input,.item input,.item select,.acard-fields input,.acard-fields select,.addpanel input,.addpanel select,table.cat input,table.cat select{font-size:16px}
  }
  /* 手機：標頭斷行、金額字級縮小、卡片欄位換行 */
  @media(max-width:480px){
    header .sub{border-left:none;padding-left:0}
    header .sp{display:none}
    header{gap:6px 10px}
    .grid{grid-template-columns:1fr}
    .acard{align-items:flex-start}
    .total .big{font-size:22px}
    .btn-set{flex:1;text-align:center}
  }
</style>
</head>

<script>
/* ===== 後端連線設定 =====
 * 入口網站頁面在載入本檔前，設定：
 *   window.DZ_API_URL = 'https://script.google.com/macros/s/XXXX/exec';  // Apps Script 部署網址
 *   window.DZ_USER    = '王小明';   // 入口網站登入者（記錄「誰改的」）
 *   window.DZ_TOKEN   = '';         // 如後端有設 API_TOKEN 才需要
 * 若直接用 Apps Script 部署網址開啟，API 位址會自動填入。 */
var API_URL   = (window.DZ_API_URL || 'https://script.google.com/macros/s/AKfycbzPIdwcgvfNaVaVNHhe4CSoF5weV8-l6ZBZ1fKTzEEOgn3BlBLGOxUMXTqbytafvd0u/exec');
var PORTAL_USER = (window.DZ_USER || (function(){try{return (localStorage.getItem('handover_name')||'').trim();}catch(e){return '';}})() || '');
var API_TOKEN = (window.DZ_TOKEN || '');

function _hasGsr(){ return (typeof google!=='undefined' && google.script && google.script.run); }
function callApi(action, params){
  params = params || {};
  // 直接用 Apps Script /exec 開啟且未設定入口網站 API → 走內建橋接（同源、穩定）
  if(!window.DZ_API_URL && _hasGsr()){
    return new Promise(function(resolve,reject){
      var run=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(new Error((e&&e.message)||e));});
      if(action==='bootstrap')        run.api_bootstrap(PORTAL_USER);
      else if(action==='getData')     run.api_getData();
      else if(action==='saveItem')    run.api_saveItem(params.id, params.bed, params.name, params.itemKey, params.value, PORTAL_USER);
      else if(action==='saveCatalog') run.api_saveCatalog(params.list);
      else if(action==='saveRules')   run.api_saveRules(params.rules, PORTAL_USER);
      else if(action==='manage')      run.api_manage(params.op, params, PORTAL_USER);
      else reject(new Error('unknown action: '+action));
    }).then(function(res){ if(res && res.ok===false) throw new Error(res.error||'API 錯誤'); return res; });
  }
  // 放在入口網站（跨網域）→ 走 fetch；讀取類自動重試，避免手機偶發「Load failed」/冷啟動
  params.action = action; params.actor = PORTAL_USER; params.token = API_TOKEN;
  var retryable = (action==='bootstrap' || action==='getData');
  function attempt(n){
    return fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},  // 簡單請求，避開 CORS 預檢
      body: JSON.stringify(params)
    }).then(function(r){ return r.text(); })
      .then(function(t){ try{ return JSON.parse(t); }catch(e){ throw new Error('__net__'); } })  // 冷啟動回 HTML 也走重試
      .catch(function(e){
        if(retryable && n>0){ return new Promise(function(res){ setTimeout(res,(5-n)*800); }).then(function(){ return attempt(n-1); }); }  // 800→3200ms 遞增
        throw (e && e.message==='__net__') ? new Error('連線逾時，請再按一次刷新') : e;
      });
  }
  return attempt(retryable?4:0).then(function(res){ if(res && res.ok===false) throw new Error(res.error||'API 錯誤'); return res; });
}

var STATE={residents:[],catalog:[],rules:[],config:{},user:'',data:{},current:null,days:30};
function currentMonthDays(){var d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1400);}

window.onload=function(){ bootLoad(); };
function bootLoad(){
  callApi('bootstrap').then(onBoot).catch(function(e){
    var el=document.getElementById('resList');
    if(el) el.innerHTML='<div class="loading">後端喚醒中或連線逾時<br><span style="font-size:12px">請稍候再試</span><br><button class="btn-add" style="margin-top:10px" onclick="bootLoad()">重新載入</button></div>';
  });
}
function err(e){alert('發生錯誤：'+(e&&e.message?e.message:e));}

function ridOf(bed,name){ return (bed||'')+'｜'+(name||''); }
function onBoot(d){
  STATE.residents=d.residents; STATE.beds=d.beds||[]; STATE.catalog=d.catalog; STATE.rules=d.rules||[];
  STATE.config=d.config; STATE.user=d.user; STATE.isAdmin=!!d.isAdmin;
  STATE.residents.forEach(function(r){ if(!r.rid) r.rid=ridOf(r.bed,r.name); });
  document.getElementById('userTag').textContent='操作者：'+d.user;
  var br=document.getElementById('btnResidents'); if(br) br.style.display=STATE.isAdmin?'':'none';
  renderList();   // 名單來自 bootstrap，先顯示，不必等計費資料
  loadData();
}
// 一鍵刷新：重抓住民名單／空床／價目與計費資料（不用整頁重整）
function refreshAll(){
  var b=document.getElementById('btnRefresh'); if(b){ b.disabled=true; b.textContent='🔄 更新中…'; }
  callApi('bootstrap').then(function(d){ onBoot(d); toast('已刷新住民名單'); },
                              function(e){ toast('刷新失敗，後端可能喚醒中，請稍候再試'); })
    .then(function(){ if(b){ b.disabled=false; b.textContent='🔄 刷新'; } });
}
var DAYS_BIG=31, DAYS_SMALL=30;  // 大月/小月天數

function loadData(){
  if(!STATE.residents.length) document.getElementById('resList').innerHTML='<div class="loading">載入中…<br><span style="font-size:12px">（後端喚醒中，第一次可能需 10–30 秒）</span></div>';
  callApi('getData').then(function(res){
    STATE.data=res.rows; renderList();
    if(STATE.current) openResident(STATE.current);
  }).catch(function(e){
    renderList();   // 名單已在，計費資料失敗不清畫面，只提示
    toast('計費資料載入失敗，後端喚醒中，請稍候按「🔄刷新」');
  });
}

function renderList(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var box=document.getElementById('resList'); box.innerHTML='';
  STATE.residents.filter(function(r){
    if(!q)return true; return (String(r.bed)+r.name).toLowerCase().indexOf(q)>=0;
  }).forEach(function(r){
    var d=document.createElement('div'); d.className='r'+(STATE.current===r.rid?' sel':'');
    d.innerHTML='<span>'+esc(r.name)+'</span><span class="bed">'+esc(r.bed)+'</span>';
    d.onclick=(function(rid){return function(){openResident(rid);};})(r.rid);
    box.appendChild(d);
  });
}

function groupsOf(){
  var g=[],seen={};
  STATE.catalog.forEach(function(c){if(!seen[c.group]){seen[c.group]=[];g.push(c.group);}seen[c.group].push(c);});
  return {order:g,map:seen};
}

var WOUND_KEYS=['wound_xl','wound_l','wound_m','wound_s'];
function isWound(k){return WOUND_KEYS.indexOf(k)>=0;}
// 傷口換藥次數：QD/BID/TID/QID 下拉；超過(每日5次以上)選「其他」直接填數字，存成「N次/日」
var WOUND_FREQS=[['QD','QD（每日1次）'],['BID','BID（每日2次）'],['TID','TID（每日3次）'],['QID','QID（每日4次）']];
function freqState(cur){
  cur=(cur||'').trim();
  for(var i=0;i<WOUND_FREQS.length;i++){ if(WOUND_FREQS[i][0]===cur) return {sel:cur,num:''}; }
  var m=cur.match(/^(\d+)次\/日$/); if(m) return {sel:'__num__',num:m[1]};
  if(cur) return {sel:'__old__',num:'',old:cur};
  return {sel:'',num:''};
}
// 產生「下拉＋數字」換藥控制項
function freqControlHtml(selId,numId,cur,onSelChg,onNumChg){
  var st=freqState(cur), opts='<option value="">—</option>';
  WOUND_FREQS.forEach(function(o){ opts+='<option value="'+o[0]+'"'+(st.sel===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'; });

function woundFreqVal(key){ var s=gval('wf_'+key); if(s==='__num__'){ var n=(gval('wfn_'+key)||'').trim(); return n?(n+'次/日'):''; } return s; }
function onWoundFreqChange(key){ var show=(gval('wf_'+key)==='__num__'); var n=document.getElementById('wfn_'+key), u=document.getElementById('wfn_'+key+'_u'); if(n)n.style.display=show?'':'none'; if(u)u.style.display=show?'':'none'; saveRow(key); }
function onAddFreqChange(){ var show=(gval('ap_freq')==='__num__'); var n=document.getElementById('ap_freqn'), u=document.getElementById('ap_freqn_u'); if(n)n.style.display=show?'':'none'; if(u)u.style.display=show?'':'none'; }
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function catByKey(key){return STATE.catalog.filter(function(c){return c.key===key;})[0];}
// （已移除價目功能，改為只記「起始～結束」期間）
// 結束日：存在值尾巴標記 ⟦YYYY-MM-DD⟧；無標記＝尚未結束（進行中）
function stripEnd(val){ val=(val==null?'':String(val)); var m=val.match(/⟦([^⟧]*)⟧\s*$/); if(m){ return {base:val.slice(0,m.index).replace(/\s+$/,''), end:(m[1]||'').trim()}; } return {base:val, end:''}; }
function endTag(d){ d=(d||'').trim(); return d?(' ⟦'+d+'⟧'):''; }
function gval(id){var e=document.getElementById(id);return e?e.value:'';}
// 負擔方：把「⟨機構⟩／⟨照服員:姓名⟩」標記存在值尾巴；無標記＝家屬（相容舊資料）
function stripPayer(val){
  val=(val==null?'':String(val)); var payer='家屬', name='';
  var m=val.match(/⟨([^⟩]*)⟩\s*$/);
  if(m){
    val=val.slice(0,m.index).replace(/\s+$/,'');
    var inner=m[1], i=inner.indexOf(':');
    if(i>=0){ payer=(inner.slice(0,i).trim()||'家屬'); name=inner.slice(i+1).trim(); }
    else { payer=(inner.trim()||'家屬'); }
  }
  return {base:val, payer:payer, payerName:name};
}
function payerTag(payer,name){ if(!payer||payer==='家屬') return ''; name=(name||'').trim(); return ' ⟨'+payer+(name?(':'+name):'')+'⟩'; }
// 解析：尾巴有 ⟨負擔方⟩ 與 ⟦結束日⟧；base = 起始日，或傷口「部位｜起始」
function parseVal(key,val){
  var sp=stripPayer(val); var se=stripEnd(sp.base); val=se.base; var out;
  if(val==='') out={active:false};
  else if(isWound(key)){ var p=val.split('｜'); out={active:true, location:(p[0]||'').trim(), date:(p[1]||'').trim(), freq:(p[2]||'').trim()}; }
  else if(/^\d{4}-\d{2}-\d{2}$/.test(val)) out={active:true, date:val};
  else out={active:true, date:'', raw:val};
  out.end=se.end; out.payer=sp.payer; out.payerName=sp.payerName;
  return out;
}
function combineWound(loc,d,freq){ loc=(loc||'').trim(); d=(d||'').trim(); freq=(freq||'').trim(); if(!loc&&!d&&!freq) return ''; var v=loc+'｜'+d; if(freq) v+='｜'+freq; return v; }
// 負擔方下拉；家屬(預設)/機構/照服員
function payerSelectHtml(id,cur,onchg){
  var opts=['家屬','機構','照服員'].map(function(p){return '<option'+(p===cur?' selected':'')+'>'+esc(p)+'</option>';}).join('');
  return '<select id="'+id+'" onchange="'+onchg+'">'+opts+'</select>';
}
// 目前這格已存的 base/end/payer（供保留用）
function curStored(key){ var row=STATE.data[STATE.current]; var raw=row&&row.items?row.items[key]:''; var sp=stripPayer(raw); var se=stripEnd(sp.base); return {base:se.base, end:se.end, payer:sp.payer, payerName:sp.payerName}; }
// 改起始/結束/部位，保留負擔方
function saveRow(key){
  if(isWound(key) && !gval('loc_'+key).trim()){ alert('傷口必須填寫部位。'); renderActive(); return; }
  var st=curStored(key);
  var base = isWound(key) ? combineWound(gval('loc_'+key), gval('s_'+key), woundFreqVal(key)) : gval('s_'+key);
  save(key, base + endTag(gval('e_'+key)) + payerTag(st.payer, st.payerName));
}

function savePayer(key,payer,name){ var st=curStored(key); save(key, st.base + endTag(st.end) + payerTag(payer,name)); }

function onAddPayerChange(){ var payer=gval('ap_payer_sel'); var el=document.getElementById('ap_payer_name'); var show=(payer==='照服員'); if(el){ el.style.display=show?'':'none'; if(!show) el.value=''; } }

// ===== 傷口＝清單（可多處）：值存 JSON 陣列，每處 {loc,freq,s,e,payer,pname} =====
function curRaw(key){ var row=STATE.data[STATE.current]; return row&&row.items?row.items[key]:''; }
function parseWounds(val){
  val=(val==null?'':String(val)).trim(); if(!val) return [];
  if(val.charAt(0)==='['){ try{ var a=JSON.parse(val); if(Array.isArray(a)) return a; }catch(e){} }
  var sp=stripPayer(val), se=stripEnd(sp.base), p=se.base.split('｜');   // 相容舊單筆格式
  return [{loc:(p[0]||'').trim(), s:(p[1]||'').trim(), freq:(p[2]||'').trim(), e:se.end||'', payer:sp.payer, pname:sp.payerName}];
}
function woundFreqValIdx(key,i){ var s=gval('wf_'+key+'_'+i); if(s==='__num__'){ var n=(gval('wfn_'+key+'_'+i)||'').trim(); return n?(n+'次/日'):''; } return s; }
function onWoundFreqChangeIdx(key,i){ var show=(gval('wf_'+key+'_'+i)==='__num__'); var n=document.getElementById('wfn_'+key+'_'+i), u=document.getElementById('wfn_'+key+'_'+i+'_u'); if(n)n.style.display=show?'':'none'; if(u)u.style.display=show?'':'none'; saveWoundEntry(key,i); }
function onWoundPayerChange(key,i){ var show=(gval('pay_'+key+'_'+i)==='照服員'); var el=document.getElementById('payn_'+key+'_'+i); if(el){ el.style.display=show?'':'none'; if(!show) el.value=''; } saveWoundEntry(key,i); }
function saveWoundEntry(key,i){
  if(!gval('loc_'+key+'_'+i).trim()){ alert('傷口必須填寫部位。'); renderActive(); return; }
  var arr=parseWounds(curRaw(key));
  var payer=gval('pay_'+key+'_'+i)||'家屬', pname=(payer==='照服員')?(gval('payn_'+key+'_'+i)||''):'';
  arr[i]={loc:gval('loc_'+key+'_'+i).trim(), freq:woundFreqValIdx(key,i), s:gval('s_'+key+'_'+i), e:gval('e_'+key+'_'+i), payer:payer, pname:pname};
  save(key, JSON.stringify(arr));
}
function removeWoundEntry(key,i){ if(!confirm('確定移除這處傷口？（連歷史一起清除）')) return; var arr=parseWounds(curRaw(key)); arr.splice(i,1); save(key, arr.length?JSON.stringify(arr):''); }
function woundFields(c,w,i){

    +'<input type="text" id="payn_'+key+'_'+i+'" value="'+esc(w.pname||'')+'" placeholder="照服員姓名（多位用、分隔）" style="width:190px;'+(showName?'':'display:none')+'" onchange="saveWoundEntry(\''+key+'\','+i+')">';

}
function woundCardHtml(c,w,i){
  var ended=!!w.e, isOther=(w.payer&&w.payer!=='家屬');
  var title=esc(c.label)+(w.loc?(' ‧ '+esc(w.loc)):'');
  var badges=(isOther?('<span class="pbadge">'+esc(w.payer)+'負擔'+(w.pname?('・'+esc(w.pname)):'')+'</span>'):'')+(ended?('<span class="ebadge">已結束 '+esc(w.e)+'</span>'):'');
  return '<div class="acard'+(ended?' ended':'')+'"><div class="acard-main"><b>'+title+'</b>'+badges+'</div>'

}
// 進行中在上、已結束在下
function renderActive(){
  var box=document.getElementById('activeList'); if(!box) return;
  var row=STATE.data[STATE.current]||{items:{}};
  var prog=[], ended=[];
  STATE.catalog.forEach(function(c){
    var raw=row.items?row.items[c.key]:'';
    if(isWound(c.key)){
      parseWounds(raw).forEach(function(w,i){ (w.e?ended:prog).push(woundCardHtml(c,w,i)); });
    } else {
      var pv=parseVal(c.key, raw); if(!pv.active) return;
      (pv.end?ended:prog).push(acardHtml(c,pv));
    }
  });
  var html = prog.length ? prog.join('') : '<div class="s-empty">目前沒有進行中的計費項目，請按下方「＋ 新增計費項目」加入。</div>';
  if(ended.length){ html+='<h4 class="sec-end">已結束</h4>'+ended.join(''); }
  box.innerHTML=html;
}

    +'<div class="row"><span class="lbl">＊床號只列出目前空床（'+emp+' 床可用）；系統會自動配住民編號。換床請在下表該住民的床號選新的空床。</span></div></div>'
    +'<div class="tbl-wrap"><table class="cat"><thead><tr><th>住民編號</th><th>床號</th><th>姓名</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  document.getElementById('detail').innerHTML=html;
}
function raReload(cb){ callApi('bootstrap').then(function(d){
  STATE.residents=d.residents; STATE.beds=d.beds||[]; STATE.rules=d.rules||[]; STATE.isAdmin=!!d.isAdmin;
  STATE.residents.forEach(function(r){ if(!r.rid) r.rid=ridOf(r.bed,r.name); });
  renderList(); if(cb) cb();
}).catch(err); }
function raAdd(){
  var bed=gv('ra_newbed'), name=gv('ra_newname');
  if(!bed||!name){ alert('請填床號與姓名'); return; }
  callApi('manage',{op:'add',bed:bed,name:name}).then(function(r){ toast('已新增入住 '+(r.id||'')); raReload(renderResidentsAdmin); })
    .catch(function(e){ alert('新增失敗：'+(e&&e.message?e.message:e)); });
}
function raSave(i){
  var r=STATE.residents[i]; if(!r) return;
  if(!r.id){ alert('這位住民還沒有住民編號，請先在主名單補編號（或執行一次自動編號）再修改。'); return; }
  var bed=gv('ra_bed_'+i), name=gv('ra_name_'+i);
  if(!bed||!name){ alert('床號與姓名不可空白（要讓床位變空請用「退住」）'); return; }
  callApi('manage',{op:'update',id:r.id,bed:bed,name:name}).then(function(){ toast('已更新'); raReload(renderResidentsAdmin); })
    .catch(function(e){ alert('更新失敗：'+(e&&e.message?e.message:e)); });
}
function raDischarge(i){
  var r=STATE.residents[i]; if(!r) return;
  if(!confirm('確定讓「'+(r.name||'')+'（'+(r.bed||'')+'）」退住？\n床位會清空，計費歷史仍保留。')) return;
  callApi('manage',{op:'discharge',id:r.id||'',bed:r.bed}).then(function(){ toast('已退住'); raReload(renderResidentsAdmin); })
    .catch(function(e){ alert('退住失敗：'+(e&&e.message?e.message:e)); });
}

// ===== 計費項目設定頁（只管項目名稱與分區，無金額）=====
function openSettings(){
  STATE.editCatalog=(STATE.catalog||[]).map(function(c){return {group:c.group,key:c.key,label:c.label,type:c.type,options:c.options,price:c.price,mode:c.mode,note:c.note};});
  renderSettings();
}
function catRowHtml(i){
  var c=STATE.editCatalog[i];
  var woundTag=isWound(c.key)?'<span class="unit">傷口（記部位）</span>':'';
  return '<div class="setrow">'
    +'<input class="nm" value="'+esc(c.label||'')+'" placeholder="項目名稱" onchange="setEdit('+i+',\'label\',this.value)">'
    +'<span class="pw">'+woundTag+'</span>'
    +'<details class="adv"><summary>進階</summary><div class="advbox">'
      +'<label>所屬大項目<input value="'+esc(c.group||'')+'" onchange="setEdit('+i+',\'group\',this.value)"></label>'
    +'</div></details>'
    +'<button class="btn-rm sm" title="刪除此項目" onclick="delCatItem('+i+')">刪</button>'
  +'</div>';
}
function renderSettings(){
  var order=[], byG={};
  STATE.editCatalog.forEach(function(c,i){ var g=c.group||'其他'; if(!byG[g]){byG[g]=[]; order.push(g);} byG[g].push(i); });
  var groupsHtml=order.map(function(g){
    var items=byG[g].map(function(i){ return catRowHtml(i); }).join('');
    return '<div class="setgrp"><div class="setgrp-h">'+esc(g)+'</div>'+items
      +'<div class="setgrp-add"><button class="btn-add sm" onclick="addCatItemTo(\''+esc(g).replace(/'/g,"\\'")+'\')">＋ 在「'+esc(g)+'」新增項目</button></div></div>';
  }).join('');
  var html='<div class="settings"><button class="btn-set" onclick="closeSettings()">← 返回計費</button>'
    +'<h2>計費項目設定</h2>'
    +'<div class="desc">維護有哪些計費項目、屬於哪個大項目。系統只記錄每個項目在每位住民身上的「起始～結束」期間，沒有金額。改完按下方「儲存」。</div>'
    +groupsHtml
    +'<div class="setgrp-add"><button class="btn-add sm" onclick="addGroup()">＋ 新增大項目</button></div>'
    +'<div class="savebar"><button class="btn-add big" onclick="saveSettings()">💾 儲存設定</button></div>'
    +'</div>';
  document.getElementById('detail').innerHTML=html;
}
function addCatItemTo(g){ STATE.editCatalog.push({group:g||'其他',key:'',label:'',type:'check',options:'',price:0,mode:'月費',note:''}); renderSettings(); }
function addGroup(){ var g=(prompt('新增大項目名稱：','')||'').trim(); if(!g) return; STATE.editCatalog.push({group:g,key:'',label:'',type:'check',options:'',price:0,mode:'月費',note:''}); renderSettings(); }
function setEdit(i,f,v){ STATE.editCatalog[i][f]=v; }
function delCatItem(i){ if(confirm('刪除這個項目？（不影響已登錄的住民資料）')){ STATE.editCatalog.splice(i,1); renderSettings(); } }
function closeSettings(){ if(STATE.current) openResident(STATE.current); else document.getElementById('detail').innerHTML='<div class="empty">← 請先在左側選擇一位住民</div>'; }
function saveSettings(){
  var bad=STATE.editCatalog.filter(function(c){return !(c.label||'').trim();});
  if(bad.length){ alert('有項目未填名稱，請補上或刪除。'); return; }
  toast('儲存中…');
  callApi('saveCatalog',{list:STATE.editCatalog}).then(function(res){
    STATE.catalog=res.catalog; toast('已儲存設定'); closeSettings();
  }).catch(function(e){alert('儲存失敗：'+(e&&e.message?e.message:e));});
}

// 單項月金額：蒸氣化痰=每日×天數；血糖=每次×每日次數×天數；其他=月費固定
function itemAmount(c,val,days){
  if(!c || !c.price) return 0;
  var pv=parseVal(c.key,val);
  if(!pv.active) return 0;
  if(c.type==='number'){ var n=Number(pv.raw||0); return (n>0?c.price*n*days:0); }
  if(c.mode==='日費'){ return c.price*days; }
  return c.price;
}
function isDaily(c){ return c && (c.mode==='日費' || c.type==='number'); }
function calcTotal(row,days){
  var t=0;
  STATE.catalog.forEach(function(c){
    var v=(row.items&&row.items[c.key]!=null)?row.items[c.key]:'';
    t+=itemAmount(c,v,days);
  });
  return t;
}

function save(key,value){
  var rid=STATE.current; if(!rid)return;
  if(!STATE.data[rid]) STATE.data[rid]={items:{}};
  STATE.data[rid].items[key]=value;
  renderActive();
  var r=curRes();
  var tag=document.getElementById('savingTag'); if(tag) tag.textContent='儲存中…';
  callApi('saveItem',{id:r.id||'',bed:r.bed,name:r.name,itemKey:key,value:value})
    .then(function(){ if(tag) tag.textContent=''; toast('已儲存'); })
    .catch(function(e){ if(tag) tag.textContent=''; alert('儲存失敗：'+(e&&e.message?e.message:e)); });
}

// ===== 匯出當下計價總表（CSV，Excel 可直接開）=====
function csvCell(s){ s=(s==null?'':String(s)); return /[",\n\r]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s; }
function stamp(){ var d=new Date(),p=function(n){return('0'+n).slice(-2);}; return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); }
function exportCSV(){
  var head=['床號','姓名','住民編號','大項目','項目','部位','換藥次數','起始日','結束日','狀態','負擔方','照服員/原因'];
  var list=[];
  Object.keys(STATE.data||{}).forEach(function(rid){
    var r=STATE.data[rid]; if(!r||!r.items) return;
    var info=(STATE.residents||[]).filter(function(x){return x.rid===rid;})[0]||r;
    (STATE.catalog||[]).forEach(function(c){
      var raw=r.items[c.key];
      if(isWound(c.key)){
        parseWounds(raw).forEach(function(w){
          list.push([ info.bed||r.bed||'', info.name||r.name||'', info.id||r.id||'',
            c.group||'', c.label||c.key, (w.loc||''), (w.freq||''), (w.s||''), (w.e||''),
            (w.e?'已結束':'進行中'), w.payer||'家屬', w.pname||'' ]);
        });
        return;
      }
      var pv=parseVal(c.key, raw); if(!pv.active) return;
      list.push([ info.bed||r.bed||'', info.name||r.name||'', info.id||r.id||'',
        c.group||'', c.label||c.key, '', '', (pv.date||''), (pv.end||''),
        (pv.end?'已結束':'進行中'), pv.payer||'家屬', pv.payerName||'' ]);
    });
  });
  if(!list.length){ alert('目前沒有計費項目可匯出。（可先按「🔄 刷新」載入最新資料）'); return; }
  list.sort(function(a,b){ return a[0]>b[0]?1:(a[0]<b[0]?-1:0); });
  var lines=[head.map(csvCell).join(',')];
  list.forEach(function(row){ lines.push(row.map(csvCell).join(',')); });
  var csv='﻿'+lines.join('\r\n');   // BOM 讓 Excel 正確顯示中文
  var name='計費項目起訖表_'+stamp()+'.csv';
  try{
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },800);
  }catch(e){
    // 後備：沙箱環境擋下載時，改開新視窗讓使用者自行另存
    var w=window.open('','_blank'); if(w){ w.document.write('<pre>'+esc(csv)+'</pre>'); }
  }
  toast('已匯出 '+list.length+' 筆計價項目');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(n){n=Number(n)||0;return n.toLocaleString('en-US');}
</script>
